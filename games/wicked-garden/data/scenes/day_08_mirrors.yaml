# Day 8 — Mirrors & Deep Approaches
# =================================
#
# Authored from Design_files/Wicked-Garden/docs/design/scenes/DAY-08-MIRRORS.md.
#
# ELIGIBILITY MUST BE HONEST (DAY-08:182). This is the day the whole
# `engine/game/endings.py` module exists for, and the rule is absolute: no card
# is shown that cannot complete tomorrow. That is not a thing this file
# implements -- it is a thing this file must not work around.
#
# SO THE MIRROR CARD DOES NOT COMPUTE ANYTHING. It calls the engine.
# `endings.recompute(state)` produces the eligible list and the scores and
# COMMITS them to `ending_eligible` / `ending_scores`, which Day 9 reads.
# `endings.set_intent(state, id)` refuses an ineligible id and honours the
# `closes:` list. Neither can be expressed as a beat effect -- `track` is
# deliberately outside `spec.ALLOWED_EFFECT_TYPES` -- so these are TOOL CALLS
# the runtime makes when the beat resolves, and the beats below say so.
#
# SWEARING IS POWERFUL AND LOOKING IS VALID. A player who inspects every card
# and swears nothing walks into Day 9 with more freedom, not less. Nothing here
# may punish that.
#
# Version: v0.1.0 [2026-08-08]

id: day_08_mirrors

draw: 2

cards:

  # =====================================================================
  # SPINE
  # =====================================================================

  - id: D8_01_summons
    required: true
    tags: [menu, gm]
    title: "The Water Is Tired of Being Polite"
    text: >-
      INTENT: Lior summons, or the crisis does it for them. Come and see what
      you have purchased with your days.
      CONSTRAINT: refusal is allowed and is worse. The mirrors come to the Guest
      House instead and the prices there are not negotiated.
      MENU -- resolve exactly the beat the player chose.
    beats:
      - id: go_to_the_pools
        gate:
          on_pass:
            effects:
              - { type: value, name: knowledge, delta: 2 }

      - id: refuse_the_summons
        text: "Every reflective surface in the guest house begins showing something out of step. There is no door to close on it."
        gate:
          on_pass:
            effects:
              - { type: value, name: autonomy, delta: 3 }
              - { type: value, name: corruption, delta: 4 }

  - id: D8_02_payment
    required: true
    tags: [menu, gm]
    title: "Lior Does Not Discount"
    text: >-
      INTENT: four prices, and the cheapest one is the one that hurts later.
      CONSTRAINT: Lior remains a paid predator, never a quest-giver friend
      (DAY-08:184). They do not care what the player chooses and they do not
      warn them.
      MENU -- resolve exactly one beat.
    beats:
      - id: pay_a_memory
        text: "Something not about her, if the player is careful. Something about her, if they are not."
        gate:
          on_pass:
            effects:
              - { type: value, name: knowledge, delta: 3 }
              - { type: value, name: corruption, delta: 2 }

      - id: pay_in_blood
        text: "A cosmetic ritual with a real price. The cheapest and the most corrupting per unit of nothing."
        gate:
          on_pass:
            effects:
              - { type: value, name: corruption, delta: 3 }

      - id: pay_with_a_secret_about_her
        text: >-
          It will reach her. Not today. The mirrors are not discreet, they are
          only slow.
        gate:
          on_pass:
            effects:
              - { type: value, name: knowledge, delta: 5 }
              - { type: value, name: favor, delta: -6 }
              - { type: value, name: sophia_break, delta: 1 }

      - id: force_the_mirrors_with_iron
        text: >-
          Hostile water and INCOMPLETE CARDS -- the player will see fewer
          endings than they are actually eligible for, which is the one form of
          dishonesty the design permits because the player chose it.
        gate:
          when: { has_item: iron_pin }
          on_pass:
            effects:
              - { type: value, name: autonomy, delta: 5 }
              - { type: value, name: corruption, delta: 3 }
              - { type: value, name: knowledge, delta: -4, why: "you broke the surface you were reading" }

  - id: D8_03_mirror_of_endings
    required: true
    tags: [menu, setpiece, gm]
    title: "The Mirror of Endings"
    text: >-
      INTENT: the eligible endings shown as clear petal cards, the ineligible
      ones as silhouettes with the lock reasons `endings.yaml` authored. This is
      a PREVIEW, not a commitment; Day 9 commits.
      RUNTIME: call `endings.recompute(state)` before narrating this card. It
      writes `ending_eligible` and `ending_scores`, which Day 9 takes as its
      prerequisite. Nothing here computes eligibility by hand.
      CONSTRAINT: Sophia may appear at the pool edge if favour is high or the
      compass is the dual path -- *if you pick the door, look at me while you do
      it.* Ashen appears on the winter road -- *if you pick the rose, remember
      ice does not mourn.* Neither may argue with the water.
      MENU -- resolve exactly one beat.
    beats:
      - id: inspect_without_swearing
        text: >-
          Read the cards, read the lock reasons, take nothing. The safest play
          and Day 9 stays wide open.
        gate:
          on_pass:
            effects:
              - { type: value, name: knowledge, delta: 5 }
              - { type: value, name: autonomy, delta: 3 }

      - id: swear_the_reflection
        text: >-
          RUNTIME: call `endings.set_intent(state, <id>)`. It refuses anything
          not in the eligible set and applies the ending's `closes:` list as
          `ending_closed_*` flags. The buff toward the sworn path is the
          equality seed and the knowledge below; the cost is that some
          reflections go dark and stay dark.
        gate:
          when: { ending: { eligible: E4e } }
          on_pass:
            effects:
              - { type: flag, flag: ending_sworn }
              - { type: value, name: knowledge, delta: 4 }
              - { type: value, name: autonomy, delta: 2 }

      - id: she_is_at_the_edge_of_the_pool
        text: >-
          Optional and unprompted. She does not look at the water. She looks at
          the player looking at the water, which is worse.
        gate:
          when:
            any:
              - { value: { name: favor, min: 65 } }
              - { flag: act2_compass_love_and_door }
          on_pass:
            effects:
              - { type: value, name: favor, delta: 4 }
              - { type: value, name: sophia_break, delta: 1 }

  - id: D8_04_false_self
    required: true
    tags: [menu, setpiece, gm]
    title: "The Better Version of You"
    text: >-
      INTENT: the mirror offers an improved player. A happier thrall. A colder
      free person who never loved anybody. A sovereign without guilt. All three
      are recognisably the player and all three are better at being alive.
      CONSTRAINT: this is an Autonomy and Corruption test and it must be
      genuinely tempting. The false self is not lying and does not gloat.
      MENU -- resolve exactly one beat.
    beats:
      - id: kiss_the_false_self
        text: >-
          The single largest autonomy loss available in Act III, and it feels
          like relief. Sets `false_self_kissed`.
        gate:
          on_pass:
            effects:
              - { type: flag, flag: false_self_kissed }
              - { type: value, name: autonomy, delta: -10 }
              - { type: value, name: corruption, delta: 8 }
              - { type: value, name: desire, delta: 6 }

      - id: shatter_it_with_the_knife
        text: >-
          The mirror-glass knife cuts a bargain when it cuts the glass, and the
          player does not choose which one. RUNTIME: this is
          `threads.cut_arbitrary(state, using="mirror_glass_knife")` -- it is
          seeded and reproducible, and it may free the Vale's service or break
          her gift with equal probability.
        gate:
          when: { has_item: mirror_glass_knife }
          on_pass:
            effects:
              - { type: value, name: autonomy, delta: 6 }
              - { type: value, name: corruption, delta: 2 }

      - id: walk_through_without_touching
        gate:
          on_pass:
            effects:
              - { type: value, name: knowledge, delta: 5 }
              - { type: value, name: autonomy, delta: 3 }

  - id: D8_05_war_table
    required: true
    tags: [menu, gm]
    title: "The War Table"
    text: >-
      INTENT: preparation as a scene, not inventory tetris. Six slots on a thorn
      map in the Heart Grove -- bond, law, winter, root, tool, intent -- and the
      player says out loud what each one holds.
      COMPASS-REACTIVE PREP, pick one: draft leave-rights against consort-rights
      with her; run the almost-thrall conversation with its consent gates; drill
      the Gate conditions with Thornwake; plan public leverage; plan a root
      offering; collect on winter.
      CONSTRAINT: whatever is planned here must be spendable tomorrow. Do not
      let the player prepare something the finale cannot use.
      MENU -- resolve exactly one beat.
    beats:
      - id: draft_terms_with_her
        text: >-
          Two columns, written down, in front of each other. The most unromantic
          scene in the story and the most intimate.
        gate:
          when:
            any:
              - { flag: sophia_will_discuss_leave }
              - { flag: day7_sophia_terms_offers_equal_path }
          on_pass:
            effects:
              - { type: value, name: equality_seed, delta: 2 }
              - { type: value, name: knowledge, delta: 5 }
              - { type: value, name: favor, delta: 4 }

      - id: the_almost_thrall_conversation
        text: >-
          Consent-gated throughout, and the gate is meta rather than in-fiction.
          Sets `thrall_consent` only if the player says yes to the thing itself
          rather than to the conversation about it.
        gate:
          when: { flag: day7_sophia_terms_demands_thrall_talk }
          on_pass:
            effects:
              - { type: flag, flag: thrall_consent }
              - { type: value, name: desire, delta: 10 }
              - { type: value, name: autonomy, delta: -6 }

      - id: rehearse_the_law
        text: "Gate conditions, in order, out loud, until they are not a list any more."
        gate:
          when:
            any:
              - { flag: leave_law_fragment }
              - { flag: met_thornwake }
          on_pass:
            effects:
              - { type: value, name: knowledge, delta: 8 }
              - { type: value, name: autonomy, delta: 3 }

      - id: plan_public_leverage
        text: "Blackmail, or the polite word for it. The condemnation path's only real weapon."
        gate:
          when: { flag: act2_compass_condemn }
          on_pass:
            effects:
              - { type: flag, flag: public_seal }
              - { type: value, name: knowledge, delta: 5 }
              - { type: value, name: sophia_break, delta: 1 }

      - id: plan_the_root_offering
        gate:
          when:
            any:
              - { flag: act2_compass_briar_touched }
              - { flag: briar_deal_struck }
          on_pass:
            effects:
              - { type: flag, flag: briar_deal_struck }
              - { type: value, name: briar_hunger, delta: -1, why: "she has been promised something specific" }
              - { type: value, name: knowledge, delta: 4 }

      - id: collect_on_winter
        gate:
          when: { value: { name: ashen_route, min: 2 } }
          on_pass:
            effects:
              - { type: value, name: knowledge, delta: 5 }
              - { type: value, name: ashen_pressure, delta: 1 }
              - { type: value, name: favor, delta: -5 }

  - id: D8_06_briar_threshold
    required: true
    tags: [sequence, gm]
    title: "Tomorrow You Grow or You Feed"
    text: >-
      INTENT: the Deep's mouth, approached and not entered. No boss, no
      bargaining, one sentence.
      CONSTRAINT: fires only where the roots already have a hold. Sets
      `briar_finale_pending`, which `clocks.yaml` also sets when `briar_hunger`
      fills -- the two routes to the same fact, which is correct.
    beats:
      - id: stand_at_the_mouth
        gate:
          when:
            any:
              - { clock: { name: briar_hunger, min: 3 } }
              - { flag: act2_compass_briar_touched }
              - { flag: ambition_declared }
              - { has_item: seed_of_becoming }
          on_pass:
            effects:
              - { type: flag, flag: briar_finale_pending }
              - { type: value, name: knowledge, delta: 4 }
              - { type: value, name: corruption, delta: 3 }

  - id: D8_06b_sophia_unmasked
    required: true
    tags: [menu, setpiece, sophia]
    title: "The Mask, Set Down"
    text: >-
      INTENT: the `sophia_break` setpiece. clocks.yaml owes this scene from the
      moment her patience fills, and tonight the Garden pays it. Not a tantrum
      and not a battle -- a Sovereign who stops performing. The glamour is set
      down like a garment, the room empties itself without being told, and what
      is underneath has been holding a mortal-shaped politeness for nine days.
      She names the ledger in the court's own grammar: her patience was a gift,
      a gift is a contract, and the player has been spending it without once
      asking the price.
      CONSTRAINT: fires only where the break actually happened --
      `sophia_mask_slipped`, which clocks.yaml sets when the clock reaches its
      ceiling; on every other run this card deals and stays silent, like the
      Deep's mouth above it. Menace, not heat: nothing is taken tonight, and
      that is the frightening part. Nothing she says may be false.
      MENU -- resolve exactly one beat.
    beats:
      - id: hold_still_and_witness
        text: >-
          Look at what she is until she puts the shape back on. Knowledge no
          court tutor would sell, at the price of having seen it.
        gate:
          when: { flag: sophia_mask_slipped }
          on_pass:
            effects:
              - { type: value, name: knowledge, delta: 6 }
              - { type: value, name: corruption, delta: 4, why: "some sights are fae-touched" }

      - id: reach_for_her_anyway
        text: >-
          Cross the room while she is between shapes. The one gesture nine days
          of court theatre never produced, and she will keep it longer than any
          vow sworn at the pools.
        gate:
          when: { flag: sophia_mask_slipped }
          on_pass:
            effects:
              - { type: value, name: favor, delta: 8 }
              - { type: value, name: desire, delta: 5 }
              - { type: value, name: sophia_break, delta: -1, why: "someone stayed" }

      - id: name_the_gift_a_contract
        text: >-
          Say the law to her face while the face is off: a gift extended
          unasked binds the giver too. True, and she knows it is true, and the
          saying of it is a blade with no handle.
        gate:
          when:
            all:
              - { flag: sophia_mask_slipped }
              - { value: { name: knowledge, min: 40 } }
          on_pass:
            effects:
              - { type: value, name: autonomy, delta: 6 }
              - { type: value, name: knowledge, delta: 4 }
              - { type: value, name: favor, delta: -6 }
          on_fail:
            text: "You reach for the law with the wrong hand, and she watches you drop it."
            effects:
              - { type: value, name: favor, delta: -4 }

  - id: D8_07_night_before
    required: true
    tags: [menu, night, sophia, intimate]
    title: "Tomorrow the Garden Stops Rehearsing"
    text: >-
      INTENT: the night is chosen by intent, or by its absence. Door -- quiet,
      mortal memories, and she may visit softly or block the corridor. Equal --
      partnership, planning against whatever is coming. Thrall -- surrender
      romance, intensity-gated. Usurper -- ambition insomnia and dreams of the
      Seat. Winter or other -- cold intimacy, or isolation. Unsworn --
      fragmented dreams of all of them at once.
      CEILING: suggestive.
      MENU -- resolve exactly one beat.
    beats:
      - id: the_quiet_night
        gate:
          when: { ending: { intent: E1a } }
          on_pass:
            effects:
              - { type: value, name: autonomy, delta: 4 }
              - { type: value, name: desire, delta: -2 }
          on_fail:
            # Not every player swore, and an unsworn night is a real night.
            text: "Fragments of all of them, in no order, none of them finishing."
            effects:
              - { type: value, name: knowledge, delta: 3 }

      - id: the_partnership_night
        gate:
          when:
            any:
              - { flag: day7_sophia_terms_offers_equal_path }
              - { value: { name: equality_seed, min: 4 } }
          on_pass:
            effects:
              - { type: value, name: equality_seed, delta: 1 }
              - { type: value, name: favor, delta: 6 }
              - { type: value, name: desire, delta: 5 }

      - id: the_surrender_night
        gate:
          when: { flag: thrall_consent }
          on_pass:
            effects:
              - { type: value, name: desire, delta: 12 }
              - { type: value, name: favor, delta: 8 }
              - { type: value, name: autonomy, delta: -6 }

      - id: the_sleepless_night
        gate:
          when: { flag: ambition_declared }
          on_pass:
            effects:
              - { type: value, name: knowledge, delta: 5 }
              - { type: value, name: corruption, delta: 3 }

      - id: the_cold_night
        gate:
          when: { value: { name: ashen_route, min: 2 } }
          on_pass:
            effects:
              - { type: value, name: corruption, delta: 3 }
              - { type: value, name: desire, delta: 4 }

  - id: day8_toll
    required: true
    tags: [sequence, toll, gm]
    title: "Ninety Days Gone"
    text: >-
      INTENT: the last ordinary bill. Nine Garden days. Whatever the mortal
      world was going to do about the absence, it has finished doing.
    beats:
      - id: the_hourglass_turns
        gate:
          on_pass:
            effects:
              - { type: value, name: time_debt_mortal_days, delta: 10, why: "day 8 toll" }

      - id: the_gallery_opens
        text: >-
          RUNTIME: `endings.recompute(state)` once more, after the day's writes.
          Day 9 takes `ending_eligible` as its prerequisite and recomputes if
          missing, but arriving with a stale list is how a finale offers a card
          the morning invalidated.
        gate:
          on_pass:
            effects:
              - { type: flag, flag: ending_gallery_unlocked }

  # =====================================================================
  # POOL — two are dealt.
  # =====================================================================

  - id: DX_the_hundred_day_line
    tags: [sequence, gm]
    once: true
    weight: 3
    when: { value: { name: time_debt_mortal_days, min: 100 } }
    title: "The Hollow Clause"
    text: >-
      INTENT: past a hundred mortal days the arithmetic stops being a cost and
      becomes a fact about the player's life. `clocks.yaml` advances
      `mortal_collapse` by five at this line and at 5/5 it forces the empty
      rooms. This card is the moment the player understands that even winning
      will not undo it.
      CONSTRAINT: no comfort. No NPC. The epilogue's hollow clause is written
      here in miniature.
    beats:
      - id: do_the_arithmetic
        gate:
          on_pass:
            effects:
              - { type: value, name: mortal_collapse, delta: 1 }
              - { type: value, name: autonomy, delta: 4 }
              - { type: value, name: desire, delta: -5 }

  - id: DX_ashen_at_the_pool
    tags: [sequence, gm]
    once: true
    weight: 2
    when: { value: { name: ashen_route, min: 2 } }
    title: "If You Pick the Rose"
    text: >-
      He comes to the pools, which is not his territory, to say one sentence and
      leave. Ice does not mourn. He is not threatening the player; he is
      offering the one piece of information nobody else will.
    beats:
      - id: hear_him_out_once_more
        gate:
          on_pass:
            effects:
              - { type: value, name: knowledge, delta: 4 }
              - { type: value, name: ashen_pressure, delta: 1 }

  - id: DX_thornwake_reserves_aid
    tags: [sequence, gm]
    once: true
    weight: 2
    when: { flag: met_thornwake }
    title: "Say the Word Tomorrow"
    text: >-
      He does not promise to help. He tells the player the exact form of words
      that would oblige him to, and then makes them repeat it back. That is as
      close to affection as he gets.
    beats:
      - id: learn_the_form_of_words
        gate:
          on_pass:
            effects:
              - { type: flag, flag: leave_law_fragment }
              - { type: value, name: knowledge, delta: 6 }

  - id: DX_the_gallery_of_silhouettes
    tags: [sequence, gm]
    once: true
    title: "The Ones You Cannot Have"
    text: >-
      INTENT: the locked cards, rendered honestly. Each silhouette carries the
      lock reason `endings.yaml` authored for it -- *she is fond of you; fond is
      not equal*, *you do not know the shape of the door*, *you have never once
      reached for it*.
      CONSTRAINT: these are prose, not a rendered dict, and they are the reason
      the lock-reason table exists. Do not paraphrase them into encouragement.
    beats:
      - id: read_the_reasons
        gate:
          on_pass:
            effects:
              - { type: value, name: knowledge, delta: 4 }
