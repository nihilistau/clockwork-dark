# Epilogue index — The Wicked Garden
# ==================================
#
# Transcribed from Design_files/Wicked-Garden/docs/design/epilogues/epilogue-index.json.
# Titles, gallery keys, echo speakers and NG+ seeds for all twenty-three
# endings. The prose lives beside this in `epilogue_cards.yaml`.
#
# WHY THIS IS YAML AND NOT THE ORIGINAL JSON. Every other data file this story
# loads is YAML, and a renderer that has to know which of two parsers to reach
# for per file is a renderer with a bug in it. Nothing was dropped in the
# conversion; `tests/test_wicked_garden_scenes.py` asserts this file and the
# design JSON still declare the same twenty-three ids with the same gallery keys.
#
# THE GALLERY KEY IS NOT THE ENDING ID. `gate_tender_release`, not `E1a`. The
# finale unlocks art by gallery key and the QA checklist's last line
# (DAY-09-FINALE.md:351) is about exactly this.
#
# LOADED BY `engine/game/epilogue.py`, through `paths.epilogues`. `render_order`,
# `time_line_template` and the hollow clause are honoured there; the substituted
# `mortal_days` reads the declared `time_debt_mortal_days` value rather than
# recomputing `garden_days * 10`, which would forgive the extra shards a lost
# labyrinth owes. `mortal_days_formula` below documents how the toll maintains
# that value -- it is not evaluated.
#
# STILL UNRENDERED. The engine can produce an Epilogue; no screen draws one yet.
#
# Version: v0.1.1 [2026-08-09]

version: 1
prose_source: epilogue_cards.yaml

# Substituted at runtime from state. `garden_days` is the Garden day index;
# `mortal_days` is `time_debt_mortal_days`, which is authoritative -- it carries
# the extra shards a lost labyrinth and a wasted hour added, so recomputing it
# as days * 10 would under-report a bad run.
time_line_template: >-
  You spent {garden_days} {garden_days_word} in the Wicked Garden. Outside,
  roughly {mortal_days} {mortal_days_word} passed.
mortal_days_formula: "garden_days * 10 + extra_shards"

render_order: [title, card_m, card_g, echoes, time_line, gallery_unlock]

# Injected into any E1 or E2 mortal card past the line. A door that opens onto a
# decade is not a victory and the epilogue is not allowed to imply otherwise.
hollow_clause_if_time_debt_gte: 100
hollow_clause_text: >-
  Even this ending cannot give you back the years the hourglass already ate.

