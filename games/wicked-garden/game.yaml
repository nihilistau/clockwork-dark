# The Wicked Garden.
#
# The third story, and the one the engine was rebuilt for. The Clockwork Dark
# and The Drowned Carillon are cousins -- same mechanics, different nouns. This
# one shares almost nothing with either: no combat, no HP, no hunger, no dice,
# no travel graph in the usual sense, no character classes. What it has instead
# is twelve declared meters and clocks, persistent contracts, a ten-day chapter
# clock that spends an irreversible resource, and two agents who argue.
#
# If this file needed an engine change to work, the engine is still shaped like
# the flagship. It did not.
#
# Version: v0.1.0 [2026-08-08]

id: wicked-garden
title: "The Wicked Garden"
version: "0.1.0"
engine_requires: ">=0.2.0"

blurb: >-
  A garden between worlds, and the High Fae who has decided she wants you.
  One day here is ten days at home, and the toll is charged whether you spend
  it well or not. Please her, match her, escape her, or be consumed.

# Which client plugin draws this story. The value is what an omitted block
# would have resolved to anyway -- the server falls back to the slug -- but
# the fallback exists for scratch stories, not shipped ones: a story the repo
# ships says which skin it wears rather than relying on its directory being
# named after one.
ui:
  plugin: wicked-garden

# ---------------------------------------------------------------------------
# Which scene serves this story, declared rather than inherited.
#
# The engine's default scene and default screens (engine/scenes/spec.py),
# exactly -- the turn loop, the socket contract, and the paths-driven journal,
# codex and pack screens all resolve through this manifest, so this story has
# nothing to replace yet. Declared anyway: a story that runs the default by
# SAYING so is a story whose game.yaml answers the question, and the day this
# story ships its own screens the change is one line here. `name` keys the
# `scene.clockwork.*` config block, which is where port and host live.
# ---------------------------------------------------------------------------
scene:
  name: clockwork
  module: engine.scenes.default_scene
  blueprint: "engine.scenes.default_api:story_blueprint"

settings:
  world:
    # A Garden day is a chapter, not a commute. The flagship's two hours per
    # turn is tuned for a story where you walk between villages; here the day
    # advances when a chapter ends, and the night toll is the thing that costs.
    # Time passing on its own would charge the player ten mortal days for
    # thinking.
    tick_hours: 0.0
    tick_max_hours: 0.0
    # No doom clock. The pressure in this story is four named clocks and a debt
    # that only ever grows -- see clocks.yaml. Leaving the flagship's rate on
    # would run a second, invisible apocalypse underneath it.
    evil_base_rate_per_day: 0.0

  # The prompt shapers this story runs.
  #
  # The engine's default chain is The Clockwork Dark's: `EvilPhaseTone` reads
  # the doom phase and instructs "Tone: cosy frontier life; the wrongness is
  # barely a rumour", and `DoomSignsInterceptor` narrates a doom ledger this
  # story does not keep. Both fired here -- so the Garden's narrator was being
  # told to write cosy frontier life while standing at a fae threshold.
  #
  # Kept: SafetyDirective (standing constraints, emits nothing when a story
  # configures no limits) and StorytellerMind, which is genuinely generic --
  # it renders the GM's cruelty/generosity/patience knobs and names no story.
  governance:
    directives:
      - SafetyDirective
      - StorytellerMind

# WHAT THIS STORY DELIBERATELY SHIPS NONE OF.
#
# Until config/default.yaml was emptied, an undeclared path did not mean
# nothing -- it meant The Clockwork Dark's file. This story was reading NINE of
# them: assistant_hints, challenges, comfyui_templates, doom_effects, economy,
# encounters, procgen_templates, quests and recipes. A fae court was quoting
# Edgewood's bread prices and holding Edgewood's quests, silently, because
# nothing here has a quest giver or a vendor to make it visible.
#
# They are omitted rather than pointed at a stub, and the omission is the
# authoring decision, one line each:
#
#   quests             the shape of this story is ten authored days
#                      (`decks`), not an offer board.
#   economy            nothing here is bought. A bargain is the currency, and
#                      that is `threads`.
#   encounters         danger is written into the day chapters, not drawn from
#                      a road table.
#   recipes            nothing is crafted.
#   challenges         set-pieces are cards in the labyrinth deck.
#   doom_effects       there is no doom clock here; `clocks` holds this story's
#                      own, which count something else.
#   procgen_templates  every location in this world is authored. There is no
#                      village to generate.
#   comfyui_templates  the art pack below is what this story shows.
#   assistant_hints    the companion here is a character with her own prompt
#                      (prompts/sophia.md), not a hint corpus.
#
# Each resolves empty now, which every loader reads as "this story ships none
# of this". If one of them is ever authored, it goes in the block below.
#
# AND TWO THAT ARE OMITTED BY ABSENCE RATHER THAN BY OMISSION. `paths.rules`
# below names a directory, and five filenames are found INSIDE it by fixed name
# (docs/AUTHORING.md §2.2) -- there is no key to leave out, so not shipping the
# file IS the declaration. This story ships archetypes, clocks, endings and
# threads in there, and deliberately not these:
#
#   survival.yaml      no hunger, no stamina, no food. Time in the Garden is
#                      counted by the ten-day toll, not by meals.
#   skills.yaml        no dice at all. Nothing here is resolved by a roll; a
#                      bargain is resolved by its terms.
#
# That absence is load-bearing and visible: `legal_intents` offers this story
# `travel` and NOTHING else -- no `rest`, no `eat`, no `check` -- because the
# engine only offers a verb it can honour. If either file ever appears in that
# directory, this story silently grows a mechanic it was designed without.
paths:
  # Content authored for this story.
  #
  # DECLARE EVERYTHING THIS STORY SHIPS. Leaving `npc_schedules` off this list
  # used to put eight Edgewood villagers at locations that do not exist in this
  # graph, have the Garden gossiping about grain tallies, and resolve
  # reputation against a militia nobody here has heard of.
  locations: "games/wicked-garden/data/world/locations.yaml"
  items: "games/wicked-garden/data/items"
  lore: "games/wicked-garden/data/lore"
  lore_db: "games/wicked-garden/data/lore/lore.db"
  art_subjects: "games/wicked-garden/data/art/subjects.yaml"
  # The Garden's own art pack.
  #
  # `art_root` is the directory `art_manifest`'s paths resolve against, and it
  # has to be declared: it used to default to The Clockwork Dark's static tree,
  # so a manifest without it named Garden filenames inside Edgewood's directory,
  # missed every one, and fell silently through to the procedural silhouette.
  # That is what this story shipped with.
  #
  # The pack is reachable over HTTP at `/story-art/...` (engine/api/art.py),
  # which is what the manifest's `root:` names. It is NOT under /static --
  # that handler belongs to the scene package, not to the active game.
  art_root: "games/wicked-garden/data/art/plates"
  art_manifest: "games/wicked-garden/data/art/manifest.yaml"
  # The narrator's own words. Without this the model is told it is running The
  # Clockwork Dark, which is exactly what it did.
  prompts: "games/wicked-garden/prompts"
  npc_schedules: "games/wicked-garden/data/world/npc_schedules.yaml"
  world_rumors: "games/wicked-garden/data/world/rumors.yaml"
  factions: "games/wicked-garden/data/world/factions.yaml"
  world_schedules: "games/wicked-garden/data/world/schedules.yaml"
  tables: "games/wicked-garden/data/tables"

  # Its own rules directory, so `archetypes.yaml` resolves here rather than to
  # Edgewood's. Without this the Garden reads the flagship's file and offers a
  # wayfarer, a hearthkeeper and a tinker's apprentice.
  rules: "games/wicked-garden/data/rules"

  # Structural systems, declared per story.
  threads: "games/wicked-garden/data/rules/threads.yaml"
  endings: "games/wicked-garden/data/rules/endings.yaml"
  clocks: "games/wicked-garden/data/rules/clocks.yaml"
  # The ten day-chapters AND the labyrinth deck, in one directory.
  #
  # `paths.decks` is a single flat directory, so the days sat in
  # `data/scenes/` where nothing could reach them -- 5,300 lines of authored
  # content that loaded in a test and was invisible to the game. The labyrinth
  # deck moved in beside them rather than teaching the loader to take a list:
  # a day chapter and a chamber deck are the same kind of thing to this engine,
  # and one directory is easier to be right about than two.
  decks: "games/wicked-garden/data/scenes"

  # The last words a run gets. A directory, not a file: the index and the prose
  # are separate documents that change for different reasons, and the index
  # names its own prose file (`prose_source`) so this story could split the
  # cards per ending class later without an engine change.
  epilogues: "games/wicked-garden/data/epilogues"

  # Saves are namespaced per story by the store; this is the root it uses.
  saves: "data/saves"

entry:
  # The mortal side of the threshold, not the Gate.
  #
  # DAY-00 is a prologue in which you CROSS, and the crossing is the first
  # thing the story asks you to choose. Starting at the Gate would begin the
  # game one decision after its opening question.
  #
  # `mortal_threshold` has no inbound edge anywhere in the graph, deliberately:
  # going home is an ending, not a travel action. That makes it unreachable and
  # therefore only ever a starting point, which is exactly right.
  location_id: mortal_threshold

  # What a turn says when the model is unreachable. Without this the engine
  # speaks its neutral line; with it, even an outage stays in the Garden's
  # register. One sentence, no mechanics.
  fallback_narration: >-
    The garden holds itself very still, and the briars lean closer to listen.

  # DAY-00. The crossing is the first thing the story asks you to decide, and
  # the toll is named before you choose rather than after -- 05-BACKSTORY:113,
  # "consent is complicated in fantasy; meta-consent is absolute", applies to
  # the player as much as the character. Nobody walks in here uninformed.
  opening:
    narration: >-
      There is a gate in the hedge that was not there yesterday, and the air on
      the other side is warmer than the season allows. Briars have grown over
      the arch in a pattern too regular to be an accident, and something on the
      far side has been waiting long enough to be patient about it. You know,
      the way you know things in dreams, that a day spent past that arch costs
      ten at home — and that the counting starts the moment you step through.
    # (a) IS THE CROSSING, so it declares it. An opening choice that MOVES,
    # SPENDS or RISKS anything carries a structured `intent` and the engine
    # resolves it before the second beat is written (engine/game/intents.py).
    # Without one, "Step through" was a sentence handed to a narrator: the
    # model wrote the player past the arch and the save still read
    # `mortal_threshold`, which is the defect the intent mechanism exists to
    # close -- it was only ever proven on the flagship's opening.
    #
    # The target is the one edge leaving here, and it is ONE-WAY on purpose
    # (data/world/locations.yaml: no `gate_of_briars -> mortal_threshold` edge
    # exists or may exist). So this intent is the point of no return, which is
    # exactly what the narration has just finished warning about. It costs the
    # hour the edge declares and the awareness the crossing is worth; the
    # engine spends both.
    #
    # (b) and (c) declare NOTHING, and each for its own reason. Asking the toll
    # is talk -- the narrator's whole job, and an intent there would resolve
    # nothing. Turning around is not a travel action in this story: going home
    # is an ENDING, priced by the endings spine, and a travel intent would hand
    # it out for an hour of walking. There is deliberately no edge to name.
    choices:
      - id: a
        text: "Step through"
        intent: { action: travel, target: gate_of_briars }
      - { id: b, text: "Ask what it costs, and wait for an answer" }
      - { id: c, text: "Turn around and go home" }
  # One, and it is the point of the story rather than a placeholder. Being
  # mortal is what every fae here finds interesting about you and what the
  # ten-day toll is charged against.
  #
  # The engine does support a story declaring `archetypes: []` -- that path is
  # real and tested, and closing it fixed a genuine bug where the flagship's
  # "wayfarer" had three separate homes and was reinstated at the end of the
  # chain. But an empty character-creation panel is a worse screen than a
  # one-line answer, and "Human" is the honest one here.
  archetypes: [human]
