# Nave Encounters -- under the quay, where the organ is.
#
# Covers the two deepest edges: wet_steps<->sunken_nave and
# sunken_nave<->choir_loft. This is the dungeon band, and it is the one place
# in the game where the Tide-Cantor can be met.
#
# THE TIDE-CANTOR IS THE RETARGET PROOF. It is the ported bestiary's boss, and
# every mechanic that resolves it is engine code written for a brass thing in
# a birch stand four hundred miles inland: the trigger probability off the
# edge's `danger_dc`, the `sympathy` band check through
# engine/game/checks.py, the resolve-stripping scene loop, the effect
# application. Nothing in engine/ was edited to make a sea-chime unmakeable.
# The unmaking is naming, here as there; only the name changed.
#
# Version: v0.1.0 [2026-08-08]

band: nave

encounters:

  - id: the_water_finding_its_level
    tier: 2
    weight: 26
    triggers:
      edges:
        - "wet_steps>sunken_nave"
        - "sunken_nave>wet_steps"
    intro: >-
      The nave is at knee height and rising a finger's width at a time, and
      the pillars are doing something with the sound of it: every drip comes
      back as a chord, and the chord is getting closer to being a word.
    threat: { name: "Water finding its level", resolve: 3 }
    approaches:
      read_the_water:
        skill: survival
        difficulty: standard
        text: "Work out how long you have by the pillar stains"
      wade:
        skill: nerve
        difficulty: standard
        text: "Go straight through and do not listen"
      listen:
        skill: sympathy
        difficulty: hard
        text: "Let the chord finish and hear what it is trying to say"
    outcomes:
      crit_success:
        text: >-
          Two hours, by the green line on the third pillar, and you spend
          eleven minutes of them working out that the chord is the interval
          the shore-bell was cast to. The Carillon is answering a bell nobody
          has rung in eleven years, and it has not stopped waiting.
        effects:
          - { type: awareness, delta: 6 }
          - { type: focus, delta: 1 }
          - type: ledger_fact
            kind: engine
            text: "The nave's dripping came back as the shore-bell's own interval. It is still answering."
      success:
        text: >-
          Two hours or a little under. You cross on the raised floor of the
          side aisle with your jaw set and get to the far end dry to the hip.
        effects:
          - { type: awareness, delta: 3 }
          - { type: stamina, delta: -8 }
      partial:
        text: >-
          You cross. You are wet to the chest and you have lost track of how
          long you stood at the fourth pillar, which is not a thing you do.
        effects:
          - { type: awareness, delta: 4 }
          - { type: stamina, delta: -15 }
      failure:
        text: >-
          The water is at your waist and the chord has resolved, and what it
          resolved into was your own name in your own voice, which you have
          never heard from outside your head before.
        effects:
          - { type: awareness, delta: 7 }
          - { type: stamina, delta: -20 }
          - type: check_penalty
            text: "your own name, from outside"
            delta: -2
            skills: [nerve, sympathy, lore]
            days: 3

  - id: chime_husk_choir
    tier: 3
    weight: 20
    triggers:
      edges:
        - "wet_steps>sunken_nave"
        - "sunken_nave>wet_steps"
      phases: [spreading, consuming]
    art: clockwork_thing
    intro: >-
      Six of them are standing in the nave in two ranks, facing the pipework,
      chest-deep and perfectly still except for the jaw of each one, which is
      open, and which is producing a note. They are in tune with each other.
      That took someone effort.
    threat: { name: "A choir of chime-husks", resolve: 6 }
    approaches:
      name_them:
        skill: sympathy
        difficulty: severe
        text: "Name them, all six, in the order they went into the water"
      go_around:
        skill: stealth
        difficulty: hard
        text: "Take the side aisle and stay off the beat"
      wax:
        skill: craft
        difficulty: standard
        requires_item: wax_earplugs
        text: "Wax, and work by the pillar stains alone"
    outcomes:
      crit_success:
        text: >-
          You get four of the six names and the other two from the way the
          first four go quiet. The rank comes apart. They do not fall; they
          go down into the water in order, the way a congregation leaves.
        effects:
          - { type: awareness, delta: 7 }
          - { type: focus, delta: 2 }
          - { type: item, item_id: salvaged_brass, name: "Salvaged chime-brass", qty: 2, tags: [material] }
          - type: ledger_fact
            kind: engine
            text: "Six chime-husks in the nave came apart when they were named in order."
      success:
        text: >-
          Two of them lose the note. The rank does not, but the gap is enough
          and you are through it.
        effects:
          - { type: awareness, delta: 5 }
          - { type: stamina, delta: -12 }
      partial:
        text: >-
          You get past along the aisle. Behind you the chord adds a voice,
          which means the count is seven now and you did not see the seventh
          arrive.
        effects:
          - { type: awareness, delta: 6 }
          - { type: stamina, delta: -18 }
      failure:
        text: >-
          They turn their heads together, on the beat, and hold the note while
          they do it, and the water between you goes flat and still as glass.
        effects:
          - { type: awareness, delta: 8 }
          - { type: stamina, delta: -22 }
          - type: check_penalty
            text: "six faces on the beat"
            delta: -3
            skills: [nerve, sympathy]
            days: 3

  - id: the_tide_cantor
    tier: 4
    weight: 40
    art: clockwork_thing
    triggers:
      edges:
        - "sunken_nave>choir_loft"
        - "choir_loft>sunken_nave"
    intro: >-
      It is standing on the loft stair with one hand on the rail, brass to the
      throat and salt-white above it, and it is keeping the organ's time. Not
      playing it. Keeping its time, the way a man keeps a promise. The
      tuning-fork is at its belt where a knife would be.
    threat: { name: "The Tide-Cantor", resolve: 9 }
    approaches:
      unmake_it:
        skill: sympathy
        difficulty: legendary
        text: "Name what it was before it kept time"
      still_the_fork:
        skill: craft
        difficulty: severe
        text: "Get the tuning-fork off its belt and damp it"
      hold_the_stair:
        skill: nerve
        difficulty: severe
        text: "Stand on the stair and refuse to be moved off it"
      read_it:
        skill: lore
        difficulty: hard
        text: "Work out what the organ is actually being tuned to"
    outcomes:
      crit_success:
        text: >-
          You name it. Not a title -- a name, the one on a stone in the
          quay's own yard, and you say it the way its mother would have. The
          brass stops being a throat. What goes into the water is a man of
          about fifty who has been very tired for a long time, and the organ
          loses its time and does not find it again while you are down there.
        effects:
          - { type: awareness, delta: 10 }
          - { type: focus, delta: 3 }
          - { type: flag, flag: nf_cantor_unmade, value: true }
          - { type: item, item_id: tuning_fork, name: "Drowned tuning-fork", qty: 1, tags: [quest] }
          - type: ledger_fact
            kind: engine
            text: "The Tide-Cantor was named and unmade on the choir-loft stair, and the organ lost its time."
      success:
        text: >-
          It comes apart at the seam of the throat and goes down the stair in
          pieces, still ringing, and the fork comes away in your hand.
        effects:
          - { type: awareness, delta: 8 }
          - { type: stamina, delta: -20 }
          - { type: flag, flag: nf_cantor_unmade, value: true }
          - { type: item, item_id: tuning_fork, name: "Drowned tuning-fork", qty: 1, tags: [quest] }
      partial:
        text: >-
          You get onto the loft. It is still on the stair behind you keeping
          time, and now you are between it and the water.
        effects:
          - { type: awareness, delta: 6 }
          - { type: stamina, delta: -25 }
          - type: check_penalty
            text: "a thing on the stair behind you"
            delta: -2
            skills: [nerve, stealth]
            days: 2
      failure:
        text: >-
          It turns its head to the exact degree required and no further, and
          sounds one note, and the note is the interval between your heartbeat
          and the next one. You come to on the ninth step with the water at
          your knees and no memory of the climb.
        effects:
          - { type: awareness, delta: 9 }
          - { type: stamina, delta: -30 }
          - type: wound
            severity: 2
            text: "a chime where a heartbeat used to be"
            skills: [nerve, survival]
            heals_on_day: 5
