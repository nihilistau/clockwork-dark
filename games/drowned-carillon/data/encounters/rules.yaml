# Encounter Rules -- The Drowned Carillon.
#
# The same file, in the same schema, read by the same
# engine/game/encounter.py as the flagship game's. The numbers differ because
# the coast is a smaller, steeper map than Edgewood: four dangerous legs
# instead of a road network, every one of them going down.
#
# WHY THE BASE RATE IS HIGHER HERE: Edgewood's forest walk is an hour through
# country people cross every day, and most of what happens on it is not a
# monster. The Wet Steps are somewhere nobody sane goes twice. A trip down
# should nearly always cost something, so `base` is non-zero and
# `per_danger_dc` is steeper -- the quay-to-steps leg lands near 45% by day,
# and the choir loft is at the ceiling whatever the hour.
#
# WHY NIGHT IS ONLY SLIGHTLY WORSE: on this coast the dangerous variable is
# the tide, not the dark, and the tide is not a time of day. Dusk and night
# carry a modest multiplier so the dial is not dead, and the real pressure
# comes from `evil_progress_bonus`, which is the water rising.
#
# Version: v0.1.0 [2026-08-08]

version: 1

trigger:
  base: 0.06
  per_danger_dc: 0.032
  time_of_day:
    dawn: 1.1
    day: 0.9
    dusk: 1.15
    night: 1.3
  evil_progress_bonus: 0.20
  stealth_reduction_per_point: 0.02
  min_chance: 0.0
  max_chance: 0.70

scene:
  max_rounds: 3
  default_resolve: 3
  degree_resolve:
    crit_success: 5
    success: 3
    partial: 1
    failure: 0
  ends_on: [crit_success, failure]

degree_fallback:
  crit_success: [success]
  success: [crit_success]
  partial: [failure, success]
  failure: [partial]

# ------------------------------------------------------------
# Approaches merged into EVERY encounter.
# ------------------------------------------------------------
#
# `flee` is the engine's soft-lock guarantee and is mandatory. `stop_your_ears`
# is this game's own universal option and is the clearest single proof that the
# table, not the engine, decides what a player may do: it is gated on an item
# id that exists only in this game's registry, and the engine's
# `_approach_available` enforces that gate without knowing what wax is.
default_approaches:
  flee:
    skill: survival
    difficulty: easy
    text: "Get back above the water line"
    ends: true
    outcomes:
      crit_success:
        text: "You are up and out on the dry stone before the sound has finished deciding about you."
        outcome: "broken_off"
      success:
        text: "You go back the way you came at a walk, because running on wet granite is how people drown."
        outcome: "broken_off"
      partial:
        text: "You get clear the long way, over the bar, and the cold gets into you doing it."
        outcome: "broken_off"
        effects:
          - { type: stamina, delta: -8 }
      failure:
        text: "It follows you as far as the ninth step, which is where the green starts, and then it simply stops."
        outcome: "broken_off"
        effects:
          - { type: stamina, delta: -15 }
          - { type: awareness, delta: 1 }

  stop_your_ears:
    skill: nerve
    difficulty: easy
    requires_item: wax_earplugs
    text: "Wax in your ears and keep your eyes on your hands"
    ends: true
    outcomes:
      crit_success:
        text: >-
          Everything goes to muffled sea-noise and the pressure of your own
          pulse. Whatever wanted your attention does not get it, and after a
          while it stops asking.
        outcome: "broken_off"
        effects:
          - { type: focus, delta: 1 }
      success:
        text: >-
          The note thins out to nothing much. You work past it looking at the
          steps and not at what is on them.
        outcome: "broken_off"
      partial:
        text: >-
          You hear it through the wax anyway, in the bones behind your jaw,
          and you are tired in a way that sleep is not going to touch.
        outcome: "broken_off"
        effects:
          - { type: stamina, delta: -10 }
      failure:
        text: >-
          Wax is for sound. The Carillon has never only been sound. You take
          your fingers out of your ears because it seemed important to hear
          the rest of it, and you cannot account for the next few minutes.
        outcome: "broken_off"
        effects:
          - { type: awareness, delta: 4 }
          - { type: stamina, delta: -15 }
