# Natural 1 complications (d20) on the Brass Coast — the engine picks one; the
# LLM narrates it only.
#
# The companion to boons.yaml in this directory, and it exists for the same
# reason: engine/game/checks.py used to hardcode ``data/tables/``, so a fumble
# on the Wet Steps cost the player a complication written about a forest road.
#
# Same schema as the flagship game's data/tables/complications.yaml.
#
# Tone: the coast charges in salt, hours and hearing. Nothing here is a
# monster. The sea takes a little, the damp takes a little, and the note in
# the water takes something you cannot name until later.
#
# Version: v0.1.0 [2026-08-08]

complications:

  - id: went_in_to_the_knee
    text: "The stone was not where it looked. You go in to the knee and come out slower."
    applies_to: [stealth, survival, craft]
    effects:
      - { type: stamina, delta: -10 }

  - id: salt_in_the_cut
    text: "An old cut opens and the water finds it immediately."
    effects:
      - { type: wound, text: "Salt-opened cut", severity: 1, check_penalty: -2, skills: [craft, stealth], heals_on_day: "+3" }

  - id: the_note_gets_in
    text: "The chime finds the gap between your teeth and stays there."
    applies_to: [nerve, lore, sympathy]
    effects:
      - { type: check_penalty, delta: -2, days: 2, text: "the note will not leave" }

  - id: caught_by_the_turn
    text: "The tide turns while your back is to it and takes the hour you needed."
    effects:
      - { type: stamina, delta: -8 }
      - { type: hunger, delta: 8 }

  - id: soaked_provisions
    text: "Your pack went under. What was food is now salt."
    effects:
      - { type: remove_item, item_id: ships_biscuit, qty: 1 }

  - id: lost_the_lamp_oil
    text: "The jar goes over on the wet step and empties itself into a crack."
    applies_to: [survival, stealth, craft]
    effects:
      - { type: remove_item, item_id: lamp_oil, qty: 1 }

  - id: parted_twine
    text: "The line parts in your hands and takes the knuckle with it."
    applies_to: [craft]
    effects:
      - { type: remove_item, item_id: net_twine, qty: 1 }
      - { type: hp, delta: -1 }

  - id: the_quay_hears_about_it
    text: "It is a small quay and you did it in front of the wrong window."
    applies_to: [persuasion, sympathy, stealth]
    effects:
      - { type: reputation, faction: quayfolk, delta: -4 }

  - id: a_warden_writes_it_down
    text: "One of the wardens takes out a stub of chalk and marks the post."
    applies_to: [nerve, lore]
    effects:
      - { type: reputation, faction: bell_wardens, delta: -3 }

  - id: the_factor_deducts
    text: "It comes off the ledger before you have finished explaining."
    applies_to: [persuasion, craft]
    effects:
      - { type: reputation, faction: inland_factors, delta: -3 }
      - { type: gold, delta: -2 }

  - id: it_hears_you
    text: "Something a long way down changes what it was doing."
    applies_to: [stealth, sympathy, lore]
    effects:
      - { type: awareness, delta: 4 }
      - { type: ledger_fact, text: "Was heard by the thing under the nave.", kind: engine }

  - id: ruined_hands
    text: "Cold, wet rope all afternoon. Your hands stop closing properly."
    effects:
      - { type: check_penalty, delta: -1, days: 1, text: "hands will not close" }
      - { type: stamina, delta: -5 }

  - id: turned_ankle_on_the_steps
    text: "The eleventh step is worn hollow and you find out how."
    applies_to: [survival, stealth, nerve]
    effects:
      - { type: wound, text: "Turned ankle", severity: 1, check_penalty: -2, skills: [stealth, survival], heals_on_day: "+4" }
