# Trade on Bellfounders' Quay.
#
# Same schema and the same claim as data/tables/trade.yaml: every item has a
# price with anyone who deals in that kind of thing, derived from its registry
# value, and games/drowned-carillon/data/economy.yaml is an override layer
# rather than the whole market. Before this, selling was inert -- a vendor with
# no `buys` row refused the item, so everything the tide gave you was worth
# nothing to everybody.
#
# THE COAST'S OWN ECONOMICS: the spread here is wider than Edgewood's because
# everything on this quay came in by boat, and the scarcity table runs the
# opposite way for brass. As the Carillon rises, brass gets DEARER rather than
# cheaper -- Halloran is buying it faster than the tide gives it up, and the
# wardens want it out of the water at any price. Food follows the same curve as
# inland, because hunger is hunger.
#
# Consumed by engine/game/trade.py through paths.tables.
#
# Version: v0.1.0 [2026-08-08]

version: 1

trade:
  spread:
    buy: 1.35
    sell: 0.45

  min_sale_price: 1
  never_traded_tags: [quest]

  haggle:
    skill: persuasion
    attempts_per_day: 1
    hours: 0.5
    degrees:
      crit_success: 18
      success: 10
      partial: 4
      failure: -6
    cap: 22
    bands:
      - { upto: 5,  band: easy }
      - { upto: 12, band: standard }
      - { upto: 20, band: hard }
      - { band: severe }

  scarcity:
    dormant: {}
    stirring:
      food: 1.15
      light: 1.2
      charm: 1.25
    spreading:
      food: 1.5
      light: 1.5
      charm: 1.6
      # Brass goes UP here, not down: the wardens are buying it out of the
      # water faster than the tide gives it up.
      material: 1.35
      trade: 1.2
    consuming:
      food: 2.1
      light: 1.9
      charm: 2.0
      material: 1.6
      trade: 1.3

vendors:

  npc_cael:
    name: "Brother Cael"
    faction: bell_wardens
    location: lamp_house
    deals_in: [light, tool, charm, material, food]
    spread: { buy: 1.25, sell: 0.5 }

  npc_vesh:
    name: "Salt-Widow Vesh"
    faction: quayfolk
    location: net_lofts
    deals_in: [food, material, tool, trade]
    spread: { buy: 1.2, sell: 0.5 }

  npc_halloran:
    name: "Halloran the bellfounder"
    faction: inland_factors
    location: bellfounders_quay
    # Brass, and things that stop brass. Nothing else interests him.
    deals_in: [material, trade, charm]
    spread: { buy: 1.4, sell: 0.55 }

  npc_orsel:
    name: "Orsel"
    faction: quayfolk
    location: bellfounders_quay
    deals_in: [food, material, trade]
    spread: { buy: 1.3, sell: 0.45 }
