# Collectable sets on the Brass Coast.
#
# Read by engine/game/inventory.py::evaluate_collections through paths.tables,
# exactly as data/tables/collections.yaml is in the flagship game. Two sets,
# not five, because this coast has twenty-one items and not eighty-one; the
# mechanic scales down without needing a second implementation.
#
# WHY THESE TWO. `lamp_keepers_kit` is the equipment of an actual job on this
# quay -- Cael's job -- and assembling it is how a stranger stops being one.
# `low_water_finds` is the four things the flats give up, and the reward is
# Halloran finally saying what he does with the brass, which is the only
# question anybody on the quay actually wants answered.
#
# Set shape and the "counted on what is carried" rule: see the header of
# data/tables/collections.yaml.
#
# Version: v0.1.0 [2026-08-08]

version: 1

collections:

  - id: lamp_keepers_kit
    name: "A lamp-keeper's kit"
    blurb: >-
      Lantern, oil, needle, knife and a pair of wax plugs. Cael has carried
      exactly these five things every night for eleven years and has never
      once been asked why.
    items: [storm_lantern, lamp_oil, net_needle, gutting_knife, wax_earplugs]
    reward_text: >-
      Cael looks at what you are carrying, then up at the lamp, then back, and
      hands you the second key without a word about it.
    effects:
      - type: reputation
        faction: quayfolk
        delta: 7
      - type: check_penalty
        id: collection_lamp_keepers_kit
        text: "a lamp-keeper's kit"
        delta: 1
        skills: [survival]
        expires_day: 1000000000
      - type: flag
        flag: lamp_keepers_kit_complete
      - type: ledger_fact
        text: "You carry a full lamp-keeper's kit, and Cael handed you the second key."
        kind: event

  - id: low_water_finds
    name: "What low water gives up"
    blurb: >-
      Driftwood, green brass, chime-brass off the flats, and a gull's flight
      feather in hammered metal that came off something that was flying at the
      time. Four things the sea put down and did not come back for.
    items: [driftwood, green_brass, salvaged_brass, brass_quill]
    reward_text: >-
      Halloran weighs the lot, pays over the odds, and then tells you what he
      does with it, which is the part you were actually asking for.
    effects:
      - type: gold
        delta: 14
      - type: awareness
        delta: 3
      - type: check_penalty
        id: collection_low_water_finds
        text: "you know what the flats give up"
        delta: 1
        skills: [lore]
        expires_day: 1000000000
      - type: flag
        flag: low_water_finds_gathered
      - type: ledger_fact
        text: "Halloran told you what he does with the green brass. You wish he had not."
        kind: secret
