# Craft recipes on the Brass Coast.
#
# Read by engine/skills/builtin/mechanics.py::_load_recipes, same schema as
# data/recipes/*.yaml. Every input, tool and output id exists in
# games/drowned-carillon/data/items/coast.yaml.
#
# `damp_a_casting` is this game's equivalent of the flagship's
# `bind_sympathy_charm`: the one recipe in the directory that uses the
# sympathy skill, the hardest band here, and the only one that makes a thing
# whose purpose is to stop something from being heard.
#
# Version: v0.1.0 [2026-08-08]

version: 1
category: coast

recipes:

  - id: splice_net_twine
    name: "Lay up a hank of twine"
    category: coast
    skill: craft
    band: easy
    hours: 2
    tools: [net_needle]
    inputs:
      - { id: net_twine, qty: 2 }
    output: { id: mended_net, qty: 1 }
    success_text: >-
      Three strands, tarred, laid up even the whole length. It will outlast
      the boat it goes on.
    failure_text: >-
      The lay is uneven and it will pull crooked under load, which means it
      will fail in weather, which is when it matters.

  - id: pinch_earplugs
    name: "Pinch a pair of earplugs"
    category: coast
    skill: craft
    band: easy
    hours: 1
    inputs:
      - { id: beeswax, qty: 1 }
    output: { id: wax_earplugs, qty: 4 }
    success_text: >-
      Four cones, warm from the hand, wrapped two and two in oilcloth. Cael
      would charge you for these and would also be glad you made them.
    failure_text: >-
      Too soft, and they will work loose in the ear at exactly the moment
      loose is expensive.

  - id: damp_a_casting
    name: "Sew a damping cloth"
    category: coast
    skill: sympathy
    band: severe
    hours: 6
    tools: [gutting_knife]
    inputs:
      - { id: salvaged_brass, qty: 1 }
      - { id: beeswax, qty: 1 }
      - { id: net_twine, qty: 2 }
    output: { id: damping_cloth, qty: 1 }
    success_text: >-
      Felt, wax and a coin of green brass sewn into the lining, and the whole
      of it goes dead in the hand. Lay it on a thing and the thing stops
      wanting to be heard. You will feel that for a day.
    failure_text: >-
      The brass rings while you are sewing it in, and keeps ringing after you
      stop, and you put the whole of it in the sea and do not go back for it.

  # ------------------------------------------------------------
  # Added when items were given verbs (v0.2.0). `green_brass` and `driftwood`
  # came off the flats in quantity and had nowhere to go but a vendor's scale.
  # ------------------------------------------------------------

  - id: smelt_green_brass
    name: "Smelt down green brass"
    category: coast
    skill: craft
    band: standard
    hours: 4
    inputs:
      - { id: green_brass, qty: 3 }
      - { id: driftwood, qty: 2 }
    output: { id: salvaged_brass, qty: 2 }
    success_text: >-
      Corrosion off, the metal poured out clean, and it goes quiet in the mould
      for the first time since the tide put it down.
    failure_text: >-
      It sings the whole way through the pour, and what comes out of the mould
      is still singing, so it goes back on the tide line where you found it.
    salvage: { id: green_brass, qty: 1 }

  - id: render_lamp_oil
    name: "Render a jar of lamp oil"
    category: coast
    skill: survival
    band: easy
    hours: 3
    tools: [gutting_knife]
    inputs:
      - { id: salt_fish, qty: 3 }
      - { id: driftwood, qty: 1 }
    output: { id: lamp_oil, qty: 2 }
    success_text: >-
      Boiled down and strained through the twine. Burns dirty, burns anyway,
      and the quay has never had anything better.
    failure_text: >-
      Caught at the bottom and went to smoke. The lamp house will smell of it
      until the next spring tide.
