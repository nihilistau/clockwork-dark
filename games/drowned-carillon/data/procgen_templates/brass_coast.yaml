# Brass Coast procgen templates -- seeded quay + tide flats.
#
# Read by engine/game/procgen.py. Names, roles, buildings and counts are all
# content; the generator is not.
#
# KNOWN ENGINE LIMIT, recorded here rather than hidden: engine/game/procgen.py
# ::_build_forest hardcodes `location_id: "forest_clearing"` for forage nodes
# and picks `leads_to` from the literal list
# ["deeper_forest", "old_barrows", "herb_glen"]. Those are Edgewood ids, so on
# this coast the generated forage nodes and hidden paths hang off places that
# do not exist in this game's graph. Nothing crashes -- the ids are simply
# never matched by anything -- but the feature is inert here until those two
# lists become content. `forage_resources` and `barrow_names` below are
# authored anyway, so that fix is a one-file change when it happens.
#
# Version: v0.1.0 [2026-08-08]

