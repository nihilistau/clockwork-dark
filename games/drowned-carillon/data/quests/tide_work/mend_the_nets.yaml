# Version: v0.1.0 [2026-08-08]
#
# The quiet-life proof for this game. Nothing in it requires the player to
# ever learn the word Carillon, and it pays in the coin the quay actually
# uses. A player can do this, and the oil run, and nothing else, for forty
# days, and the world will still be doing what it does -- which is the whole
# thesis, transplanted.

id: mend_the_nets
arc: tide_work
name: "Three Strands at a Time"
summary: >-
  Vesh is behind on the set-nets and will take help if it is offered in a way
  she does not have to acknowledge.

preconditions:
  all:
    - min_day: 1

start_text: >-
  There is a second beam free in the loft and a needle on it that has been put
  there for somebody. It has been there two days.

stages:
  - id: learn_the_needle
    objective: "Take the net needle in the lofts and be shown the three-strand splice."
    complete_when:
      all:
        - at_location: net_lofts
    complete_text: >-
      She shows you once, at full speed, and then watches you do it wrong four
      times without saying anything at all.
    on_complete:
      effects:
        - type: item
          item_id: net_needle
          name: "Net needle"
          qty: 1
          tags: [tool]
        - type: craft
          delta: 1

  - id: work_the_beam
    objective: "Put in a full day on the beam. She counts hours, not intentions."
    complete_when:
      all:
        - at_location: net_lofts
        - hour_between: [14, 18]
        - has_item: { id: net_needle, qty: 1 }
    complete_text: >-
      Your hands are tar to the second knuckle and the hole in the middle of
      the net is not there any more. She looks at it for a while.
    on_complete:
      effects:
        - type: item
          item_id: mended_net
          name: "Mended set-net"
          qty: 1
          tags: [quest, trade]
        - type: stamina
          delta: -14
        - type: reputation
          faction: quayfolk
          delta: 3
        - type: ledger_fact
          kind: event
          subject_id: npc_vesh
          text: "Put a full day on the beam in Vesh's loft and mended a set-net through."

on_complete:
  effects:
    - type: gold
      delta: 6
