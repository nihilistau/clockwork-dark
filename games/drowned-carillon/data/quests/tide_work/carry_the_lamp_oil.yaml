# Version: v0.1.0 [2026-08-08]
#
# Ported from the source project's games/drowned-carillon/data/contracts.yaml
# (`carry_the_lamp_oil`). That file was written for a ContractBoard this engine
# does not have; conflict and commitment here are quests and encounter scenes,
# so the contract became a two-stage quest with the same giver, the same
# location, the same reward shape and the same instruction not to hum on the
# steps.

id: carry_the_lamp_oil
arc: tide_work
name: "Carry the Lamp Oil"
summary: >-
  Vesh needs the season's oil up to the head of the quay before the grey
  afternoon, and she is particular about how it is carried.

preconditions:
  all:
    - min_day: 2

start_text: >-
  Vesh puts a stone jar in each of your hands without asking and tells you
  where they go. Then she tells you not to hum on the steps, and does not
  explain, and goes back to the mesh.

stages:
  - id: take_the_jars
    objective: "Take the oil jars from the net lofts."
    complete_when:
      all:
        - at_location: net_lofts
    complete_text: >-
      Four jars, stoppered and waxed, heavier than they look because fish oil
      always is.
    on_complete:
      effects:
        - type: item
          item_id: lamp_oil
          name: "Jar of lamp oil"
          qty: 4
          tags: [tool, trade]

  - id: deliver_before_dark
    objective: "Get the oil to the Lamp House before the light goes."
    expires_after_days: 3
    complete_when:
      all:
        - at_location: lamp_house
        - has_item: { id: lamp_oil, qty: 4 }
    fail_when:
      any:
        # Selling the oil is a legitimate way to fail this. The quay has
        # opinions about it and the quest does not moralise; it just ends.
        - not_has_item: { id: lamp_oil, qty: 1 }
    fail_text: >-
      The oil went somewhere else. Cael says nothing about it, which is worse
      than if he had.
    complete_text: >-
      Cael takes them two at a time and sets them on the shelf under the wax.
      He says the quay has four lamps with glass in them and he intends to
      keep all four lit.
    on_complete:
      effects:
        - type: remove_item
          item_id: lamp_oil
          qty: 4
        - type: stamina
          delta: -10
        - type: gold
          delta: 3
        - type: reputation
          faction: quayfolk
          delta: 2
        - type: ledger_fact
          kind: event
          subject_id: npc_vesh
          text: "Carried Vesh's season oil up to the Lamp House without humming on the steps."

on_complete:
  effects:
    - type: reputation
      faction: bell_wardens
      delta: 2
