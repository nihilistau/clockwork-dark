# The two arcs of The Drowned Carillon.
#
# Read by engine/game/quests.py. The flagship game has four arcs; this one has
# two, and that is a content decision the engine does not have an opinion
# about -- a game is however many arcs its arcs.yaml declares.
#
# Tide Work is not a tutorial and it is not a failure state. A player who mends
# nets, carries oil, sells brass to Halloran and never goes below the ninth
# step has finished the game. The gate below only OPENS a door.
#
# Version: v0.1.0 [2026-08-08]

version: 1

arcs:
  tide_work:
    name: "Tide Work"
    default: true
    involvement: 0
    order: 0
    blurb: >-
      Net twine, lamp oil, a chowder pot that has been on since before light,
      and the six hours a day the bar is walkable.

  the_stilling:
    name: "The Stilling"
    involvement: 20
    order: 1
    unlock_text: >-
      You have started keeping your own tide table, and it does not agree with
      the one nailed to the notice-board post.
    blurb: >-
      Something under the quay is keeping time, and the quay has been letting
      it. Reaching the choir loft at low water is the only way to find out
      what it is keeping time for.
    requires_all:
      # The Stilling opens because the player has been listening, not because
      # a clock ran out. Cael's bell watch is a public event; noticing what it
      # means is the gate.
      - event_seen: bell_watch
      - min_awareness: 20
