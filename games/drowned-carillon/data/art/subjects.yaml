# ============================================================
# Art subjects — The Drowned Carillon.
#
# ONE source, TWO prompt dialects, exactly as data/art/subjects.yaml is for
# the flagship game: engine/media/art.py renders natural prose for Grok
# Imagine and comma-separated tags plus a negative prompt for ComfyUI SDXL,
# from the structured fields below. Nothing here is written twice.
#
# THE GAP THIS FILE CLOSES: this game shipped no art pack AND no prompts. The
# README's claim that it "requires no code" to degrade to the procedural
# silhouette was true and is still true -- but it also meant there was no way
# to stop degrading, for either backend, because nobody had described the
# coast. `paths.art_subjects` in games/drowned-carillon/game.yaml now points
# here; `paths.art_manifest` is still deliberately absent, because there is
# still no pack, and a manifest with no files behind it is a list of broken
# paths that tests/test_content_integrity.py would rightly fail on.
#
# THE THREE BORROWED MONSTERS. games/drowned-carillon/data/encounters/*.yaml
# names `clockwork_thing`, `clockwork_scarecrow` and `clockwork_soldier` --
# ids that resolve against the FLAGSHIP art pack, so three encounters on a
# drowned coast currently illustrate with a picture of an Edgewood clockwork
# monster fighting a mage. The `enemies:` block below describes what those
# encounters are actually about, so the coast can be given its own three.
#
# STYLE IS NOT INHERITED. The flagship's palette is forest earth and hearth
# amber; this coast is salt, green brass and grey water, and the shared style
# block is overridden here rather than reused. Two games, two looks, one
# renderer.
#
# Version: v0.1.0 [2026-08-08]
# ============================================================

style:
  prose: >-
    Oil-painted illustration with grounded realism, a cold salt palette of
    grey-green water, wet stone and verdigris brass, flat maritime light and
    heavy texture. Working fishing-coast aesthetic, nothing modern, no text or
    lettering anywhere in the frame.
  tags: >-
    oil-painted illustration, grounded realism, cold salt palette, grey-green
    water, wet stone, verdigris brass, flat overcast maritime light, detailed
    textures, working fishing coast, no modern elements, no text, no watermark
  negative: >-
    cartoon, anime, neon, sci-fi, cyberpunk, modern clothing, boats with
    engines, text, watermark, logo, blurry, low quality, oversaturated, tropical
    blue water, white sand, heroic pose, glowing magic effects, floating UI
  loras:
    - {name: Oil_Painting_Style, weight: 0.6}
    - {name: Coastal_Environment, weight: 0.4}

# Applied only at SPREADING and beyond -- the flood mark and the full chime.
# The corruption here is TUNING, not machinery: things holding a note they were
# not struck to hold.
corruption:
  prose: >-
    Everything in the frame is faintly ringing: standing water trembling in
    rings that do not spread, salt crusted into the shape of sound, brass gone
    warm and green where it should be cold. The scene feels tuned rather than
    broken.
  tags: >-
    standing water in rings that do not spread, salt crusted into sound
    patterns, warm verdigris brass, a held note made visible, uncanny stillness

formats:
  location: {aspect: "16:9", width: 1344, height: 768}
  portrait: {aspect: "3:4", width: 768, height: 1024}
  item: {aspect: "1:1", width: 256, height: 256}
  cutscene: {aspect: "16:9", width: 512, height: 288}

# ------------------------------------------------------------
# Locations. Ids from games/drowned-carillon/data/world/locations.yaml.
# ------------------------------------------------------------
locations:
  bellfounders_quay:
    subject: "A working stone quay under a headland, at the foot of a bell foundry"
    details: "tarred net lofts, a crane frame, upturned boats, green brass scrap stacked by the weighbridge"
    times:
      dawn:
        setting: "the boats already gone, one lamp still burning in the loft"
        light: "grey pre-dawn, water like tin"
      day:
        setting: "nets down for mending, a scale and a ledger on a barrel"
        light: "flat overcast daylight, no shadows"
      dusk:
        setting: "the tide going out and the flats coming up"
        light: "low bronze light under a grey lid of cloud"
      night:
        setting: "empty, the water working under the stone"
        light: "one lamp on the quay wall, the rest black"

  lamp_house:
    subject: "The interior of a small coastal lamp house"
    details: "a brass lamp mechanism, oil jars in racks, a wick-trimming bench, a bell rope through a hole in the ceiling"
    times:
      dawn:
        setting: "the light being put out for the day"
        light: "cold sea light through salt-fogged glass"
      day:
        setting: "wicks laid out for trimming"
        light: "flat white daylight, dust in it"
      dusk:
        setting: "the lamp being lit"
        light: "the first flare of the wick against a blue window"
      night:
        setting: "the mechanism turning, the room in its shadow"
        light: "the beam going out to sea, everything inside in silhouette"

  net_lofts:
    subject: "A long loft above a quay, hung with nets"
    details: "set-nets on rollers, twine on sticks, tar pots, a low door out onto the roof"
    times:
      dawn:
        setting: "nobody up yet, the nets still wet from yesterday"
        light: "grey light through a single gable window"
      day:
        setting: "a net down the whole length of the floor being worked"
        light: "flat daylight, dust and hemp fibre in the air"
      dusk:
        setting: "rolling up for the night"
        light: "orange from a single lamp at the far end"
      night:
        setting: "shut, the nets moving very slightly"
        light: "moonlight through the gable, everything grey"

  sunken_nave:
    subject: "A flooded cathedral nave under a coastline, knee-deep in seawater"
    details: "salt-white pillars, weed on the lower courses, organ pipework the size of masts in the far wall"
    times:
      dawn:
        setting: "low water, the floor just walkable"
        light: "green daylight coming down a collapsed stair"
      day:
        setting: "the water rising again, rings on the surface"
        light: "cold refracted light off the water onto the vaulting"
      dusk:
        setting: "the tide back over the floor"
        light: "almost no light, a green suggestion of the far wall"
      night:
        setting: "full, black, and not silent"
        light: "no light at all except what a lantern would carry"

  choir_loft:
    subject: "A stone choir loft above a flooded nave, with a drowned organ console"
    details: "salt-white stops and couplers moving on their own, a gallery rail, water two feet under it and climbing"
    times:
      dawn:
        setting: "low water, the one hour anybody has ever come back up from"
        light: "grey light down the shaft, the console pale in it"
      day:
        setting: "the water at the rail"
        light: "green underwater light off the flood below"
      dusk:
        setting: "the stops working faster"
        light: "almost dark, wet stone catching what is left"
      night:
        setting: "under water"
        light: "black"

# ------------------------------------------------------------
# Portraits.
# ------------------------------------------------------------
portraits:
  npc_cael:
    subject: "A lamp-keeper in his sixties in an oilskin, one hand off a bell rope"
    details: "salt-cracked hands, wax plugs on a cord round his neck, eyes that have been listening for eleven years"
    setting: "the lamp house behind him, the mechanism out of focus"
    mood: "careful, exhausted, absolutely certain"
  npc_vesh:
    subject: "A widow in dark working clothes, mending a net across her knees"
    details: "a net needle in one hand, hair pinned back hard, a ring worn on a cord instead of a finger"
    setting: "the net lofts, grey light from a gable window"
    mood: "unsentimental, unhurried, not to be argued with"
  npc_halloran:
    subject: "A brass buyer at a weighbridge with green-stained hands"
    details: "verdigris worn into the creases of his palms, a scale, a ledger he does not let anyone read"
    setting: "the quay, scrap brass stacked behind him"
    mood: "friendly, evasive, watching the water"

# ------------------------------------------------------------
# Enemies. These three ids currently resolve against the FLAGSHIP art pack --
# a clockwork monster fighting a mage, on a drowned coast. The descriptions
# below are what those encounters are actually about.
# ------------------------------------------------------------
enemies:
  clockwork_thing:
    subject: "A tide-cantor: a human shape of salt-crusted brass pipework standing in shallow water"
    details: "organ pipes grown through where ribs would be, no face, water flat and unmoving around its feet"
    setting: "ankle-deep on a tidal flat under a grey sky"
    mood: "patient, tuned, not hostile so much as continuing"
  clockwork_scarecrow:
    subject: "A bell-warden's marker: a driftwood cross hung with green brass chimes, standing in the flats"
    details: "chimes moving without wind, weed and net-scrap lashed to the crossbar, a wax-sealed jar at its foot"
    setting: "the tide line at low water, wet sand to the horizon"
    mood: "a warning that has stopped being a warning"
  clockwork_soldier:
    subject: "A drowned bell-warden in corroded plate, still standing in the surf"
    details: "verdigris eaten through the harness, a bell where the helmet crest should be, seawater running out of the joints"
    setting: "knee-deep in breaking grey surf"
    mood: "upright, slow, keeping a time nobody set"

# ------------------------------------------------------------
# Items, keyed by the registry id in
# games/drowned-carillon/data/items/coast.yaml. Framing matches the flagship's
# item plates -- one object, flat, from above, dark aged ground -- so the two
# games' inventory panels read as the same UI.
# ------------------------------------------------------------
items:
  defaults:
    setting: >-
      the single object alone in the centre of the frame, laid flat and seen
      from directly above on a dark salt-stained ground, a rough darkened
      painted border around the edge, nothing else in the frame
    light: >-
      soft raking light from the upper left, a soft shadow cast beneath the
      object, deep grey-green surround, still-life plate

  fish_chowder:
    subject: "A chipped enamel bowl of thick fish chowder"
    details: "potato and pale fish in a smoke-grey broth, a horn spoon laid across the rim, a skin forming"
  salt_fish:
    subject: "Two split salt fish dried board-hard"
    details: "opened flat and stiff, salt crusted white along the flesh, laid one across the other"
  ships_biscuit:
    subject: "Three discs of ship's biscuit"
    details: "pale, dense, docked with a pattern of holes, one snapped in half to show no crumb at all"
  storm_lantern:
    subject: "A brass-framed four-sided storm lantern"
    details: "a wick guard inside, salt-pitted brass, one pane crazed, a carrying ring worn bright"
  lamp_oil:
    subject: "A stoppered stone jar of rendered fish oil"
    details: "grey salt-glazed stoneware, a wooden bung tied down with twine, an oily ring on the ground"
  net_needle:
    subject: "A flat wooden net needle wound with twine"
    details: "worn smooth in the middle by one particular grip, tarred twine wound on the fork"
  gutting_knife:
    subject: "A short gutting knife with a twine-wrapped handle"
    details: "the blade thin from years of sharpening, the same tarred twine as the nets on the grip"
  wax_earplugs:
    subject: "A pair of pinched wax cones in a scrap of oilcloth"
    details: "pale candle wax with thumbprints in it, the oilcloth folded open around them"
  damping_cloth:
    subject: "A pad of wadded felt in a leather sleeve"
    details: "thick grey felt showing at the open end, the leather stitched with sail twine, dead and heavy-looking"
  salvaged_brass:
    subject: "A piece of green-crusted chime-brass off the flats"
    details: "verdigris eaten into a curved fragment, a clean bright break at one edge, sand in the crust"
  net_twine:
    subject: "A hank of tarred hemp net twine on a stick"
    details: "three strands laid up together, dark with tar, the loose end whipped"
  beeswax:
    subject: "A cake of pale beeswax"
    details: "cast in a shallow round, a knife cut through one side, fine cracks across the face"
  brass_quill:
    subject: "A single gull's flight feather in hammered brass"
    details: "every barb beaten separately, the shaft worn bright, verdigris only in the deepest vanes"
  tuning_fork:
    subject: "A salt-pitted brass tuning fork with a worn stem"
    details: "two tines eaten by salt, the stem polished smooth where a hand has held it, standing on end"
  mended_net:
    subject: "A mended set-net folded into a bundle"
    details: "the repair visible as newer pale twine let into darker tarred mesh, cork floats along one edge"
  winkles:
    subject: "A cloth bag of boiled winkles, spilled"
    details: "small dark spiral shells, a pin lying among them, one shell empty and turned over"
  dulse:
    subject: "A dried sheaf of red dulse seaweed"
    details: "flat purple-red fronds gone leathery, tied at the stems, salt bloomed on the surface"
  razor_clams:
    subject: "A string of razor clams"
    details: "long straight shells the colour of old ivory, threaded through on twine, wet sand still on them"
  gull_eggs:
    subject: "A clutch of four gull eggs"
    details: "large olive-grey shells heavily blotched with brown, in a scrape of dry weed"
  driftwood:
    subject: "An armful of sea-dried driftwood, tied"
    details: "silver-grey, salt-cured, worm-bored, bound with a length of net twine"
  green_brass:
    subject: "A lump of corroded chime-metal furred pale green"
    details: "verdigris grown over it like moss, a heavy irregular mass, one face broken to bright yellow metal"
