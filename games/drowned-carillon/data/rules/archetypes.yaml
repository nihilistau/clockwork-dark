# Player archetypes on the Brass Coast.
#
# Read by engine/game/checks.py (skill_bonus) and applied at character
# creation. Same schema, same small bonuses, same principle: a net-mender who
# goes down the Wet Steps should be a net-mender out of her depth, not a class
# that cannot fail.
#
# `default` names the archetype a run gets when none is chosen. It is a
# different id from the flagship game's `wayfarer`, which is the point --
# engine/game/checks.py reads whatever this file says.
#
# Version: v0.1.0 [2026-08-08]

version: 1
default: net_mender

archetypes:
  net_mender:
    name: "Net-mender"
    blurb: "Tar to the second knuckle, a needle in your belt, and hands that know a splice in the dark."
    stats:
      grit: 11
      agility: 12
      wits: 10
      presence: 9
      craft: 13
    skill_bonus:
      craft: 2
      survival: 1
    starting_items:
      - { id: net_needle, name: "Net needle", qty: 1, tags: [tool] }
      - { id: salt_fish, name: "Salt fish", qty: 2, tags: [food] }
      - { id: net_twine, name: "Hank of net twine", qty: 2, tags: [material] }

  lamp_keeper:
    name: "Lamp-keeper"
    blurb: "Four lamps with glass in them and one oath you keep by breaking it every morning."
    stats:
      grit: 10
      agility: 9
      wits: 13
      presence: 12
      craft: 10
    skill_bonus:
      lore: 2
      nerve: 1
    starting_items:
      - { id: storm_lantern, name: "Storm lantern", qty: 1, tags: [tool, light] }
      - { id: wax_earplugs, name: "Wax earplugs", qty: 2, tags: [charm, tool] }
      - { id: ships_biscuit, name: "Ship's biscuit", qty: 2, tags: [food, ration] }

  bell_founder:
    name: "Bell-founder"
    blurb: "You know what a casting sounds like when it is wrong, and you know how to make it stop."
    stats:
      grit: 13
      agility: 9
      wits: 11
      presence: 10
      craft: 12
    skill_bonus:
      sympathy: 2
      craft: 1
    starting_items:
      - { id: damping_cloth, name: "Damping cloth", qty: 1, tags: [charm, tool] }
      - { id: gutting_knife, name: "Gutting knife", qty: 1, tags: [tool] }
      - { id: ships_biscuit, name: "Ship's biscuit", qty: 1, tags: [food, ration] }
