# Doom beats for The Drowned Carillon.
#
# Deliberately empty. This game has no authored beats yet, and an empty table
# is the correct way to say so: engine/world/world_effects.py treats it as "the
# clock is counted but not felt", which is exactly the pre-beat behaviour.
#
# It exists as a file — rather than being left undeclared in game.yaml — because
# an undeclared path falls back to the engine default, which is Edgewood's
# table. That would have this coast's flood tide waking a brass scarecrow in a
# wheatfield nine hundred miles inland and moving villagers who are not in this
# story. See engine/games/caches.py for the general shape of that hazard.
#
# To author beats here, copy the schema from data/rules/doom_effects.yaml. Keys:
#   at_progress, text, set_flags, discoveries, rumors, world_events, npc_moves.
# npc_moves destinations are validated against THIS game's location graph.
{}
