# Skill Taxonomy and Check Rules
# ==============================
#
# The seven skills of DESIGN.md § Dice & Skill Checks. Every number the engine
# uses to resolve a check lives here, not in Python: the model picks a
# difficulty BAND and the engine derives the DC and every modifier.
#
# Consumed by engine/game/checks.py.

version: 1

# stat_mod(v) = (v - base) // divisor
stat_mod:
  base: 10
  divisor: 2

# skill -> backing stat on GameState.stats.
skills:
  persuasion:
    stat: presence
    description: "Talking, haggling, reading a room, holding a lie together."
  stealth:
    stat: agility
    description: "Moving unseen, light hands, staying off a road."
  sympathy:
    stat: focus
    description: "The costly art. Binding like to like; it takes something from you."
  lore:
    stat: wits
    description: "Books, mural-reading, recognising what the brass in the wheat means."
  craft:
    stat: craft
    description: "Baking, herbalism, tinker repair, honest work done well."
  survival:
    stat: wits
    description: "Forage, weather, tracks, sleeping rough and waking up."
  nerve:
    stat: grit
    description: "Standing still when the thing in the stillness moves."

# Skill named by the model that is not in the taxonomy above. Logged, then
# resolved against this stat rather than refused -- a refused check would leave
# the Storyteller free to narrate an unrolled outcome, which is the failure
# mode the whole engine exists to prevent.
unknown_skill_stat: wits

# Difficulty BANDS. The model never sees a raw DC.
difficulty:
  trivial: 8
  easy: 10
  standard: 13
  hard: 16
  severe: 19
  legendary: 22
default_difficulty: standard

# Degrees of success by margin (total - dc). Evaluated top down; first match
# wins, so order matters.
degrees:
  - id: crit_success
    min_margin: 10
  - id: success
    min_margin: 0
  - id: partial
    min_margin: -4
  - id: failure
    min_margin: -999

# Situational modifiers. Each entry is (label, delta, optional skill filter,
# condition). `skills:` omitted means the modifier applies to every skill.
#
# Condition grammar understood by checks.py:
#   stat: <name>        numeric attribute of state.stats
#   field: <name>       numeric attribute of state
#   stat_ratio: [a, b]  state.stats.a / state.stats.b
#   lte/gte/lt/gt: <n>  comparison against the value selected above
#   time_of_day: <s|[s]>
#   evil_phase: <s|[s]>
situational:
  - id: exhausted
    label: exhausted
    delta: -3
    when:
      stat: stamina
      lte: 20

  - id: injured
    label: injured
    delta: -2
    when:
      stat_ratio: [hp, max_hp]
      lte: 0.4

  - id: starving
    label: starving
    delta: -2
    when:
      field: hunger
      gte: 85

  # Dark is cover. This is the one situational bonus in the table.
  - id: night
    label: darkness
    delta: 2
    skills: [stealth]
    when:
      time_of_day: night

  - id: evil_spreading
    label: "the wrongness"
    delta: -1
    skills: [nerve]
    when:
      evil_phase: spreading

  - id: evil_consuming
    label: "the wrongness"
    delta: -3
    skills: [nerve]
    when:
      evil_phase: consuming
