# The Drowned Carillon item registry.
#
# Same shape as data/items/*.yaml in the flagship game -- id, name,
# description, tags, weight, value, stack -- because the registry is read by
# the same content-integrity rules and the same barter overlay. Everything an
# encounter, quest, recipe or vendor on this coast names must appear here.
#
# `art` keys are deliberately absent. This game ships no art pack of its own,
# so items fall through to the procedural silhouette rather than borrowing a
# picture of a loaf of Edgewood bread. Generation prompts for every id below
# now exist in games/drowned-carillon/data/art/subjects.yaml, in the same
# structured form the flagship uses, so the coast can be painted by either
# backend without an art pack having to be checked in first.
#
# The `use:`, `equip:` and `collection:` blocks are the coast's half of the
# same change made to data/items/*.yaml: an item whose only verb is "sell it"
# is decoration. Field reference for those blocks: data/items/gear.yaml.
#
# Version: v0.2.0 [2026-08-08]

version: 1

items:

  # -- food and drink ----------------------------------------------------

  - id: fish_chowder
    name: "Bowl of chowder"
    description: >-
      Thick with potato and whatever the boats brought, smoke-tasting from the
      pot it has been sitting in since before light.
    tags: [food]
    weight: 0.5
    value: 2
    stack: true

  - id: salt_fish
    name: "Salt fish"
    description: >-
      Split, salted and dried board-hard. Keeps a winter, tastes of the board.
    tags: [food]
    weight: 0.3
    value: 3
    stack: true

  - id: ships_biscuit
    name: "Ship's biscuit"
    description: >-
      A disc of baked flour and nothing else, hard enough to be a tool. Soak
      it or lose a tooth to it.
    tags: [food, ration]
    weight: 0.2
    value: 2
    stack: true

  # -- tools and light ---------------------------------------------------

  - id: storm_lantern
    name: "Storm lantern"
    description: >-
      Brass-framed, four-sided, with a wick guard that will hold a flame in
      anything short of being dropped in the sea.
    tags: [tool, light]
    weight: 1.1
    value: 22
    equip:
      slot: light
      bonuses:
        - { skills: [survival], delta: 1 }
        - { skills: [lore], delta: 1 }
      text: >-
        Hooked on and lit. Four sides and a wick guard, and it will hold a
        flame in anything short of being dropped in the sea.
    use:
      verb: "build a fire"
      hours: 1.0
      once_per_day: true
      also_consumes:
        - { id: driftwood, qty: 1 }
        - { id: lamp_oil, qty: 1 }
      effects:
        - type: check_penalty
          id: warm_and_dry
          text: "warm and dry"
          delta: 1
          skills: [survival, nerve]
          days: 1
        - type: stamina
          delta: 5
      text: >-
        Salt-cured wood off the tide line, started with a splash of the oil.
        It burns hot and green and spits, and you stop being cold.
    collection: lamp_keepers_kit
    stack: false

  - id: lamp_oil
    name: "Jar of lamp oil"
    description: >-
      Rendered fish oil in a stoppered stone jar. Burns dirty, burns anyway,
      and the quay has never had anything better.
    tags: [tool, trade]
    weight: 2.4
    value: 6
    collection: lamp_keepers_kit
    stack: true

  - id: net_needle
    name: "Net needle"
    description: >-
      A flat wooden shuttle worn smooth in the middle by one particular grip.
      Mending nets is a skill and this is the whole of its equipment.
    tags: [tool]
    weight: 0.1
    value: 4
    equip:
      slot: hands
      bonuses:
        - { skills: [craft], delta: 1 }
      text: >-
        Through the belt where the loft hands carry it. Worn smooth in the
        middle by one particular grip, and now by yours.
    collection: lamp_keepers_kit
    stack: false

  - id: gutting_knife
    name: "Gutting knife"
    description: >-
      Short, thin from sharpening, and the handle is wrapped in the same twine
      as the nets because that is what there was.
    tags: [tool]
    weight: 0.3
    value: 9
    equip:
      slot: belt
      bonuses:
        - { skills: [survival], delta: 1 }
      text: >-
        On the hip, twine-wrapped handle out. Thin from sharpening and still
        the most used thing on the quay.
    collection: lamp_keepers_kit
    stack: false

  # -- charms and protections -------------------------------------------

  - id: wax_earplugs
    name: "Wax earplugs"
    description: >-
      A pair of pinched cones of candle wax in a scrap of oilcloth. Cael sells
      them from the Lamp House without ever saying what they are for, and
      everyone on the quay owns a pair.
    tags: [charm, tool]
    weight: 0.05
    value: 3
    use:
      verb: "seat them"
      hours: 0.25
      consumes: 1
      effects:
        - type: check_penalty
          id: wax_seated
          text: "the wax in"
          delta: 2
          skills: [nerve]
          days: 1
        - type: check_penalty
          id: wax_seated_deaf
          text: "you cannot hear a word"
          delta: -2
          skills: [persuasion]
          days: 1
      text: >-
        Warmed between finger and thumb and pushed home. Everyone on the quay
        owns a pair and nobody has ever said out loud what they are for.
    collection: lamp_keepers_kit
    stack: true

  - id: damping_cloth
    name: "Damping cloth"
    description: >-
      Wadded felt in a leather sleeve, of the sort a bellfounder lays on a
      casting to stop it ringing before it has cooled. It works on other
      things.
    tags: [charm, tool]
    weight: 0.4
    value: 18
    equip:
      slot: charm
      bonuses:
        - { skills: [nerve], delta: 2 }
        - { skills: [stealth], delta: 1 }
      absorbs_wounds: 1
      text: >-
        Laid against the chest inside the coat. A bellfounder puts one on a
        casting to stop it ringing before it has cooled. It works on other
        things, including you.
    stack: false

  # -- materials ---------------------------------------------------------

  - id: salvaged_brass
    name: "Salvaged chime-brass"
    description: >-
      Green-crusted brass off the flats, cool to the hand well past the point
      where it should have warmed. It hums if you set it down hard.
    tags: [material, trade]
    weight: 0.6
    value: 11
    collection: low_water_finds
    stack: true

  - id: net_twine
    name: "Hank of net twine"
    description: >-
      Tarred hemp laid up in three strands, wound on a stick. The quay's
      currency in everything but name.
    tags: [material, trade]
    weight: 0.3
    value: 2
    stack: true

  - id: beeswax
    name: "Cake of beeswax"
    description: >-
      Comes over the headland from inland once a season and is worth arguing
      about when it does.
    tags: [material]
    weight: 0.2
    value: 5
    stack: true

  - id: brass_quill
    name: "Brass gull-quill"
    description: >-
      A single flight feather of hammered brass, warm at the shaft. It came
      off something that was flying at the time.
    tags: [material, charm]
    weight: 0.05
    value: 14
    equip:
      slot: charm
      bonuses:
        - { skills: [lore], delta: 1 }
        - { skills: [sympathy], delta: 1 }
      text: >-
        Through the coat seam, shaft down. Warm to the touch in weather that
        has no business warming anything.
    collection: low_water_finds
    stack: true

  # -- quest -------------------------------------------------------------

  - id: tuning_fork
    name: "Drowned tuning-fork"
    description: >-
      Two tines of salt-pitted brass on a stem worn by a grip. Held up in the
      nave it finds the Carillon's note without being struck.
    tags: [quest, charm]
    weight: 0.5
    value: 0
    use:
      verb: "hold it up"
      hours: 0.25
      effects:
        - type: check_penalty
          id: found_the_note
          text: "you have the Carillon's note"
          delta: 2
          skills: [lore, sympathy, nerve]
          days: 1
        - type: awareness
          delta: 3
        - type: focus
          delta: -1
      text: >-
        Held up, not struck. It finds the note by itself, and the note goes
        through the stem into the bones of your hand and stays there a while.
    stack: false

  - id: mended_net
    name: "Mended set-net"
    description: >-
      Somebody's livelihood, back in one piece, smelling of tar and the loft.
    tags: [quest, trade]
    weight: 4.0
    value: 12
    use:
      verb: "set the net"
      hours: 4.0
      once_per_day: true
      effects:
        - type: item
          item_id: salt_fish
          name: "Salt fish"
          qty: 2
          tags: [food]
        - type: item
          item_id: winkles
          name: "Bag of winkles"
          qty: 1
          tags: [food]
        - type: stamina
          delta: -12
      text: >-
        Shot at the turn and hauled at the slack, which is four hours of
        standing in cold water for a day's eating. It is a livelihood. It was
        never supposed to be a good one.
    stack: false

  # -- foraged off the flats (P12) ---------------------------------------
  #
  # What low water leaves behind. Poor food, freely available, and the reason
  # a broke lamp-keeper on this coast does not simply starve -- see
  # games/drowned-carillon/data/tables/forage.yaml.

  - id: winkles
    name: "Bag of winkles"
    description: >-
      Picked off the lower rocks a handful at a time and boiled in seawater.
      Eaten with a pin, which everyone on the quay carries and nobody mentions.
    tags: [food]
    weight: 0.4
    value: 1
    stack: true

  - id: dulse
    name: "Sheaf of dulse"
    description: >-
      Red weed cut at the spring tide and dried on the wall. Salt, iron, and
      the flat taste of a month you would rather not remember.
    tags: [food, material]
    weight: 0.2
    value: 1
    stack: true

  - id: razor_clams
    name: "String of razor clams"
    description: >-
      Drawn out of the sand with a pinch of salt and a fast hand. Better
      eating than anything else the flats give up for free.
    tags: [food]
    weight: 0.5
    value: 3
    stack: true

  - id: gull_eggs
    name: "Clutch of gull eggs"
    description: >-
      Taken off the ledge below the lamp house. Strong, oily, and worth the
      climb exactly once per ledge per season.
    tags: [food]
    weight: 0.3
    value: 2
    stack: true

  - id: driftwood
    name: "Armful of driftwood"
    description: >-
      Sea-dried and salt-cured, so it burns hot and green and spits. Every
      hearth on the quay is fed with it.
    tags: [material, trade]
    weight: 4.0
    value: 2
    collection: low_water_finds
    stack: true

  - id: green_brass
    name: "Lump of green brass"
    description: >-
      Corroded chime-metal off the tide line, furred pale green. Halloran will
      take it by weight and will not say what he does with it.
    tags: [material, trade]
    weight: 1.2
    value: 5
    collection: low_water_finds
    stack: true
