# World events on the Brass Coast.
#
# Read by engine/world/schedules.py. Same three-event shape as the flagship
# game's data/world/schedules.yaml -- an arrival, a camp, a press -- because
# those are the engine's event slots, and a coast has its own versions of all
# three.
#
# The `rumors` list at the bottom is the legacy flat pool. It is kept because
# the loader still reads it as a fallback; the gated pool that actually gets
# used is games/drowned-carillon/data/world/rumors.yaml.
#
# Version: v0.1.0 [2026-08-08]

factor_arrival:
  min_day: 4
  probability_per_day: 0.10
  duration_days: 2
  npc_id: npc_orsel
  location_id: bellfounders_quay
  goods:
    - storm_lantern
    - beeswax

low_water_spring:
  probability_per_week: 0.20
  duration_days: 2
  npc_id: npc_vesh
  location_id: tide_flats
  goods:
    - net_twine
    - salt_fish

bell_watch:
  min_awareness: 20
  probability_per_day: 0.04
  duration_days: 1
  npc_id: npc_cael
  location_id: bellfounders_quay

rumors:
  - "Orsel's factor swears the crossing took an extra hour though the sun said otherwise."
  - "A gull came off the bar last week ringing, and three more answered it."
  - "Vesh was on the ninth step again at the turn of the tide. Nobody went down after her."
  - "The inland buyers are paying double weight for green brass and will not say who wants it."
  - "Cael has stopped selling the wax by the pair. He sells it by the handful now."
  - "The set-nets on the bar are coming up sorted."
  - "Somebody heard the shore-bell in the night. The rope has not moved."
