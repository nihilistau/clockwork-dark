# NPC hourly routines on the Brass Coast.
#
# Read by engine/world/npc_sim.py. Every named NPC covers all 24 hours, so
# there is never a gap that silently falls back to the procgen home -- and in
# particular tide_flats and wet_steps, which a player can walk into at any
# hour, are never empty of anyone who could speak.
#
# `activity` strings land VERBATIM in the Storyteller prompt. They are written
# as something a person could see from the top of the steps.
#
# Version: v0.1.0 [2026-08-08]

version: 1

defaults:
  activity: "at the day's work, with one ear on the water"
  relocated_activity: "somewhere they had not meant to be at this hour"
  pinned_activity: "waiting on you, and not pretending otherwise"

night_hours: [22, 23, 0, 1, 2, 3, 4]

event_activities:
  factor_arrival: "counting salt fish out of the shed and calling a price nobody likes"
  low_water_spring: "out on the bar to the ankle, working fast, watching the turn"
  bell_watch: "standing under the shore-bell frame with a hand on the rope and not pulling it"

npcs:

  npc_cael:
    home: lamp_house
    routine:
      - hours: [5, 6, 7]
        location: bellfounders_quay
        activity: "checking the shore-bell's rope by hand, knot by knot, the way he has every morning for eleven years"
      - hours: [8, 9, 10, 11]
        location: lamp_house
        activity: "trimming wick and decanting oil, with the door propped for anyone who wants to not-ask about the wax"
      - hours: [12, 13, 14]
        location: bellfounders_quay
        activity: "sitting on the bollard by the notice-board post, reading whatever has been tarred up there"
      - hours: [15, 16, 17, 18]
        location: lamp_house
        activity: "pinching wax into cones and laying them in oilcloth, a dozen at a time"
      - hours: [19, 20, 21]
        location: bellfounders_quay
        activity: "walking the quay lighting the four lamps that still have glass in them"
      - hours: [22, 23, 0, 1, 2, 3, 4]
        location: lamp_house
        activity: "asleep in the chair by the door with his boots on"
        available: false

  npc_vesh:
    home: net_lofts
    routine:
      - hours: [5, 6, 7, 8]
        location: net_lofts
        activity: "laying net over the beam and finding the holes by running the mesh through her fist"
      - hours: [9, 10, 11]
        location: tide_flats
        activity: "out on the bar to the ankle, resetting stakes, checking the turn every third breath"
      - hours: [12, 13]
        location: bellfounders_quay
        activity: "eating standing up beside the chowder pot and telling somebody they are wrong"
      - hours: [14, 15, 16, 17]
        location: net_lofts
        activity: "mending with the needle, three strands at a time, back to the sea"
      - hours: [18, 19]
        location: bellfounders_quay
        activity: "sitting on the top step with her boots off, looking at the ninth one"
      - hours: [20, 21]
        location: net_lofts
        activity: "tarring twine by lamplight because it is not a job that can wait for weather"
      - hours: [22, 23, 0, 1, 2, 3, 4]
        location: net_lofts
        activity: "asleep under the drying rack, which is not where the bed is"
        available: false

  npc_halloran:
    home: bellfounders_quay
    routine:
      - hours: [6, 7, 8, 9, 10, 11]
        location: bellfounders_quay
        activity: "at the yard gate weighing green brass on a beam scale and writing nothing down"
      - hours: [12, 13, 14, 15, 16, 17]
        location: bellfounders_quay
        activity: "laying damping felt over a casting that has been cool for a week"
      - hours: [18, 19, 20, 21]
        location: bellfounders_quay
        activity: "drinking outside the shed with his back to the water"
      - hours: [22, 23, 0, 1, 2, 3, 4, 5]
        location: bellfounders_quay
        activity: "asleep in the casting shed, which is warmer than the house"
        available: false

  npc_orsel:
    home: bellfounders_quay
    routine:
      - hours: [8, 9, 10, 11, 12, 13, 14, 15, 16]
        location: bellfounders_quay
        activity: "going down the tally with a wet thumb and offering less than last season"
      - hours: [17, 18, 19, 20, 21, 22, 23, 0, 1, 2, 3, 4, 5, 6, 7]
        location: bellfounders_quay
        activity: "gone back over the headland, as the factors always are before dark"
        available: false

role_defaults:
  default:
    day:
      - "coiling rope on the quay edge"
      - "splitting fish over a barrel"
      - "arguing about the tide table"
      - "carrying oil up the steps two jars at a time"
    night:
      - "asleep with the shutters wedged"
  fisher:
    day:
      - "picking a net over for weed"
      - "standing at the quay head watching the bar"
    night:
      - "asleep, boots by the door, in case"
