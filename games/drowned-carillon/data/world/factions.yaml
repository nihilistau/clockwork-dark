# Factions on the Brass Coast.
#
# Read by engine/game/reputation.py. The `defaults` block -- band thresholds,
# score clamps, the price curve -- is the flagship game's, unchanged, because
# those numbers are mechanics rather than story. The factions are not.
#
# Version: v0.1.0 [2026-08-08]

version: 1

defaults:
  bands:
    - { id: hostile, upto: -40, label: "hostile" }
    - { id: wary, upto: -15, label: "wary" }
    - { id: neutral, upto: 24, label: "neutral" }
    - { id: friendly, upto: 59, label: "friendly" }
    - { id: trusted, label: "trusted" }

  min_score: -100
  max_score: 100

  price:
    base: 1.15
    divisor: 400
    floor: 0.85
    ceiling: 1.25

factions:

  quayfolk:
    name: "The Quayfolk"
    description: >-
      Everyone who works out of Bellfounders' Quay: net lofts, chowder pot,
      the four boats still going out. They keep a count of who came back up
      the steps and who did not, and they know exactly where you stood.

  bell_wardens:
    name: "The Bell Wardens"
    description: >-
      What is left of the order that cast the shore-bell and swore to sound
      it. Brother Cael is the last one on this coast, and he has kept the oath
      by breaking it every day for eleven years.

  inland_factors:
    name: "The Inland Factors"
    description: >-
      Buyers who come over the headland for salt fish and brass and go back
      before dark. They think the quay is superstitious and they pay well
      enough that nobody argues.
