# Vendor stock on Bellfounders' Quay. Prices in copper.
#
# Read by engine/skills/builtin/mechanics.py::trade, exactly as the flagship
# game's data/economy.yaml is. Every TOP-LEVEL key is an NPC id -- the loader
# treats this file as a flat vendor table, so nothing else may live at the top
# level (no `version:`, no shared blocks).
#
# Every id on both sides exists in games/drowned-carillon/data/items/coast.yaml.
#
# THE SPREAD: Vesh buys twine at 1 and sells it at 2 because she is the one
# who tars it. Cael sells wax earplugs at 3 and will not buy them back at any
# price, which is the most in-character line in this file.
#
# Version: v0.1.0 [2026-08-08]

# ------------------------------------------------------------
# Brother Cael -- the Lamp House. Light, and the other kind of protection.
# ------------------------------------------------------------
npc_cael:
  sells:
    lamp_oil: { price: 8, name: "Jar of lamp oil" }
    storm_lantern: { price: 26, name: "Storm lantern" }
    wax_earplugs: { price: 3, name: "Wax earplugs" }
    beeswax: { price: 7, name: "Cake of beeswax" }
    ships_biscuit: { price: 3, name: "Ship's biscuit" }
  buys:
    beeswax: { price: 3, name: "Cake of beeswax" }
    salvaged_brass: { price: 6, name: "Salvaged chime-brass" }
    brass_quill: { price: 9, name: "Brass gull-quill" }

# ------------------------------------------------------------
# Salt-Widow Vesh -- the net lofts. Twine, tools, and fish.
# ------------------------------------------------------------
npc_vesh:
  sells:
    net_twine: { price: 2, name: "Hank of net twine" }
    net_needle: { price: 5, name: "Net needle" }
    gutting_knife: { price: 11, name: "Gutting knife" }
    salt_fish: { price: 4, name: "Salt fish" }
    fish_chowder: { price: 2, name: "Bowl of chowder" }
  buys:
    net_twine: { price: 1, name: "Hank of net twine" }
    salt_fish: { price: 2, name: "Salt fish" }
    salvaged_brass: { price: 7, name: "Salvaged chime-brass" }
    mended_net: { price: 12, name: "Mended set-net" }

# ------------------------------------------------------------
# Halloran the bellfounder -- the yard the quay is named for.
# Buys brass by weight and asks no questions, which is its own answer.
# ------------------------------------------------------------
npc_halloran:
  sells:
    damping_cloth: { price: 24, name: "Damping cloth" }
    storm_lantern: { price: 30, name: "Storm lantern" }
  buys:
    salvaged_brass: { price: 9, name: "Salvaged chime-brass" }
    brass_quill: { price: 12, name: "Brass gull-quill" }
