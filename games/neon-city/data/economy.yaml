  sells:
    forged_id: { price: 450, name: "Forged ID" }
    black_ice: { price: 900, name: "Black ICE" }
    burner_face: { price: 700, name: "Burner Face" }
    ghost_protocol: { price: 1500, name: "Ghost Protocol" }
    red_lace: { price: 150, name: "Red Lace" }
  buys:
    dead_drop_shard: { price: 30, name: "Dead-Drop Shard" }
    ice_fragment: { price: 50, name: "ICE Fragment" }
    cache_key: { price: 85, name: "Cache Key" }
    patrol_log: { price: 26, name: "Patrol Log" }
    red_lace: { price: 70, name: "Red Lace" }
    black_ice: { price: 420, name: "Black ICE" }
    precorp_cable: { price: 70, name: "Pre-Corporate Cable" }
    precorp_tooling: { price: 120, name: "Pre-Corporate Tooling" }
    one_of_one: { price: 330, name: "One-of-One Artifact" }

# ------------------------------------------------------------
# Frankie DeLuca -- Club Noir. Pays more for data than anyone, and tells
# the room; everything bought from Frankie is also sold by Frankie.
# ------------------------------------------------------------
frankie:
  sells:
    forged_id: { price: 520, name: "Forged ID" }
    # Frankie's miracle: he can conjure a set of lift codes, for the kind of
    # number that tells you he hopes you will not ask twice.
    access_codes: { price: 2600, name: "Lift Access Codes" }
  buys:
    dead_drop_shard: { price: 44, name: "Dead-Drop Shard" }
    ice_fragment: { price: 74, name: "ICE Fragment" }
    cache_key: { price: 118, name: "Cache Key" }
    camera_capture: { price: 30, name: "Camera Capture" }
    patrol_log: { price: 40, name: "Patrol Log" }

