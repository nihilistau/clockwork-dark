    courier_wrap: { price: 40, name: "Courier Wrap" }
    burner_deck: { price: 240, name: "Burner Deck" }
    emp_grenade: { price: 160, name: "EMP Grenade" }
    climbing_rig: { price: 150, name: "Climbing Rig" }
    synth_food: { price: 22, name: "Synth Food Brick" }
    sealed_ration: { price: 14, name: "Sealed Ration" }
  buys:
    salvage_tech: { price: 12, name: "Salvage Tech" }
    copper_spool: { price: 8, name: "Copper Spool" }
    deck_parts: { price: 24, name: "Deck Parts" }
    drone_chassis: { price: 42, name: "Drone Chassis" }
    tourist_visor: { price: 11, name: "Tourist Visor" }

# ------------------------------------------------------------
# Dr. Yusra Sable -- Ripper Street. Cash, no questions; repairs at 1.06x.
