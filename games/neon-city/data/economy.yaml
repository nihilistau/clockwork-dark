# NEON CITY: THE CROSSING -- vendor stock. Prices in credits.
#
# Read through `paths.economy`. Every TOP-LEVEL key is an NPC id scheduled in
# data/world/npc_schedules.yaml. This file is the OVERRIDE layer: every item
# already has a price everywhere via its `value` and the spread in
# data/tables/trade.yaml; a row here is a vendor naming their own number.
#
# The canon prices are pinned here to the credit where the bible names one:
# the heat-work ladder at Mira and Rho (130 / 300 / 700 / 1500), synth food
# 25, sump coffee 35, sprawl ramen 40, overdrive amp 420, Wren at her 1.25x.
#
# THE SPREAD IS THE LIVING. Grease sells cheap and honest (canon 0.88);
# Grease also BUYS at yard rate, below what the same salvage fetches at the
# Grid -- hauling it to Mira is the paid walk the scavenge loop runs on.
# Watch the gap: no pair of vendors prices an item into a profitable round
# trip.
#
# Version: v0.1.0 [2026-08-14]

# ------------------------------------------------------------
# Mira Vex -- the Grid. Street-tech, stims, scrubs; fences anything, full
# Grid rate, which is the reason scavenge walks here from the yard.
# ------------------------------------------------------------
mira_vex:
  sells:
    synth_food: { price: 25, name: "Synth Food Brick" }
    sump_coffee: { price: 35, name: "Sump Coffee" }
    stim_patch: { price: 60, name: "Stim Patch" }
    medkit: { price: 120, name: "Medkit" }
    id_scrub: { price: 130, name: "ID Scrub" }
    cooldown_spoof: { price: 300, name: "Cooldown Spoof" }
    street_pistol: { price: 260, name: "Street Pistol" }
    flash_torch: { price: 40, name: "Flash Torch" }
    rain_shell: { price: 90, name: "Rain Shell" }
    filter_mask: { price: 120, name: "Filter Mask" }
  buys:
    salvage_tech: { price: 18, name: "Salvage Tech" }
    copper_spool: { price: 12, name: "Copper Spool" }
    deck_parts: { price: 34, name: "Deck Parts" }
    courier_wrap: { price: 28, name: "Courier Wrap" }
    drone_chassis: { price: 60, name: "Drone Chassis" }
    dropped_credstick: { price: 40, name: "Dropped Credstick" }
    tourist_visor: { price: 16, name: "Tourist Visor" }

# ------------------------------------------------------------
# Tovah "Grease" Grzeska -- Junkyard Sprawl. Sells cheap, sells honest;
# buys at yard rate because the yard is where the hauling has not happened.
# ------------------------------------------------------------
grease:
