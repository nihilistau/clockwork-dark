      - { hours: [19, 20], location: rusty_anchor, activity: "eating standing up, arguing crane schedules with anyone fool enough to hold one" }
      - { hours: [21, 22, 23, 0, 1, 2, 3, 4, 5, 6], location: junkyard_sprawl, activity: "asleep in the crane cab with the yard lights on", available: false }

