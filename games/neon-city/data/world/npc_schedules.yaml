      - { hours: [18, 19], location: synthsec_gridpoint, activity: "logging the day's trucks, out full and back full, nobody unloading" }
      - { hours: [20, 21, 22], location: rusty_anchor, activity: "drinking alone at the short end of the bar, uniform jacket folded over the stool" }
      - { hours: [23, 0, 1, 2, 3, 4, 5], location: synthsec_gridpoint, activity: "bunked behind the wire", available: false }

