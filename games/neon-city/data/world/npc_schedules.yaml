      - { hours: [4, 5], location: ghost_alley, activity: "burning the night's session to cold storage, one drive at a time" }
      - { hours: [6, 7, 8, 9, 10, 11, 12], location: ghost_alley, activity: "offline; the line rings through to nothing", available: false }
      - { hours: [13, 14, 15, 16, 17, 18, 19], location: the_grid, activity: "drinking sump coffee near Mira's counter, listening to the room with her eyes closed" }

