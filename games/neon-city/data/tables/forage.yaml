# NEON CITY: THE CROSSING -- scavenging: what working a district for two
# hours actually gets you.
#
# Read by engine/game/foraging.py. This story's word for it is scavenging,
# and it is the free half of the economy: scavenge in the Downzone, fence
# in Midtown, spend on passage. It is also the free FOOD loop the graph
# shape demands -- protein paste and sealed rations turn up in the yard and
# past the wire, so a runner at zero credits still eats.
#
# A location is scavengeable when its tags intersect `location_tags`; the
# per-district tables below key on the district tags in locations.yaml, so
# the Strip yields credsticks and the alley yields data and neither yields
# the other's living.
#
# Version: v0.1.0 [2026-08-14]

version: 1

forage:
  # "Can you work this ground" is one question; the skill is fixed.
  skill: survival

  hours: 2.0
  stamina_cost: 8

  location_tags: [scavenge]

  # Node DCs map onto the BANDS in data/rules/skills.yaml.
  bands:
    - { upto: 8, band: trivial }
    - { upto: 11, band: easy }
    - { upto: 14, band: standard }
    - { band: hard }

  picks:
    crit_success: 4
    success: 3
    partial: 2
    failure: 0

  uncommon:
    degrees: [crit_success, success]
    chance: { crit_success: 0.85, success: 0.30 }

  # Worked ground gives less, gets harder, and forgets you only if left
  # alone. Floor above zero ON PURPOSE: a worked-out stack must get bad,
  # not become a wall.
  depletion:
    yield_step: 0.68
    yield_floor: 0.34
    dc_step: 1
    dc_cap: 5
    recovery_days: 1

  # The Sprawl has no harvest calendar; the "seasons" here are the canon
  # weather wheel stretched over the month -- clear runs, the wet, the acid
  # weeks, the storms. Scavenging is best in the wet (things wash loose)
  # and worst in the storms (nobody works a stack in a storm).
  season:
    days_each: 7
    order: [clear_run, the_wet, acid_weeks, storm_season]
    modifiers:
      clear_run: { check: 0, yield: 1.0, label: "a clear run" }
      the_wet: { check: 1, yield: 1.2, label: "the wet" }
      acid_weeks: { check: -1, yield: 1.0, label: "the acid weeks" }
      storm_season: { check: -2, yield: 0.7, label: "storm season" }

tables:

  # ---------------------------------------------------------------------
  # Junkyard Sprawl -- the richest ground on the map. Salvage, parts, and
  # the crates nobody came looking for.
  # ---------------------------------------------------------------------
  - id: junkyard_stacks
    label: "the stacks and the crane shadows"
    tags: [salvage]
    common:
      - { item_id: salvage_tech, weight: 30, qty: [1, 3] }
      - { item_id: copper_spool, weight: 24, qty: [1, 2] }
      - { item_id: deck_parts, weight: 14, qty: [1, 2] }
      - { item_id: protein_paste, weight: 16, qty: [1, 3] }
      - { item_id: sealed_ration, weight: 10, qty: [1, 2] }
    uncommon:
      - { item_id: drone_chassis, weight: 10, qty: [1, 1] }
      - { item_id: courier_wrap, weight: 12, qty: [1, 1] }

  # ---------------------------------------------------------------------
  # The Neon Strip -- a river crossing made of people, and people drop
  # things. Heat is the price; the strip's cameras are the best-fed in
  # Midtown, and the encounter table collects that bill.
  # ---------------------------------------------------------------------
  - id: strip_gutters
    label: "the gutters and the queue lines"
    tags: [crowd]
    common:
      - { item_id: tourist_visor, weight: 22, qty: [1, 1] }
      - { item_id: camera_capture, weight: 26, qty: [1, 2] }
      - { item_id: protein_paste, weight: 18, qty: [1, 2] }
    uncommon:
      - { item_id: dropped_credstick, weight: 12, qty: [1, 1] }

  # ---------------------------------------------------------------------
  # Ghost Alley -- data. Dead drops, cache keys, ICE fragments. Worthless
  # to Grease, gold to Rho and Lyra.
  # ---------------------------------------------------------------------
  - id: alley_drops
    label: "the taped seams and the dead drops"
    tags: [data]
    common:
      - { item_id: dead_drop_shard, weight: 28, qty: [1, 2] }
      - { item_id: camera_capture, weight: 16, qty: [1, 2] }
      - { item_id: protein_paste, weight: 12, qty: [1, 2] }
    uncommon:
      - { item_id: ice_fragment, weight: 12, qty: [1, 1] }
      - { item_id: cache_key, weight: 6, qty: [1, 1] }

  # ---------------------------------------------------------------------
  # Ripper Street -- chrome pulls, med supplies, parts. Somebody is always
  # watching what you carry out.
  # ---------------------------------------------------------------------
  - id: ripper_bins
    label: "the chop-shop bins and the recovery row"
    tags: [medical]
    common:
      - { item_id: salvage_tech, weight: 22, qty: [1, 2] }
      - { item_id: copper_spool, weight: 16, qty: [1, 2] }
      - { item_id: protein_paste, weight: 16, qty: [1, 2] }
    uncommon:
      - { item_id: medkit, weight: 8, qty: [1, 1] }
      - { item_id: deck_parts, weight: 10, qty: [1, 1] }

  # ---------------------------------------------------------------------
  # The Grid Point approach -- the ditches hold patrol logs and dropped
  # kit. Inside the wire there is nothing; this is the approach.
  # ---------------------------------------------------------------------
  - id: approach_ditches
    label: "the approach ditches"
    tags: [checkpoint]
    common:
      - { item_id: patrol_log, weight: 26, qty: [1, 2] }
      - { item_id: sealed_ration, weight: 18, qty: [1, 2] }
      - { item_id: copper_spool, weight: 14, qty: [1, 1] }
    uncommon:
      - { item_id: flash_torch, weight: 8, qty: [1, 1] }

  # ---------------------------------------------------------------------
  # The Shadow Crossing and the lift shed -- pre-corporate salvage on the
  # worst ground in the Sprawl. Every kilo costs energy; the one-of-ones
  # are the only goods that make Rho go quiet.
  # ---------------------------------------------------------------------
  - id: precorp_ground
    label: "the dark ground and the slab shed"
    tags: [wild, threshold]
    common:
      - { item_id: precorp_cable, weight: 26, qty: [1, 2] }
      - { item_id: sealed_ration, weight: 18, qty: [1, 2] }
      - { item_id: copper_spool, weight: 12, qty: [1, 2] }
    uncommon:
      - { item_id: precorp_tooling, weight: 10, qty: [1, 1] }
      - { item_id: one_of_one, weight: 4, qty: [1, 1] }
