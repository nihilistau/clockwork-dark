# NEON CITY: THE CROSSING -- natural 1 complications (d20). Same contract
# as boons.yaml: the engine picks, the effects are structured, the LLM only
# narrates. A complication is a cost, not a punishment -- it makes the next
# hour more interesting, never ends the run on a die face.
#
# Version: v0.1.0 [2026-08-14]

complications:
  - id: wasted_hours
    text: "It takes twice as long as it should and gives back nothing."
    effects:
      - { type: stamina, delta: -5 }

  - id: on_somebodys_feed
    text: "Somewhere, a camera you did not budget for files four seconds of you."
    effects:
      - { type: value, name: heat, delta: 3, why: "four seconds on the wrong feed" }

  - id: torn_and_soaked
    text: "Whatever else happened, the rain and the ground got their share of you."
    effects:
      - { type: check_penalty, delta: -1, days: 1, text: "soaked through and scraped" }

  - id: pocket_bled
    text: "Later, counting, you come up short and cannot name the moment it happened."
    effects:
      - { type: stat, stat: gold, delta: -20 }
