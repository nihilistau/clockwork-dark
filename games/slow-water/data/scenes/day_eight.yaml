# game: slow-water  kind: deck
# brief: Draft the deck 'day_eight': The final stretch toward the source. Use the id 'day_eight'. STORY BIBLE
id: day_eight
draw: 1
cards:
- id: hold_screws_discovery
  title: The Loose Screw
  text: In the dim light of the hold, you notice a fresh scratch on the wood near the lid.
    The screwdriver is heavy in your pocket, but the box itself seems to have shifted slightly
    under its own weight.
  tags:
  - sequence
  beats:
  - id: stealth_check
    text: Try to inspect the seal without being seen by a passing crewman.
    gate:
      check:
        stream: beat
        chance: 0.5
      on_pass:
        text: 'You see it clearly: the wood is not just screwed, it''s reinforced from the
          inside. You know too much for comfort.'
        effects:
        - type: value
          name: suspicion
          delta: 2
        - type: value
          name: composure
          delta: -1
      on_fail:
        text: A floorboard creaks. You pull back into the shadows, heart hammering against
          your ribs.
        effects:
        - type: value
          name: suspicion
          delta: 1
  - id: sympathy_check
    text: Offer him a moment of genuine humanity, beyond the professional mask.
    gate:
      check:
        stream: beat
        chance: 0.5
      on_pass:
        text: He tells you about the man in the box—not who he was, but how much it cost.
          He looks at you with terrifying hope.
        effects:
        - type: value
          name: favor
          delta: 1
        - type: value
          name: composure
          delta: -2
      on_fail:
        text: You maintain your professional distance, but the silence that follows is heavier
          than before.
        effects:
        - type: value
          name: favor
          delta: -1
  - id: nerve_check
    text: Hold her gaze without flinching or looking away.
    gate:
      check:
        stream: beat
        chance: 0.5
      on_pass:
        text: She nods once, a sharp, terrifying movement. She knows you are counting the
          days as much as she is.
        effects:
        - type: value
          name: suspicion
          delta: 1
      on_fail:
        text: You look down at your day-book. The ink seems to blur.
        effects:
        - type: value
          name: suspicion
          delta: 2
        - type: value
          name: composure
          delta: -1
  once: true
