# Drafted by scripts/author.py [2026-08-15] -- review before promoting.
# game: slow-water  kind: deck
# brief: Draft the deck 'day_nine': The burial and the conclusion of the contract. Use the id 'day_nine'. STO
id: day_nine
draw: 1
cards:
- id: the_final_rite
  title: The Final Rite
  text: The river is still at the source. Father Elm begins the liturgy while the family stands
    on the muddy bank. Do you perform your duty with perfect, hollow grace, or does a crack
    appear in your mask?
  tags:
  - sequence
  beats:
  - id: perfect_grief
    text: You weep with such precision that even Iva looks away. You have earned your fee,
      but the weight of the lie sits heavy in your throat.
    gate:
      check:
        stream: beat
        chance: 0.5
      on_pass:
        text: Nobody watching learns anything from your face that you did not
          decide to put there.
        effects:
        - type: value
          name: composure
          delta: 1
      on_fail:
        text: A sob escapes you, unbidden and ugly. The Ravels exchange a look that is not
          quite suspicion, but it is no longer favor.
        effects:
        - type: value
          name: favor
          delta: -1
  - id: the_unspoken_truth
    text: As the box is lowered, you catch Tobin's eye. He looks like he wants to scream or
      laugh; you aren't sure which.
    gate:
      check:
        stream: beat
        chance: 0.5
      on_pass:
        text: You hold his eye a half-second past professional, and somewhere
          behind you a fork is set down.
        effects:
        - type: value
          name: suspicion
          delta: 1
      on_fail:
        text: You keep your eyes on the water, refusing to meet the gaze of the living.
        effects:
        - type: value
          name: composure
          delta: -1
- id: the_settlement
  title: The Settlement
  text: Back on the barge, Iva hands you the envelope. It is thick, but it feels lighter than
    the truth.
  tags:
  - sequence
  beats:
  - id: honest_account
    text: You open your day-book and record every hour spent in silence. You do not add a
      single extra line for the things you saw.
    gate:
      check:
        stream: beat
        chance: 0.5
      on_pass:
        text: The book takes it the way the book takes everything, in one
          column, in a hand that does not shake.
        effects:
        - type: value
          name: favor
          delta: 1
      on_fail:
        text: You realize the fee is exactly what you expected, and nothing more. They knew
          you were counting.
        effects:
        - type: value
          name: suspicion
          delta: 1
  - id: the_hush_money
    text: The envelope contains more than the contract specified. It is a payment for your
      silence, not your weeping.
    gate:
      check:
        stream: beat
        chance: 0.5
      on_pass:
        text: You take it, and the taking is easy, and the ease is the part
          you will think about on the walk back.
        effects:
        - type: value
          name: composure
          delta: -1
      on_fail:
        text: You refuse the extra, choosing instead to keep only what was agreed. The Ravels
          watch you with newfound distance.
        effects:
        - type: value
          name: favor
          delta: -1
