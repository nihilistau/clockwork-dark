# game: slow-water  kind: deck
# brief: Draft the deck 'day_two': The realization that the family is not grieving as expected. Use the id 'd
id: day_two
draw: 1
cards:
- id: saloon_dinner
  title: The Saloon Dinner
  text: The meal is served with a mechanical precision. There are no heavy silences here,
    only the efficient clink of silver against porcelain and the low, rhythmic murmur of logistics.
    They speak of river depths and cargo weights as if the man in the hold were merely another
    crate.
  tags:
  - sequence
  - gm
  beats:
  - id: saloon_dinner_observation
    text: You watch them closely. The lack of grief is not a sudden absence, but a presence
      in itself—a vacuum where the mourning should be.
    gate:
      on_pass:
        text: The air feels thin. You realize you are performing for an audience that has
          already finished their play.
        effects:
        - type: value
          name: composure
          delta: -1
        - type: value
          name: suspicion
          delta: 1
- id: towpath_walk
  title: The Towpath Walk
  text: Walking alongside the slow-moving horses, the river's edge offers no solace. The family
    members move with a purposeful stride that has nothing to do with bereavement.
  tags:
  - sequence
  - gm
  beats:
  - id: towpath_observation
    text: You catch Tobin Ravel staring at the water, not with sadness, but with a restless,
      hungry sort of impatience.
    gate:
      on_pass:
        text: He looks like a man waiting for a tide to turn, rather than a son saying goodbye.
        effects:
        - type: value
          name: favor
          delta: -1
- id: iva_gaze
  title: Iva's Gaze
  text: Iva Ravel watches you from the corner of her eye. She doesn't look like a woman in
    mourning; she looks like a creditor waiting for a debt to be settled.
  tags:
  - sequence
  - gm
  beats:
  - id: iva_confrontation
    text: She tilts her head, studying the way you hold your handkerchief. She is looking
      for a crack in your professional veneer.
    gate:
      on_pass:
        text: The weight of her scrutiny makes the borrowed blacks feel much too heavy.
        effects:
        - type: value
          name: suspicion
          delta: 1
