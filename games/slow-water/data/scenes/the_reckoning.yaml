# The Slow Water -- the forced scene.
#
# NOT A DAY. The nine day_*.yaml decks are chapters and are dealt in order;
# this one is dealt only when `suspicion` fills, because data/rules/clocks.yaml
# names it in `forces_scene`. A clock whose forced scene does not exist is a
# promise with nothing behind it -- the deck id here and the `forces_scene:`
# value there are one coupling, and breaking it fails quietly at the exact
# moment the story was supposed to pay off.
#
# The scene the whole clock is for: the Ravels stop wondering whether the
# hired weeper has worked it out, and start acting on having decided.
#
# Version: v0.1.0

id: the_reckoning
draw: 1

cards:

  # Always dealt when this deck is forced -- the confrontation is the point,
  # so it does not compete on weight with anything.
  - id: TR_01_iva_closes_the_door
    required: true
    tags: [sequence, gm]
    title: "Iva Closes the Door"
    text: >-
      INTENT: she stops managing you and starts negotiating with you, which
      is worse and more honest. SEQUENCE -- both beats resolve, in order.
    beats:
      - id: TR_01_the_offer
        text: >-
          She does not ask what you know. She asks what your week is worth,
          and waits, with a pencil, as though this were the fee negotiation
          and not the second one.
        gate:
          # A real threshold: a mourner they still like gets the offer made
          # politely. One they do not gets it made plainly.
          when: { value: { name: favor, min: 50 } }
          on_pass:
            text: >-
              "You have been very good," she says, and means the work, and
              means the silence, and does not distinguish between them.
            effects:
              - { type: value, name: favor, delta: 3, why: "she would rather buy you than frighten you" }
          on_fail:
            text: >-
              "You are staff," she says. "I am telling you what staff are
              told." The pencil does not move.
            effects:
              - { type: value, name: favor, delta: -4, why: "the pretence of employing a colleague is dropped" }
              - { type: value, name: composure, delta: -3 }
      - id: TR_01_what_it_costs_to_hold
        text: >-
          Whatever your face does next, you will be doing it in front of
          someone who reads faces for a living too. Judged, not rolled.
        band:
          value: composure
          min: 1
          max: 5
          text: "How much of the mask survived the room."

  # The player's move, once the offer is on the table.
  - id: TR_02_what_you_do_about_it
    tags: [menu]
    title: "What You Do About It"
    weight: 2.0
    text: >-
      INTENT: the choice the nine days have been building to. MENU --
      resolve exactly the beat the player chose.
    beats:
      - id: TR_02_take_the_money
        text: >-
          You name a number. She pays it without flinching, which tells you
          it was low, and you will think about that on the walk home.
        gate:
          on_pass:
            text: "The account is closed on their terms, and closed is closed."
            effects:
              - { type: value, name: favor, delta: 6, why: "a professional, in the end" }
              - { type: value, name: composure, delta: -5, why: "you found out what you cost" }
      - id: TR_02_do_the_job_only
        text: >-
          You say you were hired to grieve, that you are good at it, and
          that you have no other opinions available at this rate.
        gate:
          when: { value: { name: composure, min: 45 } }
          on_pass:
            text: >-
              It is the truest thing you have said aboard, and it is also
              exactly what she wanted to hear, and both of those are real.
            effects:
              - { type: value, name: composure, delta: 5, why: "you held the line and the line was yours" }
          on_fail:
            text: >-
              Your voice goes somewhere you did not send it, and the sentence
              arrives as a plea instead of a position.
            effects:
              - { type: value, name: composure, delta: -4 }
              - { type: value, name: favor, delta: -2 }
      - id: TR_02_say_the_name
        text: >-
          You say the name that is on the box, and then you say it again as
          a question, and you let the second one sit there.
        gate:
          on_pass:
            text: >-
              Nobody answers. Somebody, later, will decide what that silence
              was, and it will not be you.
            effects:
              - { type: value, name: favor, delta: -8, why: "counting out loud is the one thing staff must not do" }
              - { type: value, name: composure, delta: 4, why: "eleven funerals, and you finally asked" }
              - { type: flag, flag: said_the_name_aloud }
