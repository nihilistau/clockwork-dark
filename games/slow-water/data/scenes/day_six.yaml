# game: slow-water  kind: deck
# brief: Draft the deck 'day_six': Suspicion begins to mount among the passengers. Use the id 'day_six'. STOR
id: day_six
draw: 1
cards:
- id: glances_at_the_table
  title: Glances at the Table
  text: During the evening meal in the saloon, you catch Iva watching your hands instead of
    her plate. The silence between courses feels heavier than usual.
  tags:
  - gm
  - sequence
  beats:
  - id: glances_at_the_table_beat_1
    text: The air in the saloon grows thick with what is not being said.
    gate:
      on_pass:
        text: You feel your mask slipping under their scrutiny.
        effects:
        - type: value
          name: suspicion
          delta: 1
        - type: value
          name: composure
          delta: -1
  once: true
  when:
    value:
      name: suspicion
      min: 3
- id: the_hold_shadows
  title: Shadows in the Hold
  text: You descend into the hold to check your gear. The light from the river through the
    boards makes the screws on the box look like teeth.
  tags:
  - gm
  beats:
  - id: the_hold_shadows_beat_1
    text: A floorboard creaks above you. Someone is standing right outside the hatch, listening.
    gate:
      on_pass:
        text: You are not alone in the dark.
        effects:
        - type: value
          name: suspicion
          delta: 1
  once: true
  when:
    value:
      name: suspicion
      min: 2
- id: towpath_whispers
  title: Whispers on the Towpath
  text: While walking alongside the barge, Sabra Corriveau leans in close. She doesn't look
    at you, but her voice is low enough to be dangerous.
  tags:
  - gm
  beats:
  - id: towpath_whispers_beat_1
    text: She asks if the weight of the box feels right for a man of his age.
    gate:
      on_pass:
        text: The question hangs in the damp air between you.
        effects:
        - type: value
          name: suspicion
          delta: 1
        - type: value
          name: composure
          delta: -1
  once: true
  when:
    value:
      name: suspicion
      min: 4
- id: afterdeck_solitude
  title: Solitude on the Afterdeck
  text: The river is dark and the wake is a white scar in the moonlight. You try to find your
    rhythm, but your hands are shaking.
  tags:
  - gm
  beats:
  - id: afterdeck_solitude_beat_1
    text: You wonder how many more days you can keep the face of a professional.
    gate:
      on_pass:
        text: The mask holds, for now.
        effects:
        - type: value
          name: composure
          delta: 1
  once: true
