# Drafted by scripts/author.py [2026-08-15] -- review before promoting.
# game: slow-water  kind: deck
# brief: Draft the deck 'day_seven': A moment of truth in the hold. Use the id 'day_seven'. STORY BIBLE: # Th
id: day_seven
draw: 3
cards:
- id: the_loose_screw
  title: The Loose Screw
  text: In the dim river light, you notice one of the new screws on the lid is backing out.
    The wood around it looks fresh, unweathered by the damp hold.
  tags:
  - sequence
  beats:
  - id: investigate_lid
    text: Examine the lid to see if the box is truly empty or merely light.
    gate:
      check:
        stream: beat
        chance: 0.5
      on_pass:
        text: The weight is wrong. It's not just a lighter man; it's an empty casket waiting
          for a body that isn't coming.
        effects:
        - type: value
          name: suspicion
          delta: 1
        - type: value
          name: composure
          delta: -1
        # HAND-ADDED, and the one coupling the drafting tool could not make:
        # data/rules/clocks.yaml winds `suspicion` on this flag, and until
        # something wrote it that trigger was dead. Both branches set it --
        # what the family reacts to is that you went below and put your hands
        # on the lid, not whether you learned anything by it.
        - type: flag
          flag: counted_the_screws
      on_fail:
        text: You fumble in the dark, making a noise that echoes too loudly against the hull.
        effects:
        - type: value
          name: suspicion
          delta: 1
        - type: flag
          flag: counted_the_screws
  required: false
- id: tobins_question
  title: Tobin's Question
  text: Tobin Ravel finds you in the hold. He smells of cheap gin and looks like he hasn't
    slept since the river started.
  tags:
  - sequence
  beats:
  - id: confront_tobin
    text: 'He asks you directly: ''Do you think they''re lying to us?'''
    gate:
      check:
        stream: beat
        chance: 0.5
      on_pass:
        text: You give him a professional answer that says nothing, but he sees the truth
          in your eyes.
        effects:
        - type: value
          name: favor
          delta: 1
        - type: value
          name: suspicion
          delta: 1
      on_fail:
        text: You lose your professional mask. He sees the hired mourner, not the woman.
        effects:
        - type: value
          name: composure
          delta: -1
        - type: value
          name: suspicion
          delta: 2
  required: false
- id: the_priests_gaze
  title: The Priest's Gaze
  text: Father Elm stands at the top of the hold ladder. He isn't looking at you, but he is
    watching your hands.
  tags:
  - sequence
  beats:
  - id: maintain_mask
    text: Maintain your composure and pretend you were merely checking the sturdiness of the
      trestles.
    gate:
      check:
        stream: beat
        chance: 0.5
      on_pass:
        text: He nods, a silent pact formed in the shadows. He has his own arithmetic to perform.
        effects:
        - type: value
          name: suspicion
          delta: -1
      on_fail:
        text: The silence between you becomes heavy, a weight that even the river cannot wash
          away.
        effects:
        - type: value
          name: suspicion
          delta: 1
  required: false
