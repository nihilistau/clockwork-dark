# The Slow Water -- threads: contracts the world remembers.
#
# Read by engine/game/threads.py through `paths.threads`.
#
#   Offer -> Terms -> Seal -> Thread
#
# A thread is offered, its terms are stated, it is sealed by some act, and
# then it STAYS -- active, discharged, broken or transformed -- until
# something resolves it. Nothing about it is prose an agent can quietly stop
# honouring three turns later. In a story with no coin, this IS the economy.
#
# THIS STORY'S ECONOMY IS LITERALLY A CONTRACT. The player is hired labour
# with a day rate, so the thread system is not a metaphor here: the mourner's
# engagement is a real thread with real terms, and every extra thing the
# family asks of them is a renegotiation of it.
#
# Version: v0.2.0

version: 1

# The story's tag vocabulary. An offer naming a tag not on this list has it
# DROPPED at bounding, with a note on the offer -- a bargain tagged with a
# promise the fiction cannot keep is worse than none. Empty list = any tag.
tags:
  - Employment
  - Discretion
  - Kin

# What can end a thread early AT ALL here, and what each costs. A thread's
# own `can_cut_with` is INTERSECTED with these keys, so no contract can
# advertise an escape route the world does not implement.
cutters:
  # Dropping the professional register and saying the true thing in plain
  # words. Gated on favor because a mourner nobody trusts does not get heard
  # out; the denial text is what a refused player is told.
  speak_plainly:
    kind: invocation
    requires: { value: { name: favor, min: 40 } }
    denied_text: "You are staff. Staff do not open that subject at this table."

# Sealed automatically when a gift is accepted without asking its price
# (engine/game/threads.py::accept_gift). Money pressed into a mourner's hand
# beyond the agreed rate is never only money. Delete the block and gifts are
# free.
gift_obligation:
  template: mourners_contract

templates:

  # The engagement itself: nine days at a day rate, grief supplied on
  # demand. The Ravels think they are buying a performance. They are also
  # buying a witness, and have not thought about that part.
  mourners_contract:
    source: iva_ravel
    tags: [Employment, Discretion]
    terms: >-
      Grief on demand, at the rail and at the graveside, for the length of
      the passage. Discretion is not written down anywhere and is the
      larger half of what is being paid for.
    can_cut_with: [speak_plainly]
    # Days from seal until due; threads.expire_due breaks any live thread
    # past its day -- silence is an answer too.
    #
    # FIVE, NOT THREE. The template shipped 3, which contradicted the terms
    # this contract states: an engagement for "the length of the passage" on
    # a nine-day river cannot come due in three. Measured with the deck
    # walker before and after (CLAUDE.md rule 10) -- at the walker's default
    # thread rate the shorter fuse expired most contracts unresolved, and
    # each break costs 10 favor, which was the single largest drain on the
    # meter the good ending is gated on.
    due_in_days: 5
    on_seal:
      - { type: value, name: favor, delta: 4, why: "hired help who take the terms as offered are restful" }
    on_discharge:
      - { type: value, name: favor, delta: 5 }
      - { type: value, name: composure, delta: 2 }
    on_break:
      - { type: value, name: favor, delta: -10 }
      - { type: value, name: composure, delta: -4 }

    # RENEGOTIATE IS NOT ACCEPT/REFUSE: each variant is a DIFFERENT
    # contract with its own terms and costs, inheriting whatever it does
    # not restate.
    renegotiations:

      name_the_extra:
        label: "Ask what the extra money is for, before taking it"
        terms: >-
          The additional service is named tonight and done tomorrow, and
          then the account is closed and stays closed.
        tags: [Employment]
        due_in_days: 1
        on_seal:
          - { type: value, name: composure, delta: 3, why: "you asked the question with your voice level" }
          - { type: value, name: favor, delta: -2, why: "they would rather it went unnamed" }

      day_rate_only:
        label: "Decline the extra. The agreed rate, the agreed work."
        # `outcome: none` -- the negotiation ends in NO contract. Refusing
        # well is a real move, and it still costs and earns.
        outcome: none
        terms: "No thread. Iva nods once, and revises something about you."
        on_seal:
          - { type: value, name: composure, delta: 4 }
          - { type: value, name: favor, delta: -5 }
