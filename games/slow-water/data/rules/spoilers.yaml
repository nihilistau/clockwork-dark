# The Slow Water -- what the narration may not name yet.
#
# Found by fixed filename inside `paths.rules`; read by
# engine/lore/interceptors.py. Below `awareness.spoiler_gate_threshold` each
# `term` is rewritten to `instead`, out of narration and out of prompt
# blocks wrapped in `mark_spoiler`. Above it, nothing is touched.
#
# Engine identifiers are masked for every story by the engine's own table;
# a row here supplies YOUR wording for YOUR secrets.
#
# Version: v0.1.0

spoilers:
  # The thing the whole passage is organised around not saying: the box does
  # not hold the man whose name is on it. Below the gate the narration may
  # circle it, never land on it -- the player's suspicion is theirs to
  # arrive at, and a narrator that says it first has taken the story away
  # from them.
  - term: "the wrong body"
    instead: "whatever is actually in the box"
  - term: "the man in the box"
    instead: "the name on the lid"
