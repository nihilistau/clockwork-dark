# The Slow Water -- epilogue prose.
#
# Read by engine/game/epilogue.py; found because epilogue_index.yaml names
# this file in `prose_source`, never by its own name.
#
# TWO CARDS PER ENDING, because the renderer draws two:
#   card_m   AFTER -- the world beyond the story, once you are out of it
#   card_g   HERE -- what this place looks like without you in it
#
# The engine substitutes nothing inside these; braces here would be literal.
# `echoes` is a list of {speaker, text}; the index's `echo_speaker` declares
# WHO gets the last word, this file is what they say. An ending with an
# empty `echo_speaker` has no `echoes` block, and the silence is the point.
#
# Version: v0.2.0

version: 1

cards:

  paid_in_full:
    title: "Paid in Full"
    card_m: |-
      There is other work. There is always other work; people die at a
      reliable rate and their families keep being unable to do this in
      public. You are recommended, quietly, twice that winter.
      You do not open the day-book for a while. When you do, both columns
      are in your handwriting and only one of them is any use to anybody.
    card_g: |-
      The barge goes back down empty and makes better time. Sabra scrubs
      the afterdeck where you stood, because that is Tuesday, not because
      of you.
      At the source the ground closes over a man whose name is on the
      stone, and the stone is not wrong, exactly.
    echoes:
      - speaker: iva_ravel
        text: |-
          You were worth the rate. I want you to know I mean that as the
          compliment it is, and to understand that it is the whole of what
          I am ever going to say to you.

  the_other_column:
    title: "The Other Column"
    card_m: |-
      The fee is sent on. It arrives, in full, with no letter, which is
      itself a sentence of about four words.
      You keep taking the work. You are, by every measure that a family
      hiring you would use, still good at it. What has changed is that you
      now notice when you have stopped pretending, and there is no rate for
      that.
    card_g: |-
      The Ravels go home by road and are not seen on this river again.
      The story reaches the trade the way these things do -- sideways, at a
      remove, told about someone else. Nobody quite says what happened.
      Everybody says who it happened to.
