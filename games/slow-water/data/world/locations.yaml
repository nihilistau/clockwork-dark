# The Slow Water -- the places. Four, authored, no travel economy.
#
# In a deck-shaped story the map is a stage set, not a graph to optimise:
# edges cost no hours (the day advances when a chapter ends, not when you
# walk), carry no danger (there are no encounter tables to pay off a roll)
# and grant no awareness. The loader still requires `name` and `ring`
# (0-4), and still skips-and-logs bad entries rather than raising.
#
# The whole map is one boat. Ring 0 is where the job is done in public;
# ring 1 is the rest of the vessel. The hold is reachable from the
# afterdeck alone, deliberately: going down to the box is never something
# the player does on the way to somewhere else.
#
# Version: v0.2.0

version: 1

rings:
  0: "The Working Deck"
  1: "The Barge"

locations:

  afterdeck:
    name: "The Afterdeck"
    ring: 0
    evil_multiplier: 0.1
    # ID PINNED: game.yaml's `entry.location_id`. The story opens with the
    # player already at work, because a hired mourner's first question is
    # not whether to board -- it is what to do with the hours nobody is
    # watching them grieve.
    summary: >-
      Wet boards, a rail, and the wake unrolling behind you in a long grey
      seam. The only place aboard where you are alone and still visible,
      which is the entire nature of the work.
    tags: [exterior, wet, working]
    connections:
      saloon: { hours: 0, danger_dc: 0, awareness_delta: 0 }
      hold: { hours: 0, danger_dc: 0, awareness_delta: 0 }
      towpath: { hours: 0, danger_dc: 0, awareness_delta: 0 }

  saloon:
    name: "The Saloon"
    ring: 1
    evil_multiplier: 0.1
    summary: >-
      Brass lamps and a table too fine for a boat. The Ravels eat here three
      times a day whether or not they have anything to say to each other,
      and there are nine chairs, and eight of them are used.
    tags: [interior, formal, social]
    connections:
      afterdeck: { hours: 0, danger_dc: 0, awareness_delta: 0 }

  hold:
    name: "The Hold"
    ring: 1
    evil_multiplier: 0.1
    summary: >-
      Low and cold, with river light coming through the boards in bars. The
      box sits on trestles. The lid is screwed rather than nailed, and the
      screws are newer than the wood they are sunk into.
    tags: [interior, cold, confined]
    connections:
      afterdeck: { hours: 0, danger_dc: 0, awareness_delta: 0 }

  towpath:
    name: "The Towpath"
    ring: 1
    evil_multiplier: 0.1
    summary: >-
      Where everyone walks when the river runs too shallow to push: mud,
      horses, and a mile of company nobody chose. Things get said on the
      towpath that are not said aboard.
    tags: [exterior, mud, walking]
    connections:
      afterdeck: { hours: 0, danger_dc: 0, awareness_delta: 0 }
