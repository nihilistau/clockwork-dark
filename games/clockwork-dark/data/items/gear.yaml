# Light sources and things worn.
#
# There is no armour class in this game (DESIGN.md: no MMO combat spam), so a
# shield is a tool for putting between yourself and a problem, priced like the
# board and iron it is made of. Apparel is weather, not defence -- the survival
# model in engine/game/survival.py is what these are for.
#
# EVERY ITEM IN THIS FILE USED TO BE INERT. Twelve pieces of gear, and the only
# thing a player could do with any of them was sell it: a cloak that could not
# be worn, a shield that stopped nothing, four light sources that were never
# lit. They now carry `equip:` and `use:` blocks (see the field reference
# below), which is the whole of the change -- the numbers are small on purpose.
#
# Field reference: see data/items/food.yaml. Additional blocks:
#   equip.slot           head|body|feet|hands|belt|offhand|light|back
#   equip.bonuses        [{skills: [...], delta: n}] -- itemised into the check
#                        receipt by engine/game/checks.py, by name
#   equip.absorbs_wounds points of wound severity taken off the top, never to
#                        zero (engine/game/effects.py)
#   equip.carry_bonus    kilograms added to the reported carry limit
#   use                  a verb: hours, what it consumes, what it does
#   collection           set id in data/tables/collections.yaml
#
# Version: v0.2.0 [2026-08-08]

version: 1

items:

  - id: candle
    name: "Tallow candle"
    description: >-
      Rendered fat around a rush wick. Burns for four hours, smells of the
      animal, and gutters in any draught worth the name.
    tags: [light]
    weight: 0.1
    value: 1
    art: candle
    use:
      verb: "light"
      hours: 0.5
      consumes: 1
      effects:
        - type: check_penalty
          id: burning_light
          text: "a light against the dark"
          delta: 1
          skills: [nerve, lore]
          days: 1
      text: >-
        You light it and set it where it will not blow out. The dark does not
        go away. It just stops being the whole of the room.
    stack: true

  - id: tallow_lamp
    name: "Clay lamp"
    description: >-
      A pinched clay saucer with a floating wick. Cheap, ugly, and the only
      light in half the houses on Well Row.
    tags: [light]
    weight: 0.4
    value: 3
    equip:
      slot: light
      bonuses:
        - { skills: [craft], delta: 1 }
      text: >-
        You hook the saucer where it will throw light on your hands. Ugly, and
        it means work does not have to stop at dusk.
    stack: true

  - id: pitch_torch
    name: "Pitch torch"
    description: >-
      Birch resin and tow on a hazel stave. Bright, brief, and visible from
      the treeline, which cuts both ways.
    tags: [light]
    weight: 0.6
    value: 2
    equip:
      slot: light
      bonuses:
        - { skills: [nerve], delta: 1 }
        - { skills: [stealth], delta: -2 }
      text: >-
        Lit and carried high. You can see, and so can everything on the
        treeline that has been waiting for you to make it easy.
    stack: true

  - id: tinderbox
    name: "Tinderbox"
    description: >-
      Flint, steel and charred linen in a tin. The difference between a cold
      night and a bad one.
    tags: [light, tool]
    weight: 0.3
    value: 7
    equip:
      slot: belt
      bonuses:
        - { skills: [survival], delta: 1 }
      text: "Flint, steel and char, on the belt where a cold hand can find them."
    use:
      verb: "build a fire"
      hours: 1.0
      once_per_day: true
      also_consumes:
        - { id: firewood_bundle, qty: 1 }
      effects:
        - type: check_penalty
          id: warm_and_dry
          text: "warm and dry"
          delta: 1
          skills: [survival, nerve]
          days: 1
        - type: stamina
          delta: 5
      text: >-
        Char takes on the third strike. You sit with your boots off and your
        back to the light and stop being cold, which turns out to have been
        most of what was wrong.
    stack: false

  - id: wool_cloak
    name: "Wool cloak"
    description: >-
      Undyed, greasy with its own lanolin, and warm even wet. The single most
      useful thing anyone on this road owns.
    tags: [apparel]
    weight: 2.0
    value: 30
    equip:
      slot: body
      bonuses:
        - { skills: [survival], delta: 1 }
        - { skills: [nerve], delta: 1 }
      text: >-
        Over the shoulders and pinned. Warm even wet, which is the only kind of
        warm this road offers.
    collection: road_kit
    stack: false

  - id: oiled_hood
    name: "Oiled hood"
    description: >-
      Linen boiled in linseed until it stands up on its own. Sheds the wrong
      rain as well as the right sort, so far.
    tags: [apparel]
    weight: 0.5
    value: 12
    equip:
      slot: head
      bonuses:
        - { skills: [survival], delta: 1 }
      text: "Up, and the rain becomes somebody else's problem for an hour or two."
    collection: road_kit
    stack: false

  - id: hobnail_boots
    name: "Hobnailed boots"
    description: >-
      Iron studs in a hide sole. They ring on the Millhaven metalling, which
      is how the watch counts people in the dark.
    tags: [apparel]
    weight: 1.4
    value: 45
    equip:
      slot: feet
      bonuses:
        - { skills: [survival], delta: 2 }
        - { skills: [stealth], delta: -1 }
      text: >-
        Laced. Your feet will last twice as far and every stone floor between
        here and Millhaven will announce you.
    collection: road_kit
    stack: false

  - id: leather_apron
    name: "Leather apron"
    description: >-
      Scarred by sparks at the forge or scorched by the oven mouth, depending
      whose it was. Everyone who has one earned it.
    tags: [apparel, tool]
    weight: 1.2
    value: 16
    equip:
      slot: body
      bonuses:
        - { skills: [craft], delta: 1 }
      absorbs_wounds: 1
      text: >-
        On over everything, straps crossed at the back. Sparks and oven-mouths
        stop being a thing you have to think about.
    stack: false

  - id: wooden_shield
    name: "Board shield"
    description: >-
      Limewood planks, a hide facing and an iron boss. Heavy, and better at
      stopping an argument than winning one.
    tags: [apparel, tool]
    weight: 3.5
    value: 35
    art: wooden_shield
    equip:
      slot: offhand
      bonuses:
        - { skills: [nerve], delta: 1 }
        - { skills: [stealth], delta: -1 }
      absorbs_wounds: 2
      text: >-
        On the arm, boss forward. It is heavy and it is between you and the
        problem, which is the entire argument for it.
    stack: false

  - id: small_shield
    name: "Buckler"
    description: >-
      A fist-sized iron disc on a strap. Militia issue at Millhaven, which
      means it turns up in the ditch camp too.
    tags: [apparel, tool, trade]
    weight: 1.1
    value: 22
    art: small_shield
    equip:
      slot: offhand
      bonuses:
        - { skills: [nerve], delta: 1 }
      absorbs_wounds: 1
      text: >-
        Strapped to the fist. It will not stop much, and it will stop the first
        thing, which is usually the one that matters.
    stack: false

  - id: travel_pack
    name: "Travelling pack"
    description: >-
      Waxed canvas over an ash frame, with the straps repaired twice by
      different hands.
    tags: [apparel, tool]
    weight: 1.0
    value: 20
    equip:
      slot: back
      carry_bonus: 15.0
      bonuses:
        - { skills: [survival], delta: 1 }
      text: >-
        Shouldered and cinched. Everything you own moves from your arms to your
        back and stops being a decision you make every hour.
    collection: road_kit
    stack: false
