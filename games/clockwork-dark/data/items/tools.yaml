# Tools -- the things honest work is done with.
#
# DESIGN.md's second pillar is "mundane craft as dignity". A baker's peel and a
# tinker's kit therefore get the same care as a knife, and cost more.
#
# Six of these were already recipe tools and did their work by being HELD.
# The rest -- knives, maps, wire and line -- did nothing at all, so they carry
# `equip:` and `use:` blocks now. A tool on the belt is the cheapest honest
# bonus in the game: +1 to one named skill, and a reason to have brought it.
#
# Field reference: see data/items/food.yaml; the equip/use/collection blocks
# are documented in data/items/gear.yaml.
#
# Version: v0.2.0 [2026-08-08]

version: 1

items:

  - id: hearth_knife
    name: "Hearth knife"
    description: >-
      A short iron blade with a scorched handle, meant for bread and rope and
      not for people. It will do for people.
    tags: [tool]
    weight: 0.3
    value: 14
    art: hearth_knife
    equip:
      slot: belt
      bonuses:
        - { skills: [survival], delta: 1 }
        - { skills: [nerve], delta: 1 }
      text: >-
        On the belt, scorched handle out. Meant for bread and rope and not for
        people, and everyone who sees it knows the second half of that sentence.
    stack: false

  - id: stone_knife
    name: "Knapped stone knife"
    description: >-
      Older than the village and sharper than it has any right to be. Turned
      up in a furrow at the Fallow holding and nobody wanted it in the house.
    tags: [tool, quest]
    weight: 0.2
    value: 6
    art: stone_knife
    equip:
      slot: belt
      bonuses:
        - { skills: [survival], delta: 1 }
        - { skills: [lore], delta: 1 }
      text: >-
        It sits in the hand as though it were made for a hand very like yours,
        which is the part nobody at the Fallow holding wanted to say out loud.
    collection: turned_up_things
    stack: false

  - id: whetstone
    name: "Whetstone"
    description: >-
      A grey block worn into a saddle down the middle. Odran sells them off
      the cart and will show you the angle if you ask twice.
    tags: [tool, trade]
    weight: 0.5
    value: 5
    art: whetstone
    use:
      verb: "sharpen"
      hours: 0.5
      once_per_day: true
      effects:
        - type: check_penalty
          id: keen_edge
          text: "a keen edge"
          delta: 1
          skills: [craft, survival]
          days: 1
      text: >-
        Twenty strokes a side at the angle Odran shows you if you ask twice.
        Everything you own cuts, for one day, the way it did when it was new.
    stack: true

  - id: iron_key
    name: "Iron key"
    description: >-
      Long-shanked and cold, with wards cut in a pattern that stopped being
      made two generations ago.
    tags: [tool, quest]
    weight: 0.1
    value: 4
    art: iron_key
    collection: turned_up_things
    stack: false

  - id: road_map
    name: "Road map to Millhaven"
    description: >-
      Ink on scraped hide, marked with the three fords and the toll. Accurate
      the year it was drawn, which was not this year.
    tags: [tool, trade]
    weight: 0.2
    value: 15
    art: road_map
    use:
      verb: "study"
      hours: 0.5
      once_per_day: true
      effects:
        - type: check_penalty
          id: route_planned
          text: "the route planned"
          delta: 1
          skills: [survival]
          days: 1
      text: >-
        Three fords, one toll, and a bridge that the ink says is there. You
        pick the day's road before you are standing in it.
    stack: false

  - id: tinker_map
    name: "Tinker knowledge map"
    description: >-
      Not a map of roads. A map of who owes what to whom between here and the
      Marches, in a shorthand only tinkers read.
    tags: [tool, trade, quest]
    weight: 0.1
    value: 20
    art: tinker_map
    use:
      verb: "read"
      hours: 0.5
      once_per_day: true
      effects:
        - type: check_penalty
          id: knows_the_debts
          text: "you know who owes whom"
          delta: 1
          skills: [persuasion, lore]
          days: 1
      text: >-
        Not roads. Debts, feuds, and who will not speak to whom between here
        and the Marches. You spend a morning on it and stop guessing.
    stack: false

  - id: baking_peel
    name: "Baker's peel"
    description: >-
      A long ash paddle, thinned at the lip by forty years of scraping stone.
      Maris has two and lends neither.
    tags: [tool]
    weight: 1.6
    value: 9
    stack: false

  - id: mortar_and_pestle
    name: "Mortar and pestle"
    description: >-
      River stone, hollowed by use rather than tooling. Herb work that is not
      done in one of these is not herb work.
    tags: [tool]
    weight: 2.2
    value: 11
    stack: false

  - id: hand_awl
    name: "Hand awl"
    description: >-
      A spike in a pear-wood handle for punching leather and canvas. Every
      cart on the road carries one and every carter has stabbed themself with it.
    tags: [tool]
    weight: 0.2
    value: 4
    equip:
      slot: hands
      bonuses:
        - { skills: [craft], delta: 1 }
      text: "In the hand or through the belt loop, point buried in a cork."
    stack: true

  - id: snare_wire
    name: "Coil of snare wire"
    description: >-
      Brass wire, ten arm-lengths, drawn thin. Sets a hare loop in the time it
      takes to explain one.
    tags: [tool, material]
    weight: 0.2
    value: 5
    equip:
      slot: belt
      bonuses:
        - { skills: [survival], delta: 1 }
      text: >-
        Coiled at the hip. A hare loop takes the time it takes to explain one,
        and the wood stops being a place you walk through.
    stack: true

  - id: fishing_line
    name: "Waxed fishing line"
    description: >-
      Horsehair twisted and waxed, wound on a notched stick, with three bone
      hooks pushed into the cork.
    tags: [tool]
    weight: 0.1
    value: 4
    equip:
      slot: belt
      bonuses:
        - { skills: [survival], delta: 1 }
      text: >-
        Wound on its stick with the hooks in the cork. A set line works while
        you sleep, which is the only labour in this game that does.
    stack: true

  - id: tinker_kit
    name: "Tinker's mending kit"
    description: >-
      A hinged tin of solder, flux, wire, three files and a very small hammer.
      Ilya sells them assembled and buys them back empty.
    tags: [tool, trade]
    weight: 1.1
    value: 28
    equip:
      slot: hands
      bonuses:
        - { skills: [craft], delta: 2 }
      text: >-
        Open on the knee, files laid out in order. There is very little on this
        road that this tin cannot put back together once.
    stack: false

  - id: hand_lantern
    name: "Horn lantern"
    description: >-
      A candle in a box of scraped horn, so the wind does not get it and the
      light does not carry far enough to be seen from the treeline.
    tags: [tool, light]
    weight: 0.9
    value: 16
    equip:
      slot: light
      bonuses:
        - { skills: [lore], delta: 1 }
        - { skills: [survival], delta: 1 }
      text: >-
        Scraped horn, so the wind does not get it and the light does not carry
        to the treeline. You can read by it and nothing can read you.
    collection: road_kit
    stack: false
