# Version: v0.2.0 [2026-10-28]
#
# The last quest in the last arc, and it is a bake.
#
# This is here on purpose and it is the whole design in one file: even at the
# far end of the Convergence, with the road shortening and a name written down
# and a valley bought at a price, the game's final beat is an ordinary morning's
# work done properly. The baker path is not the arc you leave behind. It is the
# thing all the other arcs were about.
#
# THE LAST DOOR (v0.25.0 §4.3). The door is a deck card, not this quest: the
# morning firing's Q1_tell_her_or_dont (data/scenes/the_morning_firing.yaml),
# dealt at the bakery while Maris is there once The Named Wound is eligible --
# which its `baked` clause makes true at this quest's third stage,
# `tell_her_or_dont`. Two of Q1's beats lock The Named Wound BY NAME; its
# third, `not_yet`, ends nothing and the card comes round again. Q0 sets
# `show_up`'s flag in that stage's own hours. The quest opens on
# what_edgewood_keeps alone: the_sacrifice and the_heartland_road end the
# story at their own doors, so requiring either would make The Named Wound
# unreachable.

id: the_last_quiet_thing
arc: convergence
name: "The Last Quiet Thing"
summary: >-
  The oven still has to be banked. Somebody still has to do it. Everything else
  is negotiable and this is not.

preconditions:
  all:
    - min_awareness: 62
    - quest_completed: what_edgewood_keeps

start_text: >-
  Maris is at the bakery at four in the morning, the way she has been every
  morning you have known her, and the way she will be tomorrow.

stages:
  - id: show_up
    objective: "Be at the bakery for the firing. As if nothing had happened."
    narrative_flags:
      - nf_lastquiet_showed_up
    complete_when:
      all:
        - at_location: edgewood_bakery
        - hour_between: [4, 7]
        - flag: nf_lastquiet_showed_up
    complete_text: >-
      She hands you the long peel without looking up. There is no ceremony to it
      and that is the mercy.
    on_complete:
      effects:
        # Progress is pushback too: a smaller earned reprieve (R-06).
        - type: doom_resistance
          delta: 8
        - type: stamina
          delta: -12

  - id: the_batch
    objective: "Get one full batch out. Properly. Not quickly."
    complete_when:
      all:
        - at_location: edgewood_bakery
        - min_stat: { stat: craft, min: 11 }
        - days_in_stage: 1
    complete_text: >-
      Forty loaves. Two of them are wrong and you know exactly why, which is
      what a year of mornings buys you.
    on_complete:
      effects:
        # Progress is pushback too: a smaller earned reprieve (R-06).
        - type: doom_resistance
          delta: 8
        - type: craft
          delta: 1
        - type: item
          item_id: loaf
          name: "Loaf of bread"
          qty: 4
          tags: [food]

  - id: tell_her_or_dont
    objective: "Tell Maris what you have paid, or let the morning be a morning."
    # Answered on a card, not by the narrator (v0.25.0 §4.1, T14 follow-up):
    # the morning firing's Q1 `tell_her` and `say_nothing` beats write these
    # flags as they lock The Named Wound. Offered to the model, either flag
    # completed this stage and the quest with no lock, over prose that said
    # the story had ended. `days_in_stage: 2` still closes the stage.
    complete_when:
      any:
        - flag: nf_lastquiet_told_her
        - flag: nf_lastquiet_said_nothing
        - days_in_stage: 2
    complete_text: >-
      "I know," she says, either way, and goes on shaping. One turn and a press.
      One turn and a press.
    on_complete:
      effects:
        # Progress is pushback too: a smaller earned reprieve (R-06).
        - type: doom_resistance
          delta: 8
        - type: ledger_fact
          text: "You worked the morning firing with Maris after everything."
          subject_id: npc_maris
          kind: event

on_complete:
  effects:
    # R-06: seeing this through is pushing back. Earned reprieve slows the
    # doom clock and decays daily -- engine/game/evil_ticker.py.
    - type: doom_resistance
      delta: 25
    - type: reputation
      faction: edgewood
      delta: 15
    - type: flag
      flag: quest_the_last_quiet_thing_done
    - type: ledger_fact
      text: "Whatever else is true, Edgewood had bread that morning."
      kind: event
    # No lock here (v0.25.0 §4.1): the morning firing's Q1 locks The Named
    # Wound by name (the header's THE LAST DOOR).

complete_text: >-
  Edgewood has bread. The road is still coming. Both of those go on being true,
  and the bread is the one you had a hand in.
