# Version: v0.1.1 [2026-10-30]
#
# Pins NOBODY (v0.25.0 T10). It used to pin Ilya home on its start and unpin
# him when it ended, completed or failed; but `npc_pin_npc_ilya` is one flag,
# and `the_ninth_pin` pins him home through ITS whole quest (spec §6.6), which
# is the only thing that holds him at the caravan after the 0.50 doom move
# sends him to the square. A ward-charms ending inside the pin's quest unpinned
# him there, so the pin's deck could never deal `T2_pay_for_it` and The Pin and
# the Join was unreachable (the doors harness: 0 of 40 pinner runs). This
# quest's stages ask only for the caravan, never for Ilya in it, and his
# routine has him there all but three afternoon hours.

id: ward_charms
arc: whisper
name: "Nine Pins, Nine Prices"
summary: >-
  Ilya of the Nine Pins is selling ward charms this season. He was not selling
  them last season, and he will not say what changed.

preconditions:
  all:
    - min_awareness: 20
    - any:
        - event_seen: tinker_camp
        - visited: tinker_caravan

start_text: >-
  Pinned out on felt in rows: brass, bone, a wound copper thread. Twenty-five
  coppers each, which is a week of bread.

stages:
  - id: examine
    objective: "Look closely at what Ilya is actually selling."
    narrative_flags:
      - nf_charm_examined
    complete_when:
      all:
        - at_location: tinker_caravan
        - flag: nf_charm_examined
    complete_text: >-
      Sympathy work, competent, and under the competence a second binding you do
      not recognise doing something the first one is not asking for.
    on_complete:
      effects:
        # Progress is pushback too: a smaller earned reprieve (R-06).
        - type: doom_resistance
          delta: 4
        - type: awareness
          delta: 5

  - id: ask_why_now
    objective: "Ask Ilya why he started carrying wards this season."
    narrative_flags:
      - nf_charm_asked_why
    expires_after_days: 4
    complete_when:
      all:
        - at_location: tinker_caravan
        - flag: nf_charm_asked_why
    complete_text: >-
      "Because people started buying them," he says, "which is not the same
      question you asked, and I am answering the one I can afford to."
    on_complete:
      effects:
        # Progress is pushback too: a smaller earned reprieve (R-06).
        - type: doom_resistance
          delta: 4
        - type: ledger_fact
          text: "Ilya began carrying ward charms this season and will not say why."
          subject_id: npc_ilya
          kind: secret
    fail_text: >-
      The caravan moves on. The felt rolls up with the rows still full.

  - id: wear_one
    objective: "Buy a charm and wear it, or decide you would rather know than be safe."
    narrative_flags:
      - nf_charm_worn
    complete_when:
      any:
        - all:
            - has_item: { id: sympathy_charm, qty: 1 }
            - flag: nf_charm_worn
        - all:
            - flag: nf_charm_worn
            - days_in_stage: 2
    complete_text: >-
      It is warm. It should not be warm. Ilya watches you notice that it is
      warm and says nothing at all.
    on_complete:
      effects:
        # Progress is pushback too: a smaller earned reprieve (R-06).
        - type: doom_resistance
          delta: 4
        - type: focus
          delta: -1

on_complete:
  effects:
    # R-06: seeing this through is pushing back. Earned reprieve slows the
    # doom clock and decays daily -- engine/game/evil_ticker.py.
    - type: doom_resistance
      delta: 12
    - type: awareness
      delta: 6
    - type: reputation
      faction: tinkers
      delta: 8
    - type: flag
      flag: quest_ward_charms_done
    - type: ledger_fact
      text: "Ilya's ward charms carry a second binding underneath the sympathy work."
      subject_id: npc_ilya
      kind: secret

complete_text: >-
  Tinkers sell what sells. What sells this year is protection, and the tinkers
  knew before anybody told the villages.
