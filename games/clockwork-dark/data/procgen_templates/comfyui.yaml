# ComfyUI prompt templates — append style_suffix to all prompts

style_suffix: >-
  oil-painted fantasy illustration, grounded realism, muted earth palette,
  soft atmospheric lighting, detailed textures, frontier village aesthetic,
  no modern elements, no text, no watermark

negative_prompt: >-
  cartoon, anime, neon, sci-fi, cyberpunk, modern clothing, cars, guns,
  text, watermark, logo, blurry, low quality, oversaturated, heroic pose,
  glowing magic effects, floating UI

corruption_suffix: >-
  subtle brass clockwork motifs in organic matter, sick green undertone,
  uncanny wrongness, melancholy dread

time_variants:
  - dawn
  - noon
  - dusk
  - night

locations:
  forest_clearing:
    dawn: misty birch forest clearing, distant village smoke, mushrooms, ferns
    noon: sun-dappled birch clearing, worn path toward village smoke
    dusk: blue hour forest edge, long shadows, distant hearth glow
  edgewood_square:
    dawn: quiet frontier village square, timber houses, communal stone oven, mist
    noon: busy village square, chickens, timber frames, market stalls
    dusk: village square at evening, lantern light, communal oven smoke
  edgewood_bakery:
    dawn: small bakery interior, brick oven warming, flour sacks, warm light
    night: empty bakery at night, embers in oven, flour dust in moonlight
  tinker_caravan:
    dusk: colorful tinker tent, brass charms, maps, wagon wheels at sunset
  millhaven_gate:
    dawn: wooden palisade gate, militia banners, mud road, cold morning

cutscenes:
  cutscene_stirring_phase:
    placeholder: cutscene_stirring_phase.mp4
    captions:
      - "The village clock stopped at a hour that never was."
      - "Crows gather on the mill roof, perfectly still."
  cutscene_assistant_reveal:
    placeholder: cutscene_assistant_reveal.mp4
    captions:
      - "Cat eyes reflect a map of the Heartlands."
  cutscene_consuming_horizon:
    placeholder: cutscene_consuming_horizon.mp4
    captions:
      - "Wheat rows tick like a metronome toward the horizon."

# ------------------------------------------------------------
# d20 faces.
#
# MIRROR, not a second source. The authoritative spec is
# data/art/subjects.yaml's `dice_faces` block, which engine/media/art.py
# renders into BOTH dialects (prose for Grok Imagine, tags for SDXL). These
# strings are the tag dialect, minus `style_suffix` -- build_image_prompt
# appends that itself -- so that this file, which is the one ComfyUI's own
# client reads, has the dice prompts in the shape it expects.
#
# NOT WIRED: engine/media/comfyui.py::build_image_prompt only looks in
# `locations:` above. Reading this block is a two-line change in an
# engine-owned file. Until then it is documentation for a human driving a
# workflow by hand, which is what generating with ComfyUI on this machine
# means anyway -- it is not installed.
#
# Pair every one of these with `negative_prompt` above. Do NOT add
# `corruption_suffix`: the dice are interface furniture and do not rot with
# the world. Square, 1024x1024.
# ------------------------------------------------------------
dice:
  shared_detail: >-
    a heavy ivory-white icosahedron of old bone with chipped rounded edges and
    hairline cracks running through it, the uppermost triangular facet cut
    deep with its numeral and darkened with old ink, the surrounding facets
    carrying their own smaller drilled marks; the engraved numeral is part of
    the die itself, not lettering laid over the picture, the die alone and
    centred, filling most of a square frame, standing on dark scarred slate
    with nothing else in shot, one low warm lamp from the upper left, thick
    oil impasto on the lit facets, the ground falling away to near-black in
    the corners

  # Per face: append `shared_detail`, then `style_suffix`.
  faces:
    1: "A single aged bone twenty-sided die, the numeral 1 uppermost and square to the viewer"
    2: "A single aged bone twenty-sided die, the numeral 2 uppermost and square to the viewer"
