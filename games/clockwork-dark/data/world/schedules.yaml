# Trader, tinker, and militia schedule probabilities
#
# THE LEGACY RATES, MEASURED BEFORE v0.25.0's CONVERSION (T1, rule 10):
#   scripts/simulate.py --policy all --turns 200 --seed 42 --seeds 40 --event-rates --json
# Starts per ELIGIBLE in-game day (no instance carried from an earlier day, and
# the event's own gate), summed over seeds 42-81:
#
#   | Policy   | Caravan starts / eligible (per day) | Tinker (per day)   | Press (per day)       | First caravan (median day) |
#   | baker    | 567 / 735  (0.7714)                 | 6 / 1439 (0.0042)  | none eligible         | 5 |
#   | cautious | 475 / 617  (0.7699)                 | 6 / 1222 (0.0049)  | 199 / 1109 (0.1794)   | 5 |
#   | hero     | 362 / 422  (0.8578)                 | 6 / 918  (0.0065)  | 146 / 659  (0.2215)   | 5 |
#   | pauper   | 526 / 653  (0.8055)                 | 6 / 1313 (0.0046)  | none eligible         | 5 |
#   | reckless | 709 / 1112 (0.6376)                 | 6 / 1958 (0.0031)  | 225 / 1888 (0.1192)   | 5 |
#   | mean     | 0.768                               | 0.00465            | 0.173                 |   |
#
# (The mean is over the policies with an eligible day: the baker and the
# pauper never reach awareness 20, so they measured no press rate.)
# Spec §6.1's DERIVED rates, for comparison: caravan 0.71-0.90, press
# 0.12-0.22, tinker 0.0025-0.0048 per day. The policies differ only because
# their turns cut a day into different numbers of background ticks, each of
# which rolled the legacy slots below.

caravan_arrival:
  min_day: 5
  # 0.08 expected Odran around day 17, which was fine when the world took
  # eighty days to fall and is a third of the whole story now that it takes
  # about forty (R-06 retune). The Whisper arc counts its wait from this
  # arrival, so the trader is the story's opening bell: expected ~day 7 now.
  probability_per_day: 0.25
  duration_days: 2
  npc_id: npc_odran
  location_id: edgewood_square
  goods:
    - road_map
    - whetstone

tinker_camp:
  probability_per_week: 0.05
  duration_days: 3
  npc_id: npc_ilya
  location_id: tinker_caravan
  goods:
    - sympathy_charm
    - tinker_map

militia_press:
  min_awareness: 20
  probability_per_day: 0.03
  duration_days: 1
  npc_id: npc_sera
  location_id: edgewood_square

rumors:
  - "Odran swears the road to Millhaven took an extra hour though the sun said otherwise."
  - "A stillborn lamb was found with brass filings where its teeth should be."
  - "Maris burned a batch of bread that rang like a bell when it cracked."
  - "Tinkers are buying old clock parts at twice their weight in copper."
  - "The militia recruitment board has fresh nails — someone expects volunteers."
  - "Wheat near the corruption border stands in rows too straight for wind."
  - "Children in the square drew gears in the dirt; by morning the drawings were gone."