# Forest Margin Encounters
# ========================
#
# The clearing, the game trails, the treeline where Edgewood stops pretending
# the woods belong to it. Tone: the horror is that ordinary work continues.
# Most of these are not monsters. A boy who has lost a goat, a snare line that
# is not yours, rain that falls warm. The clockwork is held back for
# `spreading` and `consuming`, because a thing you see every trip is scenery.
#
# See data/encounters/rules.yaml for the numbers and the scene shape.

band: forest

encounters:
  - id: lost_child_at_the_treeline
    tier: 1
    weight: 30
    triggers:
      edges: ["forest_clearing>edgewood_square", "edgewood_square>forest_clearing"]
      phases: [dormant, stirring]
    intro: >-
      A boy of about nine stands where the ferns give out, holding a length of
      rope with nothing on the end of it. He has been crying and has stopped,
      which is worse.
    threat: { name: "A boy and a missing goat", resolve: 3 }
    approaches:
      talk:
        skill: persuasion
        difficulty: easy
        text: "Get the story out of him"
      track:
        skill: survival
        difficulty: standard
        text: "Read the ground for the goat"
      feed:
        skill: craft
        difficulty: easy
        requires_item: loaf
        text: "Break out bread and sit with him a while"
    outcomes:
      crit_success:
        text: >-
          You find the goat in a ditch with a foreleg wedged and no worse. The
          boy walks it home telling everyone who will listen what you did.
        effects:
          - { type: reputation, faction: edgewood, delta: 4 }
          - { type: stamina, delta: -5 }
      success:
        text: >-
          The goat is three hundred paces off, sulking. The boy takes it back
          without a word, which from a boy of nine is a debt acknowledged.
        effects:
          - { type: reputation, faction: edgewood, delta: 2 }
          - { type: stamina, delta: -5 }
      partial:
        text: >-
          You walk him back to the village empty-handed. His mother thanks you
          for the boy and does not thank you for the goat.
        effects:
          - { type: reputation, faction: edgewood, delta: 1 }
          - { type: stamina, delta: -10 }
      failure:
        text: >-
          You lose an hour in the fern and come back with nothing. The rope is
          still in his hands when you leave, and you think about it later.
        effects:
          - { type: stamina, delta: -12 }
          - { type: awareness, delta: 1 }

  - id: deadfall_across_the_trail
    tier: 1
    weight: 25
    triggers:
      edges: ["forest_clearing>edgewood_square", "edgewood_square>forest_clearing"]
    intro: >-
      A birch has come down across the trail, green wood and no wind to blame
      for it. The break is high and splintered outward.
    threat: { name: "A tree in the way", resolve: 3 }
    approaches:
      clear:
        skill: craft
        difficulty: standard
        text: "Lever it aside properly"
      around:
        skill: survival
        difficulty: easy
        text: "Go around through the fern"
      look:
        skill: lore
        difficulty: hard
        text: "Look at how it broke"
    outcomes:
      crit_success:
        text: >-
          You clear the trail and stack the good wood off the path where
          somebody from Edgewood will find it. Small courtesies travel.
        effects:
          - { type: reputation, faction: edgewood, delta: 1 }
          - { type: stamina, delta: -5 }
      success:
        text: "You get past. It takes longer than it should have."
        effects:
          - { type: stamina, delta: -8 }
      partial:
        text: >-
          You get past filthy and scratched, and you are still thinking about
          the splinters pointing outward.
        effects:
          - { type: stamina, delta: -14 }
          - { type: awareness, delta: 1 }
      failure:
        text: >-
          The trunk rolls when you are under it. Nothing breaks. Your ribs will
          argue about that for a few days.
        effects:
          - type: wound
            text: "a boot-sole of bruise across the ribs"
            severity: 2
            check_penalty: -2
            skills: [craft, nerve, survival]
            heals_on_day: "+3"
          - { type: stamina, delta: -15 }

  - id: the_dog_that_follows
    tier: 1
    weight: 22
    triggers:
      edges: ["forest_clearing>edgewood_square", "edgewood_square>forest_clearing"]
      min_day: 2
    intro: >-
      A thin brown dog joins you at the second bend. It does not beg and does
      not leave. When you stop, it stops, facing the way you came.
    threat: { name: "A dog with an opinion", resolve: 3 }
    approaches:
      feed:
        skill: craft
        difficulty: trivial
        requires_item: loaf
        text: "Share what you are carrying"
      talk:
        skill: sympathy
        difficulty: standard
        text: "Sit down at its level and be patient"
      shoo:
        skill: nerve
        difficulty: easy
        text: "Send it home"
    outcomes:
      crit_success:
        text: >-
          It walks you the whole way in and peels off at the first houses like
          it had an appointment. Twice more this season you will see it working
          the treeline, and twice more it will look at you first.
        effects:
          - { type: flag, flag: dog_knows_you, value: true }
          - { type: reputation, faction: edgewood, delta: 1 }
      success:
        text: "It walks you in, then turns back at the field wall without ceremony."
        effects:
          - { type: flag, flag: dog_knows_you, value: true }
      partial:
        text: >-
          It keeps its distance and keeps facing the way you came. You spend
          the walk looking over your shoulder at whatever it is looking at.
        effects:
          - { type: awareness, delta: 1 }
      failure:
        text: >-
          It bolts at nothing you can see, and you jump harder than the dog
          did. You arrive with your heart still going.
        effects:
          - { type: stamina, delta: -8 }
          - { type: awareness, delta: 2 }

  - id: mushroom_ring_at_dusk
    tier: 1
    weight: 18
    triggers:
      edges: ["forest_clearing>edgewood_square", "edgewood_square>forest_clearing"]
      hours: [17, 18, 19, 20, 21, 22]
    intro: >-
      A ring of pale caps has come up in the leaf litter, close enough to the
      trail that you cannot pretend not to have seen it. It was not here this
      morning.
    threat: { name: "A ring in the leaf litter", resolve: 3 }
    approaches:
      gather:
        skill: survival
        difficulty: standard
        text: "Pick the good ones and leave the rest"
      read:
        skill: lore
        difficulty: standard
        text: "Work out what made it come up here"
      leave_offering:
        cost_gold: 1
        auto: true
        text: "Leave a coin in the middle and walk on"
    outcomes:
      crit_success:
        text: >-
          A full double handful, clean and firm, and Maris pays for these.
          You leave the ring itself unbroken, which costs you nothing.
        effects:
          - { type: item, item_id: wild_mushroom, name: "Wild mushroom", qty: 3, tags: [food, forage] }
      success:
        text: "Two good caps. You step over the ring rather than through it."
        effects:
          - { type: item, item_id: wild_mushroom, name: "Wild mushroom", qty: 2, tags: [food, forage] }
      partial:
        text: >-
          One cap, and a long minute spent counting the others and getting a
          different number each time.
        effects:
          - { type: item, item_id: wild_mushroom, name: "Wild mushroom", qty: 1, tags: [food, forage] }
          - { type: awareness, delta: 1 }
      failure:
        text: >-
          You come out of the fern on the wrong side of the trail with a
          handful of nothing and no clear account of the last quarter hour.
        effects:
          - { type: stamina, delta: -10 }
          - { type: awareness, delta: 2 }

  - id: snare_line_not_yours
    tier: 1
    weight: 20
    triggers:
      edges: ["forest_clearing>edgewood_square", "edgewood_square>forest_clearing"]
      min_day: 2
    intro: >-
      Wire, set well, running off into the birch at ankle height. Four snares
      you can see. One of them has a hare in it, and the hare is fresh.
    threat: { name: "Somebody else's wire", resolve: 3 }
    approaches:
      take:
        skill: stealth
        difficulty: standard
        text: "Take the hare and reset the wire behind you"
      reset:
        skill: craft
        difficulty: easy
        text: "Free the hare and leave the line alone"
      trace:
        skill: survival
        difficulty: hard
        text: "Follow the line to whoever set it"
    outcomes:
      crit_success:
        text: >-
          Clean work, wire reset the way you found it. Whoever walks this line
          tomorrow will read nothing at all.
        effects:
          - { type: item, item_id: dried_meat, name: "Hare, dressed", qty: 1, tags: [food] }
          - { type: hunger, delta: -5 }
      success:
        text: "You come away with meat and no story attached to it."
        effects:
          - { type: item, item_id: dried_meat, name: "Hare, dressed", qty: 1, tags: [food] }
      partial:
        text: >-
          You get the hare free but leave the line a mess. Somebody will know
          within a day that somebody was here.
        effects:
          - { type: reputation, faction: edgewood, delta: -1 }
      failure:
        text: >-
          The wire goes through the web of your hand before you understand
          what you have hold of. Poachers set for weight, not for kindness.
        effects:
          - type: wound
            text: "a wire cut across the palm"
            severity: 2
            check_penalty: -2
            skills: [craft, stealth]
            heals_on_day: "+4"
          - { type: reputation, faction: edgewood, delta: -1 }

  - id: wrong_rain
    tier: 2
    weight: 20
    triggers:
      edges: ["forest_clearing>edgewood_square", "edgewood_square>forest_clearing"]
      phases: [stirring, spreading, consuming]
    intro: >-
      Rain comes through the canopy warm as bathwater and smells faintly of
      hot metal. It beads on your sleeve without soaking in.
    threat: { name: "Rain that is not rain", resolve: 4 }
    approaches:
      shelter:
        skill: survival
        difficulty: standard
        text: "Get under cover and wait it out"
      endure:
        skill: nerve
        difficulty: hard
        text: "Put your head down and keep walking"
      study:
        skill: lore
        difficulty: hard
        text: "Catch some and look at it properly"
    outcomes:
      crit_success:
        text: >-
          You sit it out under a leaning slab and watch the beads roll off the
          moss without wetting it. Twenty minutes, then ordinary rain, then
          nothing. You have learned the shape of the thing.
        effects:
          - { type: focus, delta: 1 }
          - { type: awareness, delta: 2 }
      success:
        text: "You wait. It passes. Your sleeve stays dry and stays warm."
        effects:
          - { type: awareness, delta: 2 }
      partial:
        text: >-
          You walk through it. For an hour afterwards everything you touch
          feels very slightly greased.
        effects:
          - { type: awareness, delta: 3 }
          - { type: stamina, delta: -8 }
      failure:
        text: >-
          You breathe some of it. The taste stays at the back of your throat
          for two days and your hands will not stop wanting to be washed.
        effects:
          - type: check_penalty
            text: "the taste of hot metal"
            delta: -2
            skills: [craft, sympathy, lore]
            days: 2
          - { type: awareness, delta: 4 }

  - id: wolf_at_the_margin
    tier: 2
    weight: 16
    art: wolf
    triggers:
      edges: ["forest_clearing>edgewood_square", "edgewood_square>forest_clearing"]
      hours: [18, 19, 20, 21, 22, 23, 0, 1, 2, 3, 4, 5]
      min_day: 3
    intro: >-
      It is standing in the trail with its head low, and it is thin in a way
      that has nothing to do with the season. It does not circle. It waits.
    threat: { name: "A wolf out of season", resolve: 6 }
    approaches:
      hold:
        skill: nerve
        difficulty: hard
        text: "Stand tall, hold its eye, do not run"
      fire:
        skill: craft
        difficulty: standard
        requires_item: candle
        text: "Get a light going between you"
      slip:
        skill: stealth
        difficulty: hard
        text: "Give ground sideways into the fern"
      feed:
        skill: survival
        difficulty: standard
        requires_item: dried_meat
        text: "Throw it meat and back off while it eats"
    outcomes:
      crit_success:
        text: >-
          It decides you are not worth it, turns, and is gone in three strides.
          You are shaking, and you were right about every single thing you did.
        effects:
          - { type: focus, delta: 1 }
      success:
        text: "It gives way. You walk the rest with your back very straight."
        effects:
          - { type: stamina, delta: -10 }
      partial:
        text: >-
          It follows you to the field wall at forty paces, matching your pace
          exactly, and stops when the houses start.
        effects:
          - { type: stamina, delta: -18 }
          - { type: awareness, delta: 1 }
      failure:
        text: >-
          It comes in fast and low and is off you again before you have
          finished falling down. Your calf is open to the muscle.
        effects:
          - { type: hp, delta: -6 }
          - type: wound
            text: "a torn calf, badly closed"
            severity: 3
            check_penalty: -3
            skills: [stealth, survival]
            heals_on_day: "+6"
          - { type: stamina, delta: -20 }

  - id: the_scarecrow_that_moved
    tier: 2
    weight: 18
    art: scarecrow
    triggers:
      edges: ["forest_clearing>edgewood_square", "edgewood_square>forest_clearing"]
      phases: [stirring, spreading, consuming]
    intro: >-
      The scarecrow in the strip field is facing the woods. On the way out it
      was facing the road, and the pole has not been dug up; the soil around
      the base is unbroken.
    threat: { name: "A scarecrow with a new heading", resolve: 4 }
    approaches:
      inspect:
        skill: lore
        difficulty: standard
        text: "Walk out and look at the base of the pole"
      pass:
        skill: nerve
        difficulty: standard
        text: "Note it, keep walking, do not look back"
      turn_back:
        skill: craft
        difficulty: hard
        text: "Turn it to face the road again"
    outcomes:
      crit_success:
        text: >-
          Unbroken soil, and a groove worn a finger deep around the pole, and
          the groove is old. This has been happening for longer than the
          village has been noticing.
        effects:
          - { type: awareness, delta: 3 }
          - { type: focus, delta: 1 }
          - type: ledger_fact
            kind: engine
            text: "The strip-field scarecrow turns on its own pole, and the wear is years old."
      success:
        text: >-
          Unbroken soil. You stand there a while working out what that means
          and decide to work it out somewhere else.
        effects:
          - { type: awareness, delta: 3 }
      partial:
        text: >-
          You keep walking. Twice you nearly look back and the second time you
          do, and it is exactly where it was, which does not help.
        effects:
          - { type: awareness, delta: 2 }
          - { type: stamina, delta: -8 }
      failure:
        text: >-
          You get close enough to see the stitching on the sack head and the
          stitching is fresh, and something in you gives out. You are most of
          the way to the road before you remember starting to run.
        effects:
          - type: check_penalty
            text: "a bad night coming"
            delta: -2
            skills: [nerve, sympathy]
            days: 1
          - { type: awareness, delta: 4 }
          - { type: stamina, delta: -15 }

  - id: brass_in_the_birch
    tier: 3
    weight: 14
    art: clockwork_thing
    triggers:
      edges: ["forest_clearing>edgewood_square", "edgewood_square>forest_clearing"]
      phases: [spreading, consuming]
    intro: >-
      Something is working in the birch stand off the trail: a steady tick,
      the sound of a mill running well, and no mill within four hours' walk.
      Through the trunks there is a shine that is not wet.
    threat: { name: "The thing in the birch stand", resolve: 6 }
    approaches:
      watch:
        skill: stealth
        difficulty: hard
        text: "Get low and watch it work"
      name_it:
        skill: lore
        difficulty: severe
        text: "Recognise what you are looking at"
      hold:
        skill: nerve
        difficulty: severe
        text: "Stand in the open and let it see you"
    outcomes:
      crit_success:
        text: >-
          You watch it for a full minute. It is threshing. There is nothing to
          thresh in a birch stand and it is threshing anyway, patient as a
          hired man, and you get out with all of that in your head.
        effects:
          - { type: awareness, delta: 5 }
          - { type: focus, delta: 1 }
          - type: ledger_fact
            kind: engine
            text: "A brass thing was threshing empty air in the birch stand, and doing it well."
      success:
        text: >-
          Enough. Brass, jointed, waist-high, and busy. You leave before it
          finishes whatever it is finishing.
        effects:
          - { type: awareness, delta: 5 }
      partial:
        text: >-
          You get most of the way past before the ticking changes rhythm. It
          does not follow. It only changes rhythm.
        effects:
          - { type: awareness, delta: 6 }
          - { type: stamina, delta: -15 }
          - type: check_penalty
            text: "the tick you can still hear"
            delta: -2
            skills: [nerve, lore]
            days: 2
      failure:
        text: >-
          It turns to face you all at once, without the intervening motions,
          and something goes out of you that does not come straight back.
        effects:
          - { type: hp, delta: -5 }
          - { type: focus, delta: -2 }
          - { type: awareness, delta: 8 }
          - type: wound
            text: "a burn in the shape of a handprint"
            severity: 3
            check_penalty: -2
            skills: [craft, sympathy, nerve]
            heals_on_day: "+7"
