# ============================================================
# Shipped art manifest
#
# Maps game ids to the curated art pack in
# content/scenes/clockwork/static/art/, which ships WITH the game.
#
# This is the top of the image resolution chain, and it is the reason the
# chain exists in this order:
#
#   1. shipped     this file. Instant, free, authored, always correct.
#   2. cache       anything generated in an earlier session.
#   3. live        Grok Imagine or ComfyUI. OFF by default.
#   4. procedural  deterministic SVG. Never fails, never pretty.
#
# Generating art on demand was the wrong default: a Grok Imagine still takes
# two to three minutes, which is unusable in a real-time loop. The art is
# already drawn; use it.
#
# `alts` are picked deterministically per (subject, time_of_day) so a location
# is not identical on every visit while still being stable for a given seed.
#
# v0.25.0 T15 (spec §9): 47 plates generated on the owner's Forge Neo (Qwen
# Image 2.1, engine/media/providers/forge.py) with
# `scripts/generate_art.py --game clockwork-dark --story-plan --provider forge`
# and promoted by `--promote`: twelve places' own bases, eight `night` times,
# six `corrupted` plates, seven portraits, six enemies and eight ending plates.
# Each place's stand-in base was moved into its `alts` by hand first, so no
# shipped file is deleted; fix round 1 then kept in `alts` only what pictures
# that place (the list sits above `charcoal_burn` below).
#
# Version: v0.2.0 [2026-08-07]
# ============================================================

version: 1
root: "/static/art"

# ------------------------------------------------------------
# Locations. `times` overrides the base still for a daypart.
# ------------------------------------------------------------
