  # Ring-2+ places the forest procgen already generates but that had no art.
  deeper_forest:
    base: scenes/forest-hidden-tunnel.jpg
    alts: [tunnels/Tunnel-Entrance-Far.jpg]
  old_barrows:
    base: ruins/Mage-Ruins-Far.jpg
    alts: [ruins/Mage-Ruins-Closer.jpg, ruins/mage-ruins-altar.jpg]
  herb_glen:
    base: things/herbs.jpg
  the_forge:
    base: forge/forge.jpg
    alts: [forge/blacksmith-interior-anvil.jpg]
  tunnel_entrance:
    base: tunnels/tunnel-entrance-close.jpg
    alts: [tunnels/tunnel-entrance-2-entries.jpg, tunnels/tunnels-stairs.jpg]

  # ------------------------------------------------------------
  # P9 ring expansion (data/world/locations.yaml). No new art was drawn for
  # these; each one reuses the closest shipped still. A wrong-but-plausible
  # photograph of a place reads better than a procedural silhouette, and the
  # alternative was leaving ten new locations with no image at all.
  # ------------------------------------------------------------
  charcoal_burn:
    base: scenes/tinker-camping.jpg
    alts: [scenes/resting-camp.jpg]

  edgewood_shrine:
    base: ruins/Village-Altar.jpg
    alts: [ruins/mage-ruins-altar.jpg]

  well_row:
