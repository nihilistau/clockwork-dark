  # talisman. Every id below now has its own plate, generated from the
  # `items:` prompts in data/art/subjects.yaml through the Grok Imagine
  # provider and promoted into the pack by
  # `scripts/generate_art.py --items && scripts/generate_art.py --promote`.
  #
  # The `<item_id>.jpg` names are that promotion step's output and are meant to
  # stay boring. The irregular hand-authored names below them are the original
  # pack files as they arrived; they are mapped rather than renamed, because
  # this map IS the indirection.
  #
  # Generated plates carry a small Grok watermark in the bottom-right corner.
  # `media.crop_watermark` in config/default.yaml trims it and is off by
  # default; that file is not this pass's to change.
