    alts: [scenes/noticeboard.jpg]

  fallow_farm:
    base: scenes/wheatfield-forest-edge.jpg
    alts: [scenes/wheatfields-scarecrow.jpg]
    corrupted:
      - scenes/clockwork-wheatfield.jpg
      - scenes/wheatfield-drawing-warning.jpg

  millhaven_market:
    base: scenes/town-scene.jpg
    alts: [scenes/noticeboard-cutscene.jpg]
    corrupted: [scenes/clockwork-tower.jpg]

  millhaven_barracks:
    base: scenes/closing-town-gates.jpg
    alts: [signposts/notice-board-tunnel-revealed.jpg]

  toll_bridge:
