  # ------------------------------------------------------------
  # P9 ring expansion (data/world/locations.yaml). These borrowed the closest
  # shipped still until v0.25.0 T15 drew each its own base.
  #
  # An alt pictures THAT place and nothing else (v0.25.0 T15 fix round 1):
  # `lookup` draws a place's picture from [base, *alts] per daypart, so a
  # borrowed still in `alts` is served as the place. The stand-ins the new
  # bases replaced, and every alt that pictured another place, an item or a
  # notice board, were taken out of `alts`; each file stays on disk:
  #   scenes/town-scene.jpg (the square's base; was well_row's and the market's),
  #   scenes/noticeboard.jpg (the square's alt; was well_row's),
  #   scenes/noticeboard-cutscene.jpg (a notice board; was the market's),
  #   scenes/wheatfield-forest-edge.jpg (the clearing's base; was fallow_farm's),
  #   scenes/closing-town-gates.jpg (the gate's base; was the barracks' and the toll bridge's),
  #   signposts/notice-board-tunnel-revealed.jpg (was the barracks'),
  #   signposts/notice-board-contract-tunnels.jpg (ui.notice_board; was the toll bridge's),
  #   things/herbs.jpg (the `herbs` item; was the herb glen's),
  #   things/steaming-bread.jpg (the festival cake's item; was the bakery's),
  #   scenes/tinker-camping.jpg (the caravan's alt; was the charcoal burn's),
  #   scenes/resting-camp.jpg (ui.resting, a sleeper in the woods; was the charcoal burn's
#     and the refugee camp's),
  #   scenes/player-hurt-resting.jpg (ui.hurt; was the refugee camp's),
  #   ruins/Hollow-Hill-Far.jpg and ruins/Altar-Hollow-Hill-maybe.jpg (a hill
  #     ruin and a woodland shrine; were the burned farmstead's),
  #   scenes/clockwork-wheatfield.jpg and scenes/clockwork-tower.jpg
  #     (corruption plates; were the heartland road's dormant alts),
  #   tunnels/Tunnel-Entrance-Far.jpg (a hill with a path; was the deeper forest's),
  #   ruins/mage-ruins-altar.jpg (the barrows' alt; was also the shrine's).
  # tests/test_story_art.py::test_every_flagship_place_is_pictured_only_as_itself holds it.
  # ------------------------------------------------------------
  charcoal_burn:
    base: scenes/charcoal-burn.jpg

  edgewood_shrine:
    base: ruins/Village-Altar.jpg
    times:
      night: scenes/edgewood-shrine-night.jpg
    corrupted:
    - scenes/edgewood-shrine-corrupted.jpg

