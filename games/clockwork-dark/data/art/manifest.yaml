# ------------------------------------------------------------
# The d20, face by face.
#
# `ui.dice_roll` was the whole of the dice art: ONE generic plate for every
# roll in the game, so a natural 20 and a natural 1 were the same picture. The
# pack held fourteen numbered plates that nothing could address, and 6, 8, 11,
# 16 and 18 did not exist at all -- five faces in twenty that could never be
# shown whatever the engine rolled. The missing five were generated from
# data/art/subjects.yaml's `dice_faces` block; see scripts/generate_dice_art.py.
#
# The irregular names (-small, -d20-) are the shipped files as they arrived.
# They are mapped rather than renamed: this map is the indirection, and a
# rename would break nothing usefully while invalidating anyone's checkout.
#
# `dice_plates` are the authored source paintings, ~1024-1408px and 350-800 KB
# each. `dice_faces` below is what the interface actually loads: 256px squares
# derived from them by `scripts/generate_dice_art.py --thumbs`, with the
# provider watermark cropped off the bottom. A roll shows a 96px die; making
# the player download 700 KB for it -- 12 MB across the set -- to paint 9,216
# pixels is not a trade worth making.
# ------------------------------------------------------------
dice_plates:
  1:  dice/dice-1-face.jpg
  2:  dice/dice-2.jpg
  3:  dice/dice-3-face.jpg
  4:  dice/dice-4-face.jpg
  5:  dice/dice-5-face.jpg
  6:  dice/dice-6.jpg
  7:  dice/dice-7-face.jpg
  8:  dice/dice-8.jpg
  9:  dice/dice-9-face.jpg
  10: dice/dice-10.jpg
  11: dice/dice-11.jpg
  12: dice/dice-12.jpg
  13: dice/dice-13.jpg
  14: dice/dice-14-face.jpg
  15: dice/dice-15-face.jpg
  16: dice/dice-16.jpg
  17: dice/dice-17-face.jpg
  18: dice/dice-18.jpg
  19: dice/dice-19-face.jpg
  # dice-d20-10.jpg and dice-d20-13.jpg are byte-identical duplicates of
  # dice-10 and dice-13; dice-d20-20.jpg is the only plate for a natural 20.
  20: dice/dice-20-face.jpg

# The twenty faces the interface loads, one per possible roll. Derived, not
# authored: rebuild with `python scripts/generate_dice_art.py --thumbs`.
#
# NOT WIRED server-side: engine/media/providers/shipped.py::lookup has no
# `kind == "dice"` branch, and the `dice_result` socket payload carries no
# image url, so the client resolves these paths itself in
# ui/src/parts/DiceToast.jsx -- from this same table, held in step by
# tests/test_dice_art.py. Wiring the server side is a lookup branch in a file
# this pass does not own.
dice_faces:
  1:  dice/faces/face-01.jpg
  2:  dice/faces/face-02.jpg
  3:  dice/faces/face-03.jpg
  4:  dice/faces/face-04.jpg
  5:  dice/faces/face-05.jpg
  6:  dice/faces/face-06.jpg
  7:  dice/faces/face-07.jpg
  8:  dice/faces/face-08.jpg
  9:  dice/faces/face-09.jpg
  10: dice/faces/face-10.jpg
  11: dice/faces/face-11.jpg
  12: dice/faces/face-12.jpg
  13: dice/faces/face-13.jpg
  14: dice/faces/face-14.jpg
  15: dice/faces/face-15.jpg
  16: dice/faces/face-16.jpg
  17: dice/faces/face-17.jpg
  18: dice/faces/face-18.jpg
  19: dice/faces/face-19.jpg
  20: dice/faces/face-20.jpg

