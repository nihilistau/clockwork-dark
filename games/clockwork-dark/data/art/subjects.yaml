# ============================================================
# Art subjects — ONE source, TWO prompt dialects.
#
# The two image backends want opposite things:
#
#   Grok Imagine  natural prose, 2-5 sentences, positive description only,
#                 no negative prompts (per ~/.grok/skills/imagine/SKILL.md)
#   ComfyUI SDXL  comma-separated keyword tags plus an explicit negative
#                 prompt and LoRA hints
#
# Writing each subject twice guarantees they drift. Everything here is stored
# once as structured fields, and engine/media/art.py renders whichever dialect
# the active provider needs.
#
# v0.3.0 adds `items:`. 52 of the 81 declared items had no picture and no
# prompt -- they rendered as the procedural wash and there was no way to
# generate anything better, for either backend, because nobody had written
# down what a bent iron nail is supposed to look like. All 81 are described
# below, including the 29 the shipped pack already answers, so that a full
# regeneration is possible rather than a patch.
#
# Version: v0.3.0 [2026-08-08]
# ============================================================

style:
  # Shared art direction, from Design_files/assets/comfyui-prompts.md.
  prose: >-
    Oil-painted fantasy illustration with grounded realism, a muted earth
    palette, soft atmospheric light and heavy texture. Frontier village
    aesthetic, nothing modern, no text or lettering anywhere in the frame.
  tags: >-
    oil-painted fantasy illustration, grounded realism, muted earth palette,
    soft atmospheric lighting, detailed textures, frontier village aesthetic,
    no modern elements, no text, no watermark
  negative: >-
    cartoon, anime, neon, sci-fi, cyberpunk, modern clothing, cars, guns, text,
    watermark, logo, blurry, low quality, oversaturated, heroic pose,
    glowing magic effects, floating UI
  loras:
    - {name: Oil_Painting_Style, weight: 0.6}
    - {name: Medieval_Environment, weight: 0.4}

# Applied only at SPREADING and beyond. The corruption is a pattern converting
# living order into ticking mechanism -- it should read as wrongness, not as
# monsters.
corruption:
  prose: >-
    Faint brass clockwork motifs have grown into the organic matter, and a sick
    green undertone runs beneath everything. The scene feels uncanny and
    quietly wrong.
  tags: >-
    subtle brass clockwork motifs in organic matter, sick green undertone,
    uncanny wrongness, melancholy dread

# Aspect and size per workflow kind.
formats:
  location: {aspect: "16:9", width: 1344, height: 768}
  portrait: {aspect: "3:4", width: 768, height: 1024}
  item: {aspect: "1:1", width: 256, height: 256}
  cutscene: {aspect: "16:9", width: 512, height: 288}
  # The shipped dice plates are square, ~1408px. `format_for` reads this by
  # kind, so `render_*(..., kind="dice")` gets 1:1 without any code change.
  dice: {aspect: "1:1", width: 1024, height: 1024}

# ------------------------------------------------------------
# Dice faces — the twenty plates of the d20 the engine actually rolls.
#
# The art pack shipped fourteen of them (1-5, 7, 9, 10, 12-15, 17, 19) plus a
# 20, and nobody wrote down what they were generated from. 6, 8, 11, 16 and 18
# did not exist at all, so five faces in twenty could never be shown. All
# twenty are specified here so the set can be regenerated or extended without
# guessing at the house style a second time.
#
# ONE spec, TWO dialects, as everything else in this file:
#   render_prose(f"dice_face_{n}", kind="dice")  -> Grok Imagine (default)
#   render_tags (f"dice_face_{n}", kind="dice")  -> ComfyUI SDXL + negative
# `formats.dice` above gives both of them the 1:1 the plates are drawn at.
#
# The one place these fight the shared house style is `no text or lettering
# anywhere in the frame`: a numbered die is nothing but an engraved numeral.
# The `details` below settle it explicitly -- the numeral is cut INTO the
# object, it is not lettering laid over the picture -- which is the wording
# that actually produced the shipped-looking faces on Imagine.
#
# `times` carries a single `dawn` slot on purpose. `_location_fields` falls
# back to `dawn` for any daypart it has no entry for, so one slot covers all
# four: a die on a table does not have a time of day.
# ------------------------------------------------------------
_dice_plate: &dice_plate
  details: >-
    a heavy ivory-white icosahedron of old bone with chipped rounded edges and
    hairline cracks running through it, the uppermost triangular facet cut deep
    with its numeral and darkened with old ink, the surrounding facets carrying
    their own smaller drilled marks; the engraved numeral is part of the die
    itself, not lettering laid over the picture
  times:
    dawn:
      setting: >-
        the die alone and centred, filling most of a square frame, standing on
        dark scarred slate with nothing else in shot
      light: >-
        one low warm lamp from the upper left, thick oil impasto on the lit
        facets, the ground falling away to near-black in the corners

dice_faces: &dice_faces
  dice_face_1:
    <<: *dice_plate
    subject: "A single aged bone twenty-sided die, the numeral 1 uppermost and square to the viewer"
