# The Clockwork Dark -- the flagship game.
#
# Every path below used to be duplicated in config/default.yaml, and that
# duplication was the bug: it made one story's content the ENGINE's answer, so
# any story omitting a key read this one's files. The engine's defaults are
# empty now and this manifest is the single place the flagship's content is
# named. The seam landed in two steps: first the manifest took over WITHOUT
# moving a file (the compatibility bar for the merge itself), then the content
# moved from the repo root's data/ into games/clockwork-dark/data/ so both
# shipped stories use the same layout.
#
# WHAT THIS MANIFEST DELIBERATELY DOES NOT DECLARE, as of engine v0.2.0:
#
#   settings:      a bounded allowlist of engine settings a story may set --
#                  the world clock rate, the reveal thresholds, the governance
#                  chain, cutscene pacing. See SETTING_ALLOWLIST in
#                  engine/games/manifest.py, which lists every legal key with
#                  the reason it is safe. This game declares none, because its
#                  numbers ARE the engine defaults in config/default.yaml and
#                  writing them twice would give them two homes.
#
#   save_summary:  which declared state values appear on the load menu. Absent
#                  means the engine's own row, which is the row this game's
#                  index.json has always had. A story with no doom clock and no
#                  archetypes names its own columns here instead.
#
#   safety:        this story's content ceiling and its own boundary sheet.
#                  See docs/SAFETY.md and engine/safety/. Absent, deliberately:
#                  a frontier village and a brass horror is written at the
#                  engine's default tier (`suggestive`), it declares no limits
#                  of its own, and the settings it would write are already
#                  config/default.yaml's -- the same argument as `settings:`
#                  above, that a number with two homes is a number that will
#                  disagree with itself.
#
#                  The consequence, which is the compatibility bar for the
#                  safety layer exactly as a no-op merge was for the manifest:
#                  this game's policy is INERT, so every safety surface
#                  short-circuits to allow, the GM prompt gains no directive
#                  text and no token, and no RNG stream is drawn. This story
#                  plays byte-for-byte as it did before engine/safety existed.
#                  tests/test_safety_shipped_games.py asserts it.
#
#                  A story that DID want limits would write, at top level:
#
#                      safety:
#                        intensity: { max: explicit, default: suggestive }
#                        boundaries:
#                          hard_nos: [{ topic: ..., nouns: [...] }]
#                          soft_nos: [{ topic: ..., nouns: [...], substitute: ... }]
#                        redirects:
#                          - { id: ..., tags: [...], beat: ..., line: ... }
#
#                  It goes at TOP LEVEL rather than under `settings:` on
#                  purpose: the manifest keeps unknown top-level keys verbatim
#                  in `extras` (this is how drowned-carillon carries
#                  `phase_names:`), so a story's content rating never becomes a
#                  config value that a stale config/local.yaml could move.
#
# Version: v0.2.0 [2026-08-08]

id: clockwork-dark
title: "The Clockwork Dark"
version: "0.2.0"
engine_requires: ">=0.2.0"

blurb: >-
  A frontier village at the edge of a forest, and something patient and brass
  working its way outward from the Wound. Become a hero or become a baker --
  the evil ticks either way.

# Which scene serves this story, declared rather than inherited.
#
# These are exactly the engine's defaults (engine/scenes/spec.py) -- the
# default scene USED to be this story's own package, and in v0.3.0 it moved
# into the engine because every story ran on it. A shipped story's scene
# should be readable from its manifest, not known only by omission, so the
# flagship says out loud what it runs. tests/test_scene_seam.py pins the
# declared values to the engine defaults; drifting off them is a decision
# made there, on purpose.
#
# `name` keys the `scene.clockwork.*` block in config/default.yaml, which is
# where the port and bind host live -- machine concerns stay in config.
scene:
  name: clockwork
  module: engine.scenes.default_scene
  blueprint: "engine.scenes.default_api:story_blueprint"

# Which client plugin draws this story. The value is what an omitted block
# would have resolved to anyway -- the server falls back to the slug -- but
# the fallback exists for scratch stories, not shipped ones: a story the repo
# ships says which skin it wears rather than relying on its directory being
# named after one.
ui:
  plugin: clockwork-dark

# EVERY PATH THIS STORY READS, INCLUDING THE ONES IT USED TO INHERIT.
#
# config/default.yaml carried this list until v0.2.2 -- which meant the engine's
# defaults were one story's content, and any story omitting a key silently read
# Edgewood's. The defaults are empty now, so this block is the only thing
# pointing at the flagship's files.
#
# The content lives under games/clockwork-dark/data/, the same layout every
# other story uses. It sat at the repo root's data/ until v0.2.2 as a
# compatibility measure while the manifest seam landed; once no engine or
# tooling code named the root location, keeping the flagship's files in a
# privileged spot only preserved the illusion that they were the engine's.
#
# `saves` is the exception and points at the repo root on purpose: saves are a
# runtime OUTPUT the engine owns (data/saves/<slug>/ is gitignored), not story
# content, and every story shares that default.
paths:
  saves: "data/saves"
  lore: "games/clockwork-dark/data/lore"
  lore_db: "games/clockwork-dark/data/lore/lore.db"
  economy: "games/clockwork-dark/data/economy.yaml"
  procgen_templates: "games/clockwork-dark/data/procgen_templates/edgewood.yaml"
  world_schedules: "games/clockwork-dark/data/world/schedules.yaml"
  npc_schedules: "games/clockwork-dark/data/world/npc_schedules.yaml"
  factions: "games/clockwork-dark/data/world/factions.yaml"
  world_rumors: "games/clockwork-dark/data/world/rumors.yaml"
  comfyui_templates: "games/clockwork-dark/data/procgen_templates/comfyui.yaml"
  art_subjects: "games/clockwork-dark/data/art/subjects.yaml"
  art_manifest: "games/clockwork-dark/data/art/manifest.yaml"
  # The directory every path in `art_manifest` resolves against. This story
  # relied on the engine default for it, and the engine default WAS this
  # directory -- the flagship's own static tree, which is exactly why no engine
  # may default it. Declared here now; the value is unchanged.
  art_root: "content/scenes/clockwork/static/art"
  rules: "games/clockwork-dark/data/rules"
  tables: "games/clockwork-dark/data/tables"
  quests: "games/clockwork-dark/data/quests"
  locations: "games/clockwork-dark/data/world/locations.yaml"
  assistant_hints: "games/clockwork-dark/data/assistant/hints.yaml"
  items: "games/clockwork-dark/data/items"
  recipes: "games/clockwork-dark/data/recipes"
  encounters: "games/clockwork-dark/data/encounters"
  doom_effects: "games/clockwork-dark/data/rules/doom_effects.yaml"
  challenges: "games/clockwork-dark/data/challenges"
  # The finale chain. Three doors carry the lock -- the quiet-life door
  # (banking_the_fire), the sacrifice, and the last quiet thing -- and every
  # locked ending resolves to a card in data/epilogues/. See the header of
  # data/rules/endings.yaml for the shape.
  endings: "games/clockwork-dark/data/rules/endings.yaml"
  epilogues: "games/clockwork-dark/data/epilogues"

entry:
  # CLAUDE.md pins this id as canon. Do not rename it.
  location_id: forest_clearing
  archetypes: [wayfarer, hearthkeeper, tinker_apprentice]

  # What a turn says when the model is unreachable. This exact sentence lived
  # in engine/agents/storyteller.py as every story's outage line; it is the
  # flagship's forest, so it belongs to the flagship.
  fallback_narration: >-
    The forest holds its breath. Smoke drifts from a distant chimney.

  # The first frame of a new run. Declared here rather than written into
  # content/scenes/clockwork/clockwork_state.py, where it used to be two module
  # constants -- and where, because that scene is the one every story runs on
  # until it ships its own, a second story's player woke beneath Edgewood's
  # birch trees.
  opening:
    narration: >-
      You wake beneath birch trees at the forest's edge. Mist clings to the
      ferns; somewhere ahead, hearth smoke threads the grey.
    # An opening choice that MOVES, SPENDS or RISKS anything declares its
    # `intent`, and the engine resolves it before the second beat is written.
    #
    # THIS IS THE BUG REPORT. A player picked (a), the model narrated them
    # walking into the village, and the save afterwards read `turn 1 |
    # forest_clearing | 10.0h | stamina 100`. The narration and the world had
    # nothing to do with each other, because a choice was only ever a sentence
    # handed to a narrator. See engine/game/intents.py.
    #
    # (b) and (c) declare none on purpose: searching and listening are what the
    # narrator is for, and an intent that resolves nothing would be noise.
    choices:
      - id: a
        text: "Follow the smoke toward Edgewood"
        intent: { action: travel, target: edgewood_square }
      - { id: b, text: "Search the clearing for supplies" }
      - { id: c, text: "Listen — something watches without moving" }
