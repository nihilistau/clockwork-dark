# Dev Story -- epilogue index.
#
# Read by engine/game/epilogue.py through `paths.epilogues`. The filename is
# FIXED (`epilogue_index.yaml`, engine/game/epilogue.py::INDEX_FILE) because
# something has to be findable without already having been read. The prose file
# is not fixed -- this index names it in `prose_source`, so the cards can be
# split per ending later without an engine change.
#
# Structure lives here; finished prose lives in the cards file. They change for
# different reasons, which is why they are two files.
#
# One row per ending declared in data/rules/endings.yaml. Three ids, and they
# must match that file exactly: `epilogue.for_state` logs at ERROR and shows the
# player nothing if a locked ending has no row here.
#
# ---------------------------------------------------------------------------
# THE TIME LINE: DAYS ON CAMPUS, NOT A TEN-DAY TOLL
# ---------------------------------------------------------------------------
# The template supports `{garden_days}`, `{mortal_days}` and the `_word`
# pluralisation variants. Those are ENGINE placeholder names, not this story's
# nouns -- `garden_days` is `state.world_day` whatever the story is about.
#
# `{mortal_days}` is deliberately NOT used. It reads the declared value
# `time_debt_mortal_days` (epilogue.py::TIME_DEBT_VALUE), which this story does
# not declare in state.yaml, so it would substitute a confident, permanent 0.
# A sentence that always says "0 days passed" is worse than no sentence.
#
# Omitting the template entirely is also legal and the engine tolerates it --
# `time_line()` returns "" and a renderer draws nothing. It is here because a
# bench should be able to see the substitution happen.
# ---------------------------------------------------------------------------
#
# Version: v0.1.0 [2026-08-11]

version: 1
prose_source: epilogue_cards.yaml

time_line_template: >-
  That was {garden_days} {garden_days_word} of term, start to finish.

render_order: [title, card_m, card_g, echoes, time_line, gallery_unlock]

# ---------------------------------------------------------------------------
# The clause appended to EVERY card, on every ending. Threshold 0 is not a
# placeholder: this story declares no `time_debt_mortal_days`, so the value
# reads 0, and 0 >= 0 holds -- so the clause always fires. That is deliberate.
# It is in this file to be SEEN working; delete the two keys and every card
# loses its last line, which is the fastest way to prove the mechanism is live.
#
# Raise the threshold above 0 and it can never fire again in this story, because
# nothing here can make that value non-zero.
# ---------------------------------------------------------------------------
hollow_clause_if_time_debt_gte: 0
hollow_clause_text: >-
  Terms do not come back. Whatever this one was, it is the one you had.

endings:

  - id: top_of_the_class
    class: top_of_the_class
    title: "The One They Asked"
    # THE GALLERY KEY IS NOT THE ENDING ID. A finale unlocks art by this key, so
    # two endings can share one plate and an ending can be renamed without
    # orphaning its picture.
    gallery_key: hall_noticeboard
    echo_speaker: [sophia]
    ng_plus_seed: known_quantity

  - id: everyones_friend
    class: everyones_friend
    title: "Everyone Said Yes"
    gallery_key: quad_group_photo
    echo_speaker: [chloe]
    ng_plus_seed: null

  - id: just_another_term
    class: just_another_term
    title: "Just Another Term"
    gallery_key: empty_locker
    # NO ECHO. Nobody had a last word about it, which is the ending.
    echo_speaker: []
    ng_plus_seed: null
