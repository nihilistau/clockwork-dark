# HUE & CRY -- the manifest.
#
# Tallowmere, a candle-making port lit by the Everflame. You come off the
# morning barge and a Lantern of the Watch takes one look at you and shouts
# "the Magpie!" -- the city's famous thief, who only ever steals things that
# shine. You are not the Magpie. Nobody is interested in that.
#
# The design is docs/superpowers/specs/2026-09-23-hue-and-cry-design.md §6;
# what has shipped of it, release by release, is this story's CHANGELOG.md.
# It began (v0.9) as a skeleton -- eleven districts, the fourteen people who
# keep hours in them, a two-agent turn (the city and Pip), one reachable
# ending -- and the engine's Law, premises, jobs and agendas were each proven
# against it as it grew. Since v0.16 it has acts: the opening below is Act I's
# first beat, and its three choices are real.
#
# Scaffolded from the `graph` template, then cut back. THE ONE RULE THAT SHAPES
# THIS FILE: an UNDECLARED `paths.*` key resolves to NOTHING. Declare what you
# ship; omit what you do not.
#
# Version: v0.9.0 [2026-09-26]

id: hue-and-cry
title: "Hue & Cry"
version: "0.1.0"
engine_requires: ">=0.2.0"

blurb: >-
  Tallowmere burns candles for the whole coast and keeps a holy fire on the
  hill. You came for honest work. The Watch has decided you are the Magpie,
  the thieves' guild has decided the same, and a one-eyed jackdaw has decided
  you are his.

# The engine's own skin. HUE & CRY's bespoke plugin (wax and parchment, a
# wanted poster as chrome) is v1.0 work; until then `_engine` is the honest
# answer -- borrowing the flagship's would lend Edgewood's voice along with its
# spacing (docs/AUTHORING.md §2.5).
ui:
  plugin: _engine

scene:
  name: clockwork
  module: engine.scenes.default_scene
  blueprint: "engine.scenes.default_api:story_blueprint"

settings:
  world:
    # A city runs whether or not you are watching it. Same gentle rate as the
    # graph template until a harness exists that can measure this story.
    tick_hours: 1.0
    tick_max_hours: 4.0
    # No doom clock. Its phases are the flagship's canon; in Tallowmere the job
    # of "the world is getting worse without you" belongs to the agendas
    # (v0.12): the Magpie, Captain Ardane's net and Silas Crook's rise.
    evil_base_rate_per_day: 0.0

  governance:
    directives:
      - StorytellerMind

# DECLARED: the map, the people, the voices, the rules, one quest, one ending,
# and -- since v0.9 -- the houses (premises), the pockets (thievery), the
# goods both hold (items), and the two fences who buy them (tables, economy).
#
# And since v0.10 the Lantern Watch: the law file, the one encounter it opens
# (a Lantern's stop) and one thread (Brask's bribe). Since v0.11, jobs: a
# burglary walked stage by stage, and Mother Gannet's first contract. Since
# v0.12, agendas: the Magpie, the captain and Silas, each on a hidden clock
# (state.yaml, clocks.yaml).
#
# Since v0.16, decks: Mother Gannet's initiation, the Watch's
# interrogation and the Lantern House front desk (see `decks` below). Since
# v0.17, the calendar: the Hanging Fair (`world_schedules`), with its own two
# decks, the fair and the gallows.
#
# DELIBERATELY NOT DECLARED YET, each one a later release's job rather than an
# omission: the other threads (the rest of the Company's contracts),
# world_rumors. (Night-street
# encounters and lore arrived in v0.14; recipes -- the Porters' Hall bench --
# in v0.15, see below.)
# (Factions: one, the Honest Company, since v0.11 -- see below.) The graph
# template's stubs for items, economy, tables and encounters were removed
# rather than left in place: they were a mill and a hedge-berry forage table,
# and a thief story selling hedge berries is exactly the veneer THE LONG CON
# shipped under. The tables directory held trade.yaml alone until v0.14, when
# forage.yaml joined it -- scrounging a city's gutters, not a wood (candle
# ends, dropped bread, the odd lost button), on streets tagged `scrounge`. No
# labour, boons or complications until v0.14 either; now labour.yaml (honest
# work: Dock Mag's gangs, the chandlers' vats, the market's errands, Wren's
# lamps) and boons.yaml / complications.yaml (the city's luck on a natural 20
# or 1) sit beside them.
#
paths:
  locations: "games/hue-and-cry/data/world/locations.yaml"
  npc_schedules: "games/hue-and-cry/data/world/npc_schedules.yaml"
  # Since v0.17: the city's calendar -- one declared event, the Hanging Fair
  # (days 10-12 on Gallows Green), which forces the fair deck and opens Act
  # III. The file's header says why day 10 and what hangs off it.
  world_schedules: "games/hue-and-cry/data/world/schedules.yaml"
  prompts: "games/hue-and-cry/prompts"
  # skills.yaml, archetypes.yaml, spoilers.yaml and (since v0.14) survival.yaml
  # are found INSIDE this directory by fixed filename. survival.yaml is the
  # rest verb -- the flophouse, the guild bunk, the taverns, the cells and a
  # rough night anywhere -- and the meals; shipping it also makes a walk cost
  # stamina, which it did not while nothing could give stamina back.
  rules: "games/hue-and-cry/data/rules"
  quests: "games/hue-and-cry/data/quests"
  endings: "games/hue-and-cry/data/rules/endings.yaml"
  epilogues: "games/hue-and-cry/data/epilogues"
  # The houses inside each district: districts.yaml, names.yaml, types/,
  # anchors/ (engine/world/premises.py).
  premises: "games/hue-and-cry/data/premises"
  # Whose pockets and what is in them; how long stolen goods stay hot.
  thievery: "games/hue-and-cry/data/rules/thievery.yaml"
  # Loot and purse goods. Every id a premise or a purse names lives here.
  items: "games/hue-and-cry/data/items"
  # The two fences' profiles (trade.yaml) and their counter stock; since v0.14
  # also forage.yaml, scrounging the five streets tagged `scrounge`, and
  # labour.yaml, boons.yaml and complications.yaml -- honest work at the hours
  # its employers keep, and the city's luck. Their numbers were set by
  # measurement: scripts/simulate_labour.py, table in labour.yaml's header.
  # Since v0.15, collections.yaml: the Magpie's Hoard, six famous shines kept
  # in the anchors and found in two secret places (quests/the_magpies_hoard/).
  tables: "games/hue-and-cry/data/tables"
  # The margin only (v0.14): forage ground for those streets, and the hidden
  # paths that are three of the secret places' ways in -- each pinned to the
  # street it starts from (`hidden_path_placements`). No villagers, buildings
  # or festival: the city's people are its schedule, its houses premises.
  procgen_templates: "games/hue-and-cry/data/procgen_templates/tallowmere.yaml"
  economy: "games/hue-and-cry/data/economy.yaml"
  # Since v0.15: the Porters' Hall bench in the Snuffs -- lockpicks, smoke
  # pellets, a lamplighter's coat and a forged Hill pass, made from what the
  # fences sell and the gutters drop (the `craft` verb, offered only there
  # and only with the makings in hand). One file on purpose: the verb re-reads
  # this directory every turn. Costs measured in workshop.yaml's header.
  recipes: "games/hue-and-cry/data/recipes"
  # The pack is empty until v1.0; subjects.yaml is the full brief for it, and
  # art_root is declared so the manifest resolves against this story's own
  # tree rather than another's.
  # The Lantern Watch (v0.10): jurisdictions, deeds, wanted bands, guises and
  # the arrest (engine/world/law.py). Its numbers were set by measurement --
  # scripts/simulate_law.py, table in CHANGELOG.md.
  law: "games/hue-and-cry/data/rules/law.yaml"
  # One scene, the Lantern's stop, which only the Law's patrol opens: every
  # edge is danger_dc 0, so no road ever draws it.
  encounters: "games/hue-and-cry/data/encounters"
  # Two contracts: Sergeant Brask's price for losing your file, and Mother
  # Gannet's first job for the Honest Company.
  threads: "games/hue-and-cry/data/rules/threads.yaml"
  # Decks (v0.16): three. `initiation` -- the Honest Company takes you in,
  # dealt once in the Snuffs while Mother Gannet holds court (18:00-04:00)
  # and the thief is free and not yet sworn. Its oath sets `guild_initiated`, which opens Act
  # II, the guild bunk and Gannet's contract (the file's header).
  # `interrogation` -- the small room in the Lantern House, dealt on the
  # first turn of EVERY stay in the cells (`in_custody: true`, repeatable):
  # Captain Ardane, Sergeant Brask or the duty desk, by the hour. It moves
  # the file, never the sentence (the file's header). `lantern_house_desk`
  # -- the reveal and the alibi, dealt when the thief walks into the
  # Lantern House FREE with something to show (repeatable): the duty book's
  # alibi, and the accusation that names the Magpie to Captain Ardane.
  # Since v0.17, two more: `fair_day` -- the Hanging Fair on Gallows Green,
  # forced by the fair and dealt once, free, on the Green (the Showing of the
  # Flame, and the Everflame's heart on the palace steps) -- and
  # `the_gallows`, dealt in the cell from nine on the fair's last morning to
  # a thief held since before it began: The Rope's hanging door.
  decks: "games/hue-and-cry/data/scenes"
  # Jobs (v0.11): a burglary walked stage by stage, what every house's
  # security does to it, the burglar's tools, flashbacks, and the Treasury's
  # vault floor (engine/world/jobs.py). Its numbers were set by measurement --
  # scripts/simulate_jobs.py, table in CHANGELOG.md and in the file's header.
  jobs: "games/hue-and-cry/data/rules/jobs.yaml"
  # Since v0.17: the jailbreak -- two set-pieces in the Lantern House cells,
  # offered only while held (`requires: {in_custody: true}`): the third way
  # out beside the fine and the wait, and on the Hanging Fair's last morning
  # the only one past the gallows for a thief who cannot pay. Success is a
  # `release` and a fresh `escape` on file; failure is a hiding (hp). The
  # file's header has the rest.
  challenges: "games/hue-and-cry/data/challenges"
  # Seven factions since v0.14 (engine/game/reputation.py); the file's
  # header says what moves each and which wait for Acts I-III.
  factions: "games/hue-and-cry/data/world/factions.yaml"
  # Since v0.14: the city's memory for the narrator (engine/lore/manager.py,
  # SQLite FTS5). The markdown is the source; lore.db is gitignored, like
  # every story's, and built by `CLOCKWORK_GAME=hue-and-cry python
  # scripts/seed_lore.py`. `gm_secrets` sections (the hidden city, the flame's heart,
  # the Company's split) reach the narrator, never Pip. Nothing in it names
  # the real Magpie.
  lore: "games/hue-and-cry/data/lore"
  lore_db: "games/hue-and-cry/data/lore/lore.db"
  # Agendas (v0.12): the Magpie (one of three people, chosen by the seed),
  # Captain Ardane's net and Silas Crook's rise -- what the city does while
  # you are not looking (engine/world/agendas.py). Each winds a hidden clock
  # declared in state.yaml, with its label and beats in clocks.yaml. Numbers
  # set by measurement -- scripts/simulate_agendas.py, table in CHANGELOG.md.
  agendas: "games/hue-and-cry/data/rules/agendas.yaml"
  clocks: "games/hue-and-cry/data/rules/clocks.yaml"
  art_subjects: "games/hue-and-cry/data/art/subjects.yaml"
  art_manifest: "games/hue-and-cry/data/art/manifest.yaml"
  art_root: "games/hue-and-cry/data/art/plates"
  saves: "data/saves"

entry:
  location_id: tallow_docks

  # Three ways to be mistaken for a thief. Ids in data/rules/archetypes.yaml.
  archetypes: [cutpurse, silver_tongue, bruiser]

  fallback_narration: >-
    Somewhere up the quay a bell counts the hour, loses its place, and starts
    again. Tallowmere waits, with its usual patience, for you to do something.

  opening:
    # A new run starts at 08:00 on day one. Brask, Dock Mag and Lantern Tully
    # (npc_lantern_1) are all scheduled on the docks at that hour -- an opening
    # that names somebody the schedule puts elsewhere is the bug NEON CITY
    # shipped and fixed after a live playthrough.
    narration: >-
      The morning barge noses into Tallow Docks through a fog that smells of
      mutton fat and bayberry, and the whole quay is candles: crates of them,
      carts of them, a chandler's boy asleep on a pallet of beeswax tapers
      with his mouth open. High on the hill the Everflame burns in the
      Margrave's palace, pale in the daylight, which is the only time anyone
      here says it looks small. You step onto the boards with everything you
      own in one bag. A jackdaw you did not bring lands on your shoulder, looks
      at the brass button on your coat with its one good eye, and settles in
      like a lodger. Across the quay, a young Lantern of the Watch lowers his
      lamp, goes the colour of tallow, and fills his lungs. "THE MAGPIE!" he
      bellows, pointing at you with his whole arm. "Stop -- it's the MAGPIE!"
      Every head on the docks turns. The sergeant behind him puts down his
      pastry.
    # ALL THREE RISK OR MOVE, AND ALL THREE ARE REAL (v0.16). Each declares
    # its mechanic as an `intent` where one verb says it, and what an intent
    # cannot say as AUTHORED consequences (engine/game/authored_choice.py,
    # docs/AUTHORING.md): a `deed` committed through the Law as for any
    # crime, and an `on_pass`/`on_fail` branch -- a line for the narrator,
    # bounded effects, a scene to open. A narrated choice can carry none of
    # this: it is read from this file, and only on this frame.
    #
    # (a) RUN. A `stealth` check, `standard` because the quay is full of
    # people to hide behind and so is the Watch -- and, pass or fail, the
    # deed `resisting_watch` (law.yaml, severity 3, measured there): Brask and
    # Tully are both on the quay at eight, and a Lantern who sees you bolt
    # files it on the Quay in your own face. Slip away and you are free, with
    # a face the Quay has `noticed` until the next morning; fail and the
    # Lantern's stop,
    # `watch_stop`, begins on the spot -- run again (easy), talk, bribe,
    # surrender or fight, the same five ways out as any stop.
    # (b) TALK. `persuasion`, `hard`, because he has already said it out
    # loud. Talk him down and nothing is written; fail and he writes the
    # Magpie into his book anyway -- a `pickpocket` report against `magpie`
    # on the Quay at 0.3, a third-hand blur -- and the sergeant waves you on.
    # (c) COME QUIETLY. No roll and no walk: an arrest (`arrest`, which only
    # an authored choice may carry), on the charge the Lantern files as he
    # takes you -- the same blurred `pickpocket` -- so the Lantern House holds
    # you for a fine of three crowns or a day's sentence, and custody ends as
    # all custody does (pay_fine / serve; the cells have a bunk, rule 6).
    # Like every arrest it deals the interrogation (data/scenes/
    # interrogation.yaml) on this same turn: at eight, Captain Ardane asks
    # the questions, and the fine is offered again once the cards are
    # answered.
    # Every arrest learns the cell drain, so this one does too.
    #
    # All three leave the player free to walk to the Snuffs within four
    # actions, not counting the interrogation's two cards after an arrest
    # (tests/test_hue_and_cry.py): there by 10:00-11:00 on day one,
    # except a fumbled run answered by surrender, which serves its three days
    # and arrives on day four. The Honest Company receives newcomers after
    # dark: the initiation deck (data/scenes/initiation.yaml) is dealt on the
    # first turn in the Snuffs from 18:00, while Mother Gannet holds court --
    # so that evening, for most arrivals. Until then her contract and the
    # guild bunk say so, in the story's words.
    choices:
      - id: a
        text: "Duck the lamp and lose yourself in the crowd"
        intent: { action: check, target: stealth, difficulty: standard }
        deed: resisting_watch
        on_pass:
          text: >-
            You are behind a cart of tallow, then behind a knot of porters,
            then simply somewhere else. The whistle shrills three berths away,
            at nobody, and the jackdaw on your shoulder has not so much as
            ruffled.
        on_fail:
          text: >-
            You make it four steps. The fifth is into a porter's crate of
            candles, and the young Lantern is on you while they are still
            rolling, lamp up, breathing hard, very pleased with himself.
          encounter: watch_stop
      - id: b
        text: "Raise your empty hands and explain, calmly, that he is wrong"
        intent: { action: check, target: persuasion, difficulty: hard }
        on_pass:
          text: >-
            Something in it lands: the barge you came off, the one bag, the
            plain unlikeliness of the city's famous thief stopping to argue.
            The sergeant takes the young Lantern by the elbow and steers him
            off to apologise to a bollard. Nothing is written down.
        on_fail:
          text: >-
            He has a drawing, and the drawing has a nose, and so do you. The
            sergeant waves you on -- there is no charge in a nose -- but the
            young Lantern writes it in his little book first, licking the
            pencil: the Magpie, seen on the quay, working the crowd off the
            barge.
          effects:
            - { type: report, deed: pickpocket, guise: magpie, jurisdiction: quay, precision: 0.3 }
      - id: c
        text: "Hold out your wrists and go quietly"
        on_pass:
          text: >-
            You hold out your wrists. The young Lantern blinks -- nobody ever
            does that -- and the sergeant sighs, pockets his pastry and walks
            you up to the Lantern House himself, where the charge is written
            as the Magpie, seen working the crowd on the quay, and the cell
            door is heavier than it looks.
          effects:
            - { type: report, deed: pickpocket, guise: magpie, jurisdiction: quay, precision: 0.3 }
            - { type: arrest }
            - { type: flag, flag: "location_known:the_undercroft", value: true }
