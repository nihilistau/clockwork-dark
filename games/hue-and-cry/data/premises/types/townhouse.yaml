# HUE & CRY -- premise type: townhouse.
#
# Read by engine/world/premises.py. Schema, once, for every file in types/:
#
#   label          what the casing board and the narrator call it (REQUIRED)
#   name_patterns  {surname} {given} {street} {trade} {n} from names.yaml
#   tiers          tier -> weight. A tier-N house draws N security features
#                  and N loot rows, so every tier needs N eligible features.
#   household      roles with routines. Hours a routine does not list are
#                  spent AT HOME; `@home` is this house, `@work` one of
#                  `work_at`, drawn once per person. These are real schedule
#                  rows: a maid at market is in Wickmarket's crowd, can be
#                  talked to, and can have her purse lifted.
#   security       {id, text, tier_min}. `text` is what a watch learns, word
#                  for word, so write what you would see from across the street.
#   loot           tier -> [{item_id, weight}], ids from data/items/.
#   secrets        [{id, text}]; one per house. Casing only learns that one
#                  EXISTS -- the text is what going in finds.
#
# THE EMPTY WINDOW. Occupancy is the first thing a watch learns, and it is the
# whole game of a townhouse: the master is at business all day, the mistress
# pays calls along Silk Row after dinner, and the maid goes to market -- so for
# three hours in the afternoon nobody is home. That window is designed, not
# emergent; move one routine an hour and it closes.
#
# Version: v0.1.0 [2026-09-23]

id: townhouse
label: "townhouse"

name_patterns:
  - "the {surname} house"
  - "Number {n}, {street}"
  - "the tall house on {street}"
  - "the {surname} townhouse"

tiers: {1: 5, 2: 4, 3: 1}

work_at: [tallow_docks, wickmarket, chandlers_rise]

household:
  - role: merchant
    routine:
      - { hours: [7, 8], location: "@home", activity: "at breakfast behind a newspaper, reading the tallow prices aloud to nobody" }
      - { hours: [9, 10, 11, 12, 13, 14, 15, 16, 17], location: "@work", activity: "about the day's business with a ledger under one arm and a pencil behind one ear, stopping to argue the price of everything" }
      - { hours: [18, 19, 20, 21, 22], location: "@home", activity: "at supper and then at the fire, boots off and the good candles lit" }
      - { hours: [23, 0, 1, 2, 3, 4, 5, 6], location: "@home", activity: "asleep upstairs in a nightcap", available: false }

  - role: householder
    routine:
      - { hours: [7, 8, 9, 10, 11, 12], location: "@home", activity: "running the house from the morning room, a list in one hand and the keys in the other" }
      - { hours: [13, 14, 15, 16], location: silk_row, activity: "paying afternoon calls along Silk Row, taking tea in other people's parlours and an inventory of their furniture" }
      - { hours: [17, 18, 19, 20, 21, 22], location: "@home", activity: "at home, doing the real household accounts, the ones the merchant never sees" }
      - { hours: [23, 0, 1, 2, 3, 4, 5, 6], location: "@home", activity: "asleep, a candle-snuffer on the nightstand in case of burglars", available: false }

  - role: maid
    routine:
      - { hours: [5, 6, 7, 8, 9, 10, 11, 12], location: "@home", activity: "blacking the grate, trimming twenty wicks and scrubbing the step" }
      - { hours: [13, 14, 15], location: wickmarket, activity: "at the market with a basket and a list, haggling over tallow ends and catching up on everybody's business" }
      - { hours: [16, 17, 18, 19, 20, 21], location: "@home", activity: "in the kitchen with the supper, and one ear on the back door" }
      - { hours: [22, 23, 0, 1, 2, 3, 4], location: "@home", activity: "asleep in the attic under a sloping ceiling", available: false }

security:
  - { id: good_lock, text: "a good lock on the street door, newer and better than the door it is in", tier_min: 1 }
  - { id: barred_coal_hole, text: "a barred coal-hole, where the coal-hole on every other house is an open invitation", tier_min: 1 }
  - { id: rattling_shutters, text: "shutters that rattle on their pins at the lightest touch", tier_min: 1 }
  - { id: door_bell, text: "a shop-bell hung inside the back door on a spring, as a precaution against exactly you", tier_min: 1 }
  - { id: hall_lamp, text: "a lamp left burning in the hall all night, so the street can see straight in", tier_min: 2 }
  - { id: yard_dog, text: "a yard dog with a bark like a dropped cutlery drawer", tier_min: 2 }
  - { id: bolted_upstairs, text: "the upstairs rooms bolted from the inside every night, every one", tier_min: 2 }
  - { id: plate_cupboard, text: "the silver in a locked plate cupboard, and the mistress wears the key on a ribbon", tier_min: 3 }

loot:
  1:
    - { item_id: pewter_candlesticks, weight: 4 }
    - { item_id: beeswax_tapers, weight: 3 }
    - { item_id: brass_snuffer, weight: 3 }
    - { item_id: silver_thimble, weight: 2 }
  2:
    - { item_id: silver_spoons, weight: 4 }
    - { item_id: silver_snuffbox, weight: 3 }
    - { item_id: pewter_candlesticks, weight: 2 }
    - { item_id: portrait_miniature, weight: 1 }
  3:
    - { item_id: gilt_candelabrum, weight: 3 }
    - { item_id: pearl_earrings, weight: 2 }
    - { item_id: gold_pocket_watch, weight: 2 }
    - { item_id: silver_spoons, weight: 2 }

secrets:
  - { id: second_household, text: "the master of the house keeps a second household in the Snuffs -- a wife, three children and a canary -- on the housekeeping money" }
  - { id: paste_silver, text: "the family silver on the sideboard is plated; the real set was pawned at Hollis's Sundries last winter, and the ticket is in the tea caddy" }
  - { id: bought_crest, text: "the family crest over the fireplace was bought from a sign-painter in Wickmarket, and the receipt was never burned" }
  - { id: sergeants_letters, text: "a bundle of letters from a Lantern of the Watch, tied with a ribbon and kept in a hatbox, none of them to the master" }
  - { id: smuggled_lace, text: "the linen press has a false back full of southern lace that never saw the customs house" }
  - { id: the_real_will, text: "the late grandmother's will, the real one, leaving everything to her cat" }
