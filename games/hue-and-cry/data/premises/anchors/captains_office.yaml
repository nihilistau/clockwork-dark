# HUE & CRY -- anchor: the Captain's Office, the Lantern House.
#
# Schema in anchors/vessaline_manor.yaml.
#
# Captain Ardane (npc_ardane) is scheduled, not household: she works the tall
# desk out front in the morning and her office in the evening, and sleeps in
# the room over it. Her duty clerk IS household, and sleeps on a cot in the
# outer office -- so the office is occupied every hour but the two when the
# clerk carries the reports up to the Hill. The captain is on the Hill for
# exactly those two hours herself, reporting to the steward. Nobody planned
# that. Somebody will notice.
#
# The clerk's role is `clerk`, never `watch`: the Law release counts the Watch
# by role, and a generated clerk must not be mistaken for a Lantern.
#
# Version: v0.1.2 [2026-09-26]

id: captains_office
label: "watch office"
district: lantern_house
name: "the Captain's Office"
tier: 3
# Who it belongs to (v0.12): what an agenda's `premise {owner}` and
# `premise_robbed {owner}` read. The captain's own office, and her confiscations.
owner: npc_ardane

household:
  - role: clerk
    routine:
      - { hours: [6, 7, 8, 9, 10, 11, 12], location: "@home", activity: "at the clerk's desk in the Captain's Office, filing last night's reports under a lamp that is never allowed to go out" }
      - { hours: [13, 14], location: margraves_hill, activity: "on the palace steps with a satchel of Watch reports, waiting for the steward to have a moment" }
      - { hours: [15, 16, 17, 18, 19, 20, 21, 22], location: "@home", activity: "copying out wanted notices in a fair hand, the Magpie's on top of the pile with the face left blank" }
      - { hours: [23, 0, 1, 2, 3, 4, 5], location: "@home", activity: "asleep on a cot in the outer office, where the captain can shout for them", available: false }

security:
  - { id: lantern_house_itself, text: "the whole Lantern House around it, and the front desk, and whichever Lantern happens to be behind the front desk" }
  - { id: never_out_lamp, text: "the great lamp over the door, which is never allowed to go out and lights the office window from outside" }
  - { id: duty_clerk, text: "a duty clerk who sleeps on a cot across the office door and wakes if the captain so much as coughs" }

# The Lantern House Knocker (v0.15, the Magpie's Hoard) sits on the Magpie
# file as a paperweight. Worth less than the spyglass, so the casing board's
# loot hint still names the spyglass.
loot: [captains_spyglass, confiscated_shinies, silver_snuffbox, lantern_house_knocker]

secrets:
  - { id: magpie_file, text: "the captain's Magpie file, two years thick, with a map of every robbery and one pin in it that does not belong to any robbery at all", thread: ardane_magpie_file }
