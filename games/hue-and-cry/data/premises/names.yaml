# HUE & CRY -- the name pools every premise and household draws from.
#
# Read by engine/world/premises.py. A type's `name_patterns` may say
# {surname}, {given}, {street}, {trade} or {n} (a house number, drawn, not a
# pool). Households need `given` and `surname`.
#
# THE CAST IS NOT IN HERE. No Ardane, Brask, Tully, Hobb, Gannet, Crook,
# Hollis, Marrow, Quill, Vessaline, Marsh, Ember, Mag or Wren -- a generated
# clerk who shares a surname with the captain is a relation the story never
# wrote, and a narrator will write it for you.
#
# `trade` is any calling the waterfront drinks with, title-cased, because the
# taverns are named for them ("The Drowned Lampwright", "The Jolly Bargeman").
# `craft` is the narrow pool of the candle city's own workshop trades, for the
# signs that must read as one: a chandler signs "Wick-Twister", never
# "Bargeman", and the palace names a window for a craft that made its glass
# and wax. Every `craft` noun pluralises with a plain -s ("the Chandlers'
# Window"), which the palace pattern relies on; keep it that way.
#
# Adding a pool reshuffles every name a recorded seed generates
# (premises._name draws every pool); adding a NAME to a pool does too. Both
# are fine before v1.0 ships; after it, append rather than insert.
#
# Version: v0.1.0 [2026-09-23]

