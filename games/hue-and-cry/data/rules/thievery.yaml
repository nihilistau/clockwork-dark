# HUE & CRY -- whose pockets, and what is in them.
#
# Read by engine/world/thievery.py through `paths.thievery`.
#
#   alertness  role -> difficulty band a lift rolls against (bands from
#              skills.yaml). `default` is required and covers any role not
#              named -- including every household role a new premise type
#              adds before anybody remembers this file.
#   purses     role -> [{gold: [lo, hi], weight} | {item_id, weight}]. One row
#              drawn per clean lift; a PARTIAL lift draws from the gold rows
#              only and takes half. `default` is required.
#   hot_days   how long a stolen thing stays hot. `named` items stay hot for
#              good, whatever this says (data/items/goods.yaml).
#
# MONEY IS IN CROWNS (data/tables/trade.yaml). A porter's day is about three.
#
# THE SHAPE. Easy marks carry little and the rich carry much, but the rich are
# watched: a maid at market is an easy lift worth a crown, a factor at the
# Exchange club is a hard one worth a signet ring, and the captain of the
# Watch is a severe one worth a few crowns and a snuffbox -- and a lifetime
# of her attention. The two people almost impossible to rob are the head of
# the thieves' guild and the fences, who handle other people's pockets for a
# living.
#
# The roles are the ones npc_schedules.yaml and data/premises/ actually use.
# Watch roles stay exactly `captain`, `sergeant` and `watch`: the Law release
# reads them.
#
# Version: v0.1.0 [2026-09-23]

hot_days: 6

alertness:
  default: standard
  # The Watch. Brask is idle, and idleness is not the same as attention.
  captain: severe
  sergeant: easy
  watch: hard
  # The trade in stolen goods knows where its own pockets are.
  guild_head: legendary
  upstart: hard
  fence: severe
  company_keeper: hard
  porter_boss: hard
  lamplighter: hard
  # The Hill and the Row: people with staff to notice for them.
  steward: hard
  noble: standard
  master: standard
  factor: hard
  chamberlain: hard
  palace_guard: severe
  treasury_guard: severe
  mint_master: hard
  butler: severe
  # Working people with their minds on the work.
  merchant: standard
  householder: standard
  chandler: easy
  apprentice: easy
  clerk: easy
  landlord: hard
  potboy: easy
  cook: standard
  warehouseman: standard
  porter: standard
  maid: easy
  chambermaid: easy
  housekeeper: hard
  footman: standard
  # The Temple, which is used to being robbed and has made its peace with it.
  priest: standard
  novice: trivial
  sexton: easy

purses:
  default:
    - { gold: [1, 4], weight: 6 }
    - { item_id: brass_button, weight: 2 }
    - { item_id: pawn_ticket, weight: 1 }

  # -- the Watch ------------------------------------------------------------
  captain:
    - { gold: [6, 12], weight: 4 }
    - { item_id: silver_snuffbox, weight: 1 }
  sergeant:
    # Bribes, mostly. Brask's purse is the heaviest in the Lantern House.
    - { gold: [5, 14], weight: 5 }
    - { item_id: pawn_ticket, weight: 1 }
  watch:
    - { gold: [1, 3], weight: 5 }
    - { item_id: lantern_badge, weight: 2 }

  # -- the trade ------------------------------------------------------------
  guild_head:
    - { gold: [10, 25], weight: 4 }
    - { item_id: silver_snuffbox, weight: 1 }
  upstart:
    - { gold: [8, 20], weight: 4 }
    - { item_id: gold_pocket_watch, weight: 1 }
    - { item_id: silver_snuffbox, weight: 1 }
  fence:
    - { gold: [10, 30], weight: 4 }
    - { item_id: pawn_ticket, weight: 2 }
    - { item_id: pearl_earrings, weight: 1 }
  porter_boss:
    # The wage tin, or some of it.
    - { gold: [4, 12], weight: 5 }
  company_keeper:
    - { gold: [1, 4], weight: 4 }
    - { item_id: brass_button, weight: 1 }
  lamplighter:
    - { gold: [1, 3], weight: 4 }
    - { item_id: brass_snuffer, weight: 1 }

  # -- the Hill and the Row -------------------------------------------------
  steward:
    - { gold: [8, 20], weight: 3 }
    - { item_id: silver_pencil, weight: 1 }
  noble:
    - { gold: [10, 30], weight: 3 }
    - { item_id: pearl_earrings, weight: 1 }
    - { item_id: love_letter, weight: 1 }
  master:
    - { gold: [8, 24], weight: 3 }
    - { item_id: gold_pocket_watch, weight: 1 }
    - { item_id: love_letter, weight: 1 }
  factor:
    - { gold: [6, 18], weight: 3 }
    - { item_id: merchants_signet, weight: 1 }
    - { item_id: letter_of_credit, weight: 1 }
  chamberlain:
    - { gold: [4, 10], weight: 3 }
    - { item_id: silver_spoons, weight: 1 }
  palace_guard:
    - { gold: [2, 6], weight: 1 }
  treasury_guard:
    - { gold: [2, 6], weight: 1 }
  mint_master:
    - { gold: [4, 12], weight: 3 }
    - { item_id: gold_pocket_watch, weight: 1 }
  butler:
    - { gold: [3, 8], weight: 3 }
    - { item_id: silver_snuffbox, weight: 1 }

  # -- working people -------------------------------------------------------
  merchant:
    - { gold: [3, 10], weight: 4 }
    - { item_id: silver_snuffbox, weight: 1 }
    - { item_id: gold_pocket_watch, weight: 1 }
  householder:
    - { gold: [2, 8], weight: 4 }
    - { item_id: silver_thimble, weight: 1 }
    - { item_id: love_letter, weight: 1 }
  clerk:
    - { gold: [1, 4], weight: 4 }
    - { item_id: pawn_ticket, weight: 1 }
  landlord:
    - { gold: [3, 9], weight: 4 }
    - { item_id: loaded_dice, weight: 1 }
  maid:
    - { gold: [1, 2], weight: 4 }
    - { item_id: silver_thimble, weight: 1 }
  chambermaid:
    - { gold: [1, 3], weight: 4 }
    - { item_id: silver_thimble, weight: 1 }
  housekeeper:
    - { gold: [4, 10], weight: 4 }
    - { item_id: silver_spoons, weight: 1 }
  footman:
    - { gold: [1, 4], weight: 4 }
    - { item_id: brass_button, weight: 1 }
  chandler:
    - { gold: [2, 6], weight: 4 }
    - { item_id: beeswax_tapers, weight: 1 }
  priest:
    - { gold: [1, 5], weight: 3 }
    - { item_id: vigil_oil, weight: 1 }
  novice:
    # Somebody has already had the alms.
    - { gold: [1, 2], weight: 3 }
    - { item_id: beeswax_tapers, weight: 1 }
