# HUE & CRY -- the Lantern Watch, and what it thinks it knows.
#
# Read by engine/world/law.py through `paths.law`. The contract is the
# module's docstring; this file is Tallowmere's answer to it.
#
# EVERY NUMBER HERE WAS MEASURED (AGENTS.md rule 10), with
# scripts/simulate_law.py: 40 seeds x 10 in-game days, a CAREFUL thief (one
# lift a night in the Snuffs in a porter's smock put on unseen) and a RECKLESS
# one (three lifts every afternoon in Wickmarket, in its own face, lingering
# among the Lanterns at lunch). The targets, and what the final numbers gave:
#
#   careful below `sought` on >= 60% of seed-days          100%
#   reckless reaches `wanted` by day 4 on >= 60% of seeds    78%
#   reckless arrested at least once in 10 days, 50%..95%     80%
#   ...and so is one who bribes whenever it can              80%
#   no sentence longer than max_days                          3
#
# The full table, first tuning and last, is in CHANGELOG.md. What moved from
# the plan's starting numbers and why:
#
#   wanted.cool_per_day  1.5 -> 0.5. At 1.5 a thief lifting three purses a
#                        day under the Watch's nose cooled faster than it
#                        heated: the reckless median band was `unknown` on
#                        day 4 and nobody reached `wanted` in four days.
#   wanted.thresholds    [0,2,5,9,14] -> [0,2,4,7,11]. With cooling at 0.5 a
#                        day, 9 for `wanted` still took most seeds past day 4.
#   recognise            0.25/0.5/0.8 -> 0.03/0.06/0.12. Recognition rolls
#                        once a TURN per Lantern present, and Wickmarket at
#                        lunch holds up to four: at the plan's numbers a stop
#                        was certain within a day of `sought`, and every
#                        reckless run was arrested by day 7. These are per
#                        Lantern per turn; lingering among four of them for
#                        six turns is still a stop most days once wanted.
#   reporters            two roles -> the respectable city. The Low Town
#                        (porters, warehousemen, the Company, landlords) is
#                        left out on purpose: nobody in the Snuffs runs to a
#                        Lantern, which is exactly why a careful thief works
#                        there -- its lifts reach the Watch only by rumour,
#                        second- and third-hand, and blurred.
#
# Unchanged from the plan, because measurement did not ask them to move:
# `notice` (0.6 by day, 0.35 after dusk), `precision`, `spread_per_hour`
# and the severities. The watch_stop's `run` is `easy`
# (data/encounters/watch_stop.yaml), set in the same measurement: at
# `standard` a stop was an arrest a third of the time, and arrest was certain.
#
# THE ARREST (fix round 1). Uncapped, one day and six crowns a severity made
# sentences of 9 to 27 days -- longer than the story -- and fines of 54 to 162
# crowns against the 11 to 31 a working thief holds, so nobody ever paid. Now
# three crowns a severity, capped at 30, and at most three days: measured, a
# quarter of the reckless arrests end in a paid fine and none in more than three
# days in the cells. The bribe on the street scales the same way (watch_stop).
# A thief who bribes every Lantern it can afford is still arrested on 80% of
# runs -- the same as one who always runs -- so the coin is a choice, not a
# pass.
#
# BURGLARY (v0.11) joined at severity 3, measured with scripts/simulate_jobs.py
# rather than this harness (no thief here burgles): at 2 almost no burglar
# ever reached `sought`; at 4 a careful one ended a quarter of its runs
# `wanted`. The table is in data/rules/jobs.yaml and CHANGELOG.md.
#
# BLACKMAIL (v0.15) joined at severity 3. Its only witness is its victim, and
# a squeeze is struck in private, so it is never committed as a deed on the
# street: it is FILED, whole, by the one who was squeezed -- the `report` in a
# blackmail thread's `on_break` (data/rules/threads.yaml), at precision 1.0,
# because the victim saw your face across the table. Measured with
# `scripts/simulate_hoard.py --severity` (one report filed up the Rise at
# 1.0, then quiet days; the Rise's band for your face each morning): at 1 it
# files nothing a Lantern notices; at 2 it is `noticed` the day it is filed
# and gone by the next morning; at 3 it is `noticed` for two days alone, and
# beside a lift seen up the Rise it makes you `sought` -- recognised on
# sight -- the day it lands, then `noticed` for four days more; at 4 a
# squeeze alone makes you `sought`, a stop for words said in a parlour.
# Three, as burglary: a crime against a house, never against the Watch
# (assault_watch stays the only 5). (v0.15 Task 8 restated this from the
# committed replay; the first draft's "three days alone" and "sought for
# five or six" came from a scratch script and did not reproduce.)
#
# RESISTING THE WATCH (v0.16) joined at severity 3: the opening's "duck the
# lamp and run" (game.yaml), committed pass or fail through the Law's own
# witnesses -- Brask and Tully stand on the quay at eight, so a Lantern files
# it on the Quay about four runs in five. Measured with
# `scripts/simulate_law.py --opening a --days 3 --set deeds.resisting_watch=N`
# (40 seeds, careful policy; the Quay's band each morning):
#
#   at 2  invisible: 2.0 is `noticed`'s floor and an hour's cooling takes it
#         under, so every seed reads `unknown` the next morning -- a run the
#         Watch filed and the narrator could never feel.
#   at 3  `noticed` on the Quay the next morning on 29 of the 37 seeds read
#         (all 32 that were filed, less the three it charged in a cell), gone
#         by the morning after (a hair under `noticed`'s floor at 08:00:
#         three less two days' cooling); never `sought` alone, with or without the
#         agendas (with them, `noticed` on 30, then 2 and 2: the Magpie's nights).
#   at 4  4.0 is `sought`'s floor, so a Lantern may know you on sight in the
#         hour it is filed, and it is still `noticed` three mornings on (29
#         of 37 each morning); with the agendas, `sought` again on the third
#         morning on two seeds. A stop for running.
#
# Three: as heavy as a house, below a blow -- a run is resisting, not
# striking (assault_watch stays the only 5). Charged, it is a fine of nine
# crowns or three days, so a runner who fumbles and then surrenders to the
# stop pays more than one who came quietly (one blurred lift: three crowns or
# a day). The table is in the root CHANGELOG.md, [Unreleased].
#
# FALSE WITNESS (v0.16 T7) joined at severity 3: naming the wrong person to
# Captain Ardane as the Magpie (data/scenes/lantern_house_desk.yaml). She
# files it herself, against your own face, in the Wick wards, at precision
# 1.0 -- she was sitting across the desk. ON A CLEAN FACE, by the arithmetic
# resisting_watch was set by: at 2 an hour's cooling puts it under `noticed`
# before the player leaves the building, a cost nobody could feel; at 3 it
# is `noticed` in the Wick for two days (0.5 a day of cooling) and never
# `sought` alone; at 4 it is `sought` the hour it is filed.
#
# BUT NO ACCUSER HAS A CLEAN FACE (v0.16 T8, measured). Until a right naming
# breaks it, the Watch links you to the Magpie (`links`, below), so the false
# witness lands on top of every robbery the Magpie has walked in the Wick in
# your name. scripts/simulate_acts.py reads your heat in the Wick at every
# name the desk offered (94 offers, 40 seeds x 3 openings) and the band a
# false witness of each severity WOULD have left you in there:
#
#   severity         unknown  noticed   sought   wanted   hunted
#   (at the offer)     27%      32%      20%       9%      13%
#   2                   -       27%      37%      19%      17%
#   3                   -       13%      46%      21%      20%    <- shipped
#   4                   -        -       39%      39%      21%
#
# So at 3, 87% of wrong-namers would stand at `sought` or worse -- where a
# Lantern can know you on the way out (`recognise`) -- against 42% before
# the naming: typically a band worse (12 of the 19 `hunted` were `hunted`
# already, on the Magpie's heat). Of the 15 real wrong namings measured, none
# led to an arrest before day 12, and 3 were stopped at least once
# afterwards. A cost, not a spiral. 2 would leave more than a quarter of
# wrong-namers feeling nothing; 4 puts every one at `sought` or worse and a
# clean face `sought` the hour it is filed. Kept at 3; charged, nine crowns
# or three days. A crime against the Watch's time, not a blow: below
# assault_watch.
#
# Version: v0.5.1 [2026-09-27]

# Schedule roles that ARE the law (data/world/npc_schedules.yaml): Captain
# Ardane, Sergeant Brask, Lanterns Tully and Hobb. A Lantern who sees a deed
# reports it on the spot.
roles: [watch, sergeant, captain]

# The chance a witness of each role goes straight to the Watch. The Hill, the
# Row and the Rise report; the Low Town does not (see above).
reporters:
  steward: 0.6
  factor: 0.5
  noble: 0.5
  butler: 0.5
  merchant: 0.4
  householder: 0.3
  footman: 0.3
  housekeeper: 0.3
  clerk: 0.3
  priest: 0.3
  chandler: 0.2
  maid: 0.2
  cook: 0.1

# Three watch-houses' worth of streets. The three secret places -- the
# Undercroft, the Rooftop Road and the Old Bell Tower -- are in none: no
# Lantern goes there, so a deed done there is witnessed and never filed.
jurisdictions:
  quay: [tallow_docks]
  wick: [wickmarket, the_snuffs, lantern_house, gallows_green]
  rise: [silk_row, chandlers_rise, margraves_hill]

# How the city names them. The narrator and the player see these, never ids.
labels:
  quay: "the Quay"
  wick: "the Wick wards"
  rise: "up the Rise"

deeds:
  pickpocket: {severity: 1}
  loitering: {severity: 0}      # remembered (casing a house), never reported
  fencing: {severity: 2}        # hot goods offered at an honest counter
  assault_watch: {severity: 5}  # the watch_stop's `fight`
  burglary: {severity: 3}       # a job seen, shouted about, or carried out onto the street
  blackmail: {severity: 3}      # a squeeze left uncollected: the victim swears to it (threads.yaml)
  resisting_watch: {severity: 3}  # bolting from a Lantern who shouted: the opening's run (game.yaml)
  false_witness: {severity: 3}  # naming the wrong Magpie to the captain (lantern_house_desk.yaml)

notice:
  base: 0.6
  night: -0.25                  # dusk and night: lamp-lighting to dawn
  per_margin: -0.05             # per point of a lift's stealth margin

wanted:
  bands: [unknown, noticed, sought, wanted, hunted]
  thresholds: [0, 2, 4, 7, 11]
  cool_per_day: 0.5

precision: {1: 1.0, 2: 0.6, 3: 0.3}

# Per Lantern present, per turn, times the best precision the Watch holds on
# the face you wear. `unknown` and `noticed` are never recognised.
recognise: {sought: 0.03, wanted: 0.06, hunted: 0.12}

spread_per_hour: 0.3

guises:
  self: {label: "your own face"}
  magpie: {label: "the Magpie's mask", item: magpie_mask}   # Marrow sells one
  porter: {label: "a porter's smock", item: porters_smock}  # Dock Mag sells them
  # v0.15: cut at the Porters' Hall bench (data/recipes/workshop.yaml); nobody
  # sells one. A witness files the trade, not the coat.
  lamplighter: {label: "a lamplighter", item: lamplighters_coat}

# What the Watch believes on the morning barge: Lantern Tully shouted it in
# front of the whole quay, and the Watch has not changed its mind.
links: [[self, magpie]]

arrest:
  encounter: watch_stop         # data/encounters/watch_stop.yaml
  gaol: lantern_house
  fine_per_severity: 3
  days_per_severity: 1
  max_fine: 30
  max_days: 3
