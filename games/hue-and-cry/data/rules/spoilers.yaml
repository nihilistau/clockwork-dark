# HUE & CRY -- what the narration may not name yet.
#
# Found by fixed filename inside `paths.rules`; read by
# engine/lore/interceptors.py. Below `awareness.spoiler_gate_threshold` each
# `term` is rewritten to `instead`, out of narration and out of prompt blocks
# wrapped in `mark_spoiler`. Above it, nothing is touched.
#
# The real Magpie's name is NOT here, and must never be. It is chosen by the
# seed from three people, which makes it a runtime value rather than a table
# row: since v0.12 the `magpie` ROLE in agendas.yaml carries the mask
# (`mask.instead: "the Magpie"`, lifted by the flag `magpie_unmasked`, which
# only v1.0's reveal sets). The secret it keeps is the LINK between the role
# and its person, so it masks only text the agendas write -- a row here naming
# one of the three would hide that one person everywhere, which is the same
# as pointing at them (docs/AUTHORING.md §3.8).
#
# Version: v0.1.2 [2026-09-26]

spoilers:
  # Matching is case-insensitive and swallows a leading "the", so each term is
  # written bare and each replacement carries its own article.

  # The Honest Company of Night Porters is a porters' union on paper, and the
  # paper is what a newcomer sees. The city has to earn you the other word.
  - term: "thieves' guild"
    instead: "the porters' union"

  # The three secret districts (locations.yaml, `secret: true`). The map
  # withholds them; so does the prose, until the player knows enough to look.
  # `location:` lifts each row the moment that place is known
  # (locations.is_known): a found place keeps its name, in the prose as on the
  # map and in the travel choices.
  - term: "Undercroft"
    instead: "the old drains"
    location: the_undercroft
  - term: "Rooftop Road"
    instead: "the rooftops"
    location: rooftop_road
  - term: "Old Bell Tower"
    instead: "the burnt church's tower"
    location: old_bell_tower
