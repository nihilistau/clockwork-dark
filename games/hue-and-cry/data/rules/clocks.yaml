# HUE & CRY -- what the three agenda clocks DO.
#
# Read by engine/game/clocks.py through `paths.clocks`. What each clock IS --
# its bounds and `visibility: hidden` -- is in ../../state.yaml; the moves and
# reactions that wind them are in agendas.yaml. The agendas loader refuses an
# agenda whose clock has no row here: the narrator feels a clock only through
# this `label` (engine/agents/prompts.py::_clocks_block, GM-only, a band word
# and never a number), and a clock missing here would fill in silence.
#
# THE LABELS ARE GM-FACING and say what the clock MEANS. They never name who
# the Magpie is: the label is the same sentence in every seed.
#
# NO BEAT FORCES A SCENE. HUE & CRY has shipped decks since v0.16 -- the
# initiation, the interrogation and the Lantern House front desk
# (data/scenes/) -- but all three are SCHEDULED by their own `when:` (the
# Snuffs while Gannet holds court; `in_custody: true`, repeatable, on every
# arrest; the Lantern House, free, with an alibi or an accusation to make,
# repeatable), not forced from here: a clock-forced deck never re-arms
# (engine/content/director.py::rearm), and the small room must deal on every
# arrest. A beat here sets a flag, writes a line to the "world moved"
# journal (`text`) and, for the captain, files a warrant through an ordinary
# Law effect. The flags are what the Acts' later scenes will read.
#
# Version: v0.1.3 [2026-09-27]

version: 1

clocks:

  magpie_spree:
    label: "How bold the Magpie has grown"
    beats:
      - id: magpie_spree_half
        at: 5
        set_flags: [magpie_emboldened]
        text: "Half the city has started bolting its shutters at dusk, and the silversmiths have taken their window displays in."
      - id: magpie_spree_full
        at: max
        set_flags: [magpie_spree_full]
        text: "There is hardly a shining thing left in Tallowmere below the palace, and every eye in the city has turned up the hill, toward the Everflame."

  ardane_net:
    label: "How close Captain Ardane is to closing her hand"
    beats:
      - id: ardane_net_half
        at: 6
        set_flags: [ardane_doubles_the_watch]
        text: "The Lantern House has put every Lantern on double shifts, and a fresh drawing of the Magpie is pasted on every post from the quay to the Rise."
      # THE STAKES. The captain swears out a warrant in both the Wick wards and
      # up the Rise: a clear, sworn burglary on the Magpie's file, which the
      # watch takes for your face (law.yaml `links`). An ordinary Law effect,
      # so a bribe, a broken link or quiet days answer it the way they answer
      # any other file.
      - id: ardane_net_full
        at: max
        set_flags: [ardane_warrant_sworn]
        text: "Captain Ardane has sworn out a warrant for the Magpie in her own hand, and read it aloud on the steps of the Lantern House."
        effects:
          - { type: report, deed: burglary, guise: magpie, jurisdiction: wick, precision: 1.0 }
          - { type: report, deed: burglary, guise: magpie, jurisdiction: rise, precision: 1.0 }

  silas_rise:
    label: "How far Silas Crook has pulled the Company's porters his way"
    beats:
      - id: silas_rise_full
        at: max
        set_flags: [silas_splits_the_company]
        text: "Half the young porters in the Snuffs are wearing plum ribbons in their buttonholes, and Mother Gannet has stopped knitting at meetings."
