# HUE & CRY -- vendor stock. Prices in crowns.
#
# Read through `paths.economy`. Every TOP-LEVEL key is an NPC id with a
# profile in data/tables/trade.yaml -- nothing else may live at the top level.
#
# A row here is a vendor naming their own number; everything else they will
# buy is priced off its registry `value` through their spread (and, for a
# stolen unit, their fence cut). What a fence SELLS is the front of the shop:
# the things you can buy across the counter while you decide whether to ask
# about the back room.
#
# Every id must exist in data/items/.
#
# Version: v0.1.0 [2026-09-23]

# Hollis's Sundries and Curiosities, Wickmarket, 08:00 to 22:00.
npc_pell_hollis:
  sells:
    pewter_candlesticks: { price: 11 }
    silver_thimble: { price: 7 }
    brass_snuffer: { price: 6 }

# Marrow's rag-and-bone yard, the Snuffs, 17:00 to midnight.
npc_marrow:
  sells:
    pewter_tankards: { price: 7 }
    brass_snuffer: { price: 5 }
    # "A fair-day copy," says Marrow, not looking up. The Watch reads it
    # otherwise (data/rules/law.yaml: the `magpie` guise).
    magpie_mask: { price: 12 }

# Dock Mag, on her crate at the head of the quay, 05:00 to 18:00. The one
# honest counter in the city so far: she sells the Honest Company's smocks to
# anyone who can carry a crate, and she will not buy a stolen thing -- she
# knows exactly whose it was. The smock is the `porter` guise.
npc_dock_mag:
  sells:
    porters_smock: { price: 4 }
