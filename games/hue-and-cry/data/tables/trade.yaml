# HUE & CRY -- trade rules: the currency, the spread, and the two fences.
#
# Read by engine/game/trade.py through `paths.tables`. A vendor SELLS at
# value x buy and BUYS at value x sell; the gap is their living.
#
# ONE HONEST COUNTER SO FAR. The first two vendors below are the two fences
# the spec puts in Wickmarket and the Snuffs, and both are scheduled people
# (npc_schedules.yaml) whose counters their routines actually visit: a fence
# is only open while she is at the counter and awake, which for Pell Hollis is
# the shop's hours and for Marrow is the evening, when the yard wakes up. The
# third, Dock Mag, is honest: she sells porters' smocks (v0.10, the `porter`
# guise) and refuses hot goods. The rest of the honest market arrives later.
#
# `fence: true` makes a vendor buy STOLEN units (engine/world/thievery.py's
# heat) at a cut of what she pays for a clean one: engine/game/trade.py
# prices a stolen unit at value x her `spread.sell` x `fence_cut.hot` for a
# fresh or `named` piece, `.cool` for one that has aged past `hot_days`. BOTH
# numbers are the price -- the cut alone is not (v0.18, below). The two
# fences differ on purpose:
#
#   Pell Hollis   pays properly for jewellery and the honest-looking; the
#                 wider spread (0.75) and the meaner hot cut (0.7), because
#                 a stranger's brooch is a risk she prices -- so she is the
#                 better buyer once a thing has cooled: 0.53 of value hot,
#                 0.71 cool.
#   Marrow        pays scrap -- the narrower spread (0.7) -- but barely
#                 cares how hot a thing is (0.9 hot, 0.92 cool), because by
#                 morning it will be a lump of silver with no crest on it:
#                 0.63 of value hot, 0.64 cool. The Snuffs' buyer for the
#                 night's haul, and the place to sell a signet ring.
#
# MADE TO PAY (v0.18 T3 fix round 1, the owner's decision). Until v0.18 the
# spreads were 0.55 and 0.4 and the cuts 0.45/0.8 and 0.7/0.85: a hot haul
# fetched 0.25 (Pell) and 0.28 (Marrow) of its value, though
# data/economy.yaml's lockpicks note -- which read the cut as the whole price
# and forgot the spread -- priced a 15-crown haul at "7 to 10 at a fence once
# it is hot". The fencing burglar (scripts/simulate_labour.py `burglar`) then
# lived no better than a purses-only pickpocket. Neither lever alone reaches
# 7-10: at Marrow's 0.4 spread even a cut of 1.0 pays 0.4, and Pell's 0.45
# cut would need a spread over 1.0 -- paying more than face for a clean
# thing. So the spread is the lever that was wrong (a fence whose business
# is buying paid less for a clean thing than an honest counter's 0.5), and
# the cuts move only as far as keeps each fence's shape: Pell the better
# cool buyer, Marrow the better hot one. A 15-crown haul now fetches about
# 7.9 (Pell) and 9.5 (Marrow) hot; the CHANGELOG has what it moved.
#
# AND NO MONEY LOOP. A fence pays the spread for a CLEAN thing too, so the
# spread is capped by the Porters' Hall bench: a set of lockpicks made from
# Marrow's makings costs 7.25 crowns at +0 craft, 6.63 in the best hands
# (+2) and 5.92 there haggled to the cap, and no counter may pay that for
# one, haggled or not (tests/test_hue_and_cry.py). Pell's spread is 0.75 and
# not 0.8 for that reason, and the picks' registry value is 6 (v0.18 T3 fix
# rounds 2-3): the fences pay 4, and 5 haggled. The engine has one sell spread per
# vendor, so a fence pays over an honest counter's 0.5 for a clean thing too
# (at most a crown more on a scrounged find).
#
# Both need a stock row in data/economy.yaml: trade.vendor() treats a profile
# with no faction and no stock as nobody.
#
# REFUSING TO BUY (v0.15). `refuses_to_buy: {when, text}`: while `when` (the
# shared condition grammar) holds, the vendor buys nothing from you, in her
# own words -- the `sell` verb leaves her out. Both fences carry one, reading
# EITHER fence's credit-break flag: fences stand together (data/rules/threads.yaml).
#
# Version: v0.4.0 [2026-09-29]

version: 1

trade:
  # Crowns. "12 cr" in the narrator's prompt and on the vendor panel.
  currency_format: "{n} cr"
  spread:
    buy: 1.3
    sell: 0.5
  min_sale_price: 1
  # NOBODY BUYS A RELIC (v0.17). An item tagged `relic` is dealt in by no
  # counter at all, fence or honest (engine/game/trade.py::deals_in): the
  # Everflame's heart (items/goods.yaml) is the one thing in Tallowmere every
  # fence would rather not have been shown. No other item carries the tag.
  never_traded_tags: [relic]

vendors:
  npc_pell_hollis:
    name: "Pell Hollis"
    location: wickmarket
    fence: true
    fence_cut: { hot: 0.7, cool: 0.95 }
    spread: { buy: 1.4, sell: 0.75 }
    # Welsh on either fence's credit (threads.yaml `pell_advance`,
    # `marrow_slate`) and she buys nothing more from you: fences stand
    # together on that. She still sells.
    refuses_to_buy:
      when: { any: [{ flag: welshed_on_pell }, { flag: welshed_on_marrow }] }
      text: "Pell Hollis has heard what you owe and to whom, and does not open the book"

  npc_marrow:
    name: "Marrow"
    location: the_snuffs
    fence: true
    fence_cut: { hot: 0.9, cool: 0.92 }
    spread: { buy: 1.2, sell: 0.7 }
    # Welsh on either fence's credit and nothing you carry is scrap to
    # Marrow any more.
    refuses_to_buy:
      when: { any: [{ flag: welshed_on_pell }, { flag: welshed_on_marrow }] }
      text: "Marrow does not look up, and does not look at what you have brought: a welsher's goods are nobody's scrap"

  # The first honest vendor: no `fence`, so a hot unit offered across her
  # crate is refused in her voice -- and, with the Law declared, is a
  # `fencing` deed she reports (engine/game/trade.py). She sells smocks.
  npc_dock_mag:
    name: "Dock Mag"
    location: tallow_docks
