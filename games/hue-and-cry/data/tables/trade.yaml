# HUE & CRY -- trade rules: the currency, the spread, and the two fences.
#
# Read by engine/game/trade.py through `paths.tables`. A vendor SELLS at
# value x buy and BUYS at value x sell; the gap is their living.
#
# ONE HONEST COUNTER SO FAR. The first two vendors below are the two fences
# the spec puts in Wickmarket and the Snuffs, and both are scheduled people
# (npc_schedules.yaml) whose counters their routines actually visit: a fence
# is only open while she is at the counter and awake, which for Pell Hollis is
# the shop's hours and for Marrow is the evening, when the yard wakes up. The
# third, Dock Mag, is honest: she sells porters' smocks (v0.10, the `porter`
# guise) and refuses hot goods. The rest of the honest market arrives later.
#
# `fence: true` makes a vendor buy STOLEN units (engine/world/thievery.py's
# heat) at a cut of face value: `fence_cut.hot` for a fresh or `named` piece,
# `.cool` for one that has aged past `hot_days`. The two fences differ on
# purpose:
#
#   Pell Hollis   pays properly for jewellery and the honest-looking; a wide
#                 ordinary spread and a mean hot cut, because a stranger's
#                 brooch is a risk she prices.
#   Marrow        pays scrap -- a low spread -- but barely cares how hot a
#                 thing is, because by morning it will be a lump of silver
#                 with no crest on it. The place to sell a signet ring.
#
# Both need a stock row in data/economy.yaml: trade.vendor() treats a profile
# with no faction and no stock as nobody.
#
# REFUSING TO BUY (v0.15). `refuses_to_buy: {when, text}`: while `when` (the
# shared condition grammar) holds, the vendor buys nothing from you, in her
# own words -- the `sell` verb leaves her out. Both fences carry one, reading
# EITHER fence's credit-break flag: fences stand together (data/rules/threads.yaml).
#
# Version: v0.2.0 [2026-09-26]

version: 1

trade:
  # Crowns. "12 cr" in the narrator's prompt and on the vendor panel.
  currency_format: "{n} cr"
  spread:
    buy: 1.3
    sell: 0.5
  min_sale_price: 1

vendors:
  npc_pell_hollis:
    name: "Pell Hollis"
    location: wickmarket
    fence: true
    fence_cut: { hot: 0.45, cool: 0.8 }
    spread: { buy: 1.4, sell: 0.55 }
    # Welsh on either fence's credit (threads.yaml `pell_advance`,
    # `marrow_slate`) and she buys nothing more from you: fences stand
    # together on that. She still sells.
    refuses_to_buy:
      when: { any: [{ flag: welshed_on_pell }, { flag: welshed_on_marrow }] }
      text: "Pell Hollis has heard what you owe and to whom, and does not open the book"

  npc_marrow:
    name: "Marrow"
    location: the_snuffs
    fence: true
    fence_cut: { hot: 0.7, cool: 0.85 }
    spread: { buy: 1.2, sell: 0.4 }
    # Welsh on either fence's credit and nothing you carry is scrap to
    # Marrow any more.
    refuses_to_buy:
      when: { any: [{ flag: welshed_on_pell }, { flag: welshed_on_marrow }] }
      text: "Marrow does not look up, and does not look at what you have brought: a welsher's goods are nobody's scrap"

  # The first honest vendor: no `fence`, so a hot unit offered across her
  # crate is refused in her voice -- and, with the Law declared, is a
  # `fencing` deed she reports (engine/game/trade.py). She sells smocks.
  npc_dock_mag:
    name: "Dock Mag"
    location: tallow_docks
