# HUE & CRY -- the item registry.
#
# Read by engine/game/inventory.py through `paths.items`; every *.yaml here
# merges into one id -> row registry, first file to claim an id wins.
#
# WHAT IS HERE. Everything a premise can hold (data/premises/: loot by tier,
# and the anchors' hand-written hauls) and everything a pocket can hold
# (data/rules/thievery.yaml: purses by role). Both loaders REFUSE an id this
# file does not declare, so a typo is a load error naming its file, not a
# house with nothing in it.
#
# `value` IS IN CROWNS, and it is not decoration: the fences price off it
# (data/tables/trade.yaml), and the casing board's loot hint names whichever
# piece in a house is worth the most. A labourer's purse holds one to four
# crowns; a tier-one house is worth a week's wages; the Treasury is worth a
# hanging.
#
# THE TAGS THAT DO SOMETHING:
#   named   the piece is recognisable wherever it surfaces -- a crest, an
#           engraving, a mint mark, somebody's handwriting. engine/world/
#           thievery.py keeps a stolen `named` piece HOT for good; no amount of
#           waiting cools it. Signets, seals, plate and letters carry it.
#   shiny   what the Magpie takes. Read by the Magpie's agenda, which robs
#           only a house with a shiny piece in it (data/rules/agendas.yaml,
#           `lift_a_shiny`'s `loot_tag: shiny`), and every piece of the
#           Magpie's Hoard carries it (data/tables/collections.yaml). Note
#           which pieces do NOT carry it: the minting die and the strike fund
#           are worth more than most silver, and the Magpie would walk
#           straight past both.
#
# THE MAGPIE'S HOARD (v0.15), at the foot of this file: six famous shines off
# the Watch's list, each `shiny`, `named` and `collection: magpies_hoard`.
# Named, so hot for good -- the Hoard is kept, not fenced.
#
# Version: v0.1.2 [2026-09-26]

version: 1

