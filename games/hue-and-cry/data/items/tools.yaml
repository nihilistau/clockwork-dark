# HUE & CRY -- the tools of a burglar's trade.
#
# Read by engine/game/inventory.py through `paths.items` (every *.yaml in this
# directory merges into one registry). Each id here is a `tools` row in
# data/rules/jobs.yaml: carried, it moves a job's odds at the stages that row
# names (engine/world/jobs.py::_plan).
#
# WHERE THEY COME FROM. Marrow sells the picks and the pellets across the
# counter in the Snuffs (data/tables/trade.yaml), because a fence who melts
# crests also knows who files picks and who rolls pellets, and does not ask
# what either is for. Since v0.15 a thief can make all three at the Porters'
# Hall bench instead (data/recipes/workshop.yaml): cheaper in coin, dearer in
# hours. The forged pass is made nowhere else -- nobody sells one.
#
# Version: v0.2.0 [2026-09-26]

version: 1

items:

  - id: lockpicks
    name: "Lockpicks"
    description: >-
      A roll of oiled leather holding eleven picks, two tension bars and a
      bent hairpin somebody has kept for luck. Filed by a locksmith in the
      Snuffs who swears he only ever made them for people locked out of their
      own houses. They help at a door, a cellar hatch and a strongroom lock,
      and they are not used up by any of them.
    tags: [tool]
    weight: 0.2
    value: 10
    stack: false

  - id: smoke_pellet
    name: "Smoke Pellet"
    description: >-
      A twist of waxed paper around saltpetre, tallow and something that
      smells of the vats, with a wick as long as a fingernail. Pinch, drop,
      walk away: for thirty heartbeats a Tallowmere street is a fog bank with
      a coughing Lantern in it. One use, which is one more than most plans get.
    tags: [tool, consumable]
    weight: 0.05
    value: 2
    stack: true

  - id: forged_pass
    name: "Forged Hill Pass"
    description: >-
      A vellum pass for the gate at the top of Margrave's Hill, in a good
      clerk's hand, with a wax seal pressed from somebody's thumbed-over copy
      of the real one. Shown at a Hill door it gets you a nod instead of a
      question. Anywhere else in Tallowmere it is a bit of calfskin with
      ideas above its station.
    tags: [tool, paper]
    weight: 0.02
    value: 4
    stack: false
