# HUE & CRY -- the arcs.
#
# Read by engine/game/quests.py::load_arcs from `<paths.quests>/arcs.yaml`.
# Quest files live in `<paths.quests>/<arc>/*.yaml`; a quest whose arc is not
# unlocked loads, sits in the table, and never offers itself.
#
# ONE ARC IN THE SKELETON. The spine's three acts -- Hue and Cry, Honest Work,
# The Hanging Fair -- arrive with the content that fills them. What ships now
# is the one door out of the story that is open from the first morning.
#
# AND ONE SIDE ARC (v0.15), `the_magpies_hoard`: the two Hoard pieces that rest
# in secret places are found by standing there, and a find is a quest that
# starts and finishes on arrival (the_magpies_hoard/). The arc opens only once
# the player has stood in one of those places, so neither it nor its quests
# say a word -- in the journal or the prompt -- before the place is known.
# Involvement 0 and order 0: a find is not a plot, and `active_arc` stays
# with the way out (quests.py keeps the first of equal orders).
#
# Version: v0.1.1 [2026-09-26]

version: 1

arcs:
  the_way_out:
    name: "The Way Out"
    default: true
    # Low: leaving town is not a plot, and the pacing model should not read it
    # as one.
    involvement: 1
    order: 0
    blurb: >-
      The evening barge leaves Tallow Docks every day at dusk. Anyone can be
      on it. Being on it with your name still your own is the hard part.

  the_magpies_hoard:
    name: "The Magpie's Hoard"
    involvement: 0
    order: 0
    requires_any:
      - { visited: old_bell_tower }
      - { visited: the_undercroft }
    unlock_text: >-
      Somebody in Tallowmere keeps the city's shine where nobody thinks to
      look, and you have just looked.
    blurb: >-
      Six shines the ballad swears the Magpie took and never fenced. Some of
      them are in houses. Some of them are not.
