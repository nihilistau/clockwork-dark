preferences:
  selectivity: {mean: 0.45, sd: 0.2}       # 0-1, clamped
  age_below: [3, 8]                        # their range: own age minus this ...
  age_above: [3, 10]                       # ... to own age plus this
  dealbreaker_count: [0, 2]                # drawn per person, from:
  dealbreakers: [smokes_yes, smokes_sometimes, kids_dont_want, kids_want, kids_have, drinks_often, drinks_never]
