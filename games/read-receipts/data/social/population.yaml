    - {id: brown, label: brown eyes, weight: 5}
    - {id: blue, label: blue eyes, weight: 3}
    - {id: green, label: green eyes, weight: 2}
    - {id: grey, label: grey eyes, weight: 1}
    - {id: hazel, label: hazel eyes, weight: 2}
  skin:
    - {id: fair, label: fair skin, weight: 3}
    - {id: freckled, label: freckled skin, weight: 1}
    - {id: olive, label: olive skin, weight: 2}
    - {id: light_brown, label: light brown skin, weight: 2}
    - {id: brown, label: brown skin, weight: 2}
    - {id: dark, label: dark skin, weight: 2}
  features:
    - {id: none, label: an easy smile, weight: 4}
    - {id: glasses, label: round glasses, weight: 2}
    - {id: tattoo_arm, label: a tattooed forearm, weight: 1}
    - {id: nose_ring, label: a nose ring, weight: 1}
    - {id: dimples, label: dimples, weight: 1}
    - {id: gap_teeth, label: a gap-toothed grin, weight: 1}
    - {id: scar, label: a small scar through one eyebrow, weight: 1}
    - {id: sunglasses, label: sunglasses pushed up on the head, weight: 1}

flags:                       # each drawn once per person with its probability
  has_pet: 0.3
  has_kids: 0.15
  lives_with_flatmates: 0.35
  owns_a_car: 0.4
  plays_an_instrument: 0.2
  has_tattoos: 0.25

texting_styles:              # character notes for the voice, never rules (spec §4.3)
  - {id: lowercase_fast, length: short, caps: lower, punctuation: light, emoji: 0.2, questions: 0.3, humour: playful, weight: 3}
  - {id: proper_paragraphs, length: long, caps: sentence, punctuation: full, emoji: 0.05, questions: 0.5, humour: warm, weight: 2}
  - {id: emoji_heavy, length: short, caps: sentence, punctuation: light, emoji: 0.8, questions: 0.4, humour: playful, weight: 2}
  - {id: dry_one_liners, length: short, caps: sentence, punctuation: full, emoji: 0.05, questions: 0.2, humour: dry, weight: 2}
  - {id: voice_of_a_meme, length: short, caps: mixed, punctuation: none, emoji: 0.3, questions: 0.3, humour: absurd, weight: 1}
  - {id: earnest_questions, length: medium, caps: sentence, punctuation: full, emoji: 0.15, questions: 0.8, humour: gentle, weight: 2}
  - {id: rapid_bursts, length: short, caps: lower, punctuation: none, emoji: 0.25, questions: 0.4, humour: playful, weight: 2}
  - {id: ellipsis_drifter, length: medium, caps: lower, punctuation: ellipses, emoji: 0.1, questions: 0.3, humour: gentle, weight: 1}
  - {id: exclamation_sunny, length: medium, caps: sentence, punctuation: exclamations, emoji: 0.5, questions: 0.5, humour: warm, weight: 2}
  - {id: terse_busy, length: short, caps: sentence, punctuation: light, emoji: 0.0, questions: 0.1, humour: dry, weight: 1}

bios:                        # per texting style; {hobby_a} {hobby_b} {job} {a_job} {A_job} {neighbourhood}
  lowercase_fast:
    - "{hobby_a} > everything"
    - "{job} by day, {hobby_a} by night"
    - "new-ish to {neighbourhood}. show me the good chippy"
    - "{hobby_a}, {hobby_b}, too much tea"
    - "probably out {hobby_a} rn"
    - "will judge u on ur {hobby_b} opinions"
    - "{neighbourhood} local. ask me about {hobby_a}"
  proper_paragraphs:
    - "I work as {a_job} and spend most weekends on {hobby_a}. Looking for someone to share a long Sunday with."
    - "Living in {neighbourhood}. Fond of {hobby_a} and {hobby_b}, and of people who ask good questions."
    - "{job}, occasionally competent. I'll talk about {hobby_a} for longer than you'd like."
    - "Recently took up {hobby_b}. Still terrible at it. Would welcome company in being terrible."
    - "{A_job} in {neighbourhood}. Happiest doing {hobby_a}, or planning the next time I can."
    - "I like {hobby_a}, I like {hobby_b}, and I like a good walk along the harbour after."
  emoji_heavy:
    - "{hobby_a} 🌊 {hobby_b} 🍜 {neighbourhood} 📍"
    - "{job} 💼 but mostly {hobby_a} ✨"
    - "send me your best {hobby_b} recs 🙏"
    - "{neighbourhood} girlie/guy 🏙️ {hobby_a} obsessed 😅"
    - "☕ + {hobby_a} = perfect day"
    - "will beat you at {hobby_b} 🏆"
  dry_one_liners:
    - "{job}. It's fine."
    - "Mostly {hobby_a}. Some {hobby_b}. Occasionally sleep."
    - "Lives in {neighbourhood}. Has opinions about it."
    - "Professionally {a_job}. Recreationally, {hobby_a}."
    - "Two truths and a lie: I like {hobby_a}, I like {hobby_b}, I like mornings."
    - "Here because my friend said so."
  voice_of_a_meme:
    - "{hobby_a} enjoyer"
    - "me: one more episode. also me: {hobby_b}"
    - "{job} by trade, gremlin by nature"
    - "{neighbourhood}'s premier {hobby_a} guy (self-appointed)"
    - "it's giving {hobby_a}"
    - "certified {hobby_b} menace"
  earnest_questions:
    - "What's the best thing about {neighbourhood}? I'm still deciding."
    - "Into {hobby_a} and {hobby_b}. What are you into?"
    - "I'm {a_job}. Tell me what you'd do if you weren't doing what you do."
    - "Looking for good conversation, and maybe someone to try {hobby_b} with."
    - "Favourite way to spend a Saturday? Mine involves {hobby_a}."
    - "What's something you've changed your mind about lately?"
  rapid_bursts:
    - "{hobby_a} {hobby_b} repeat"
    - "{job} tired but {hobby_a} awake"
    - "ok so {neighbourhood} is underrated"
    - "message me ur {hobby_a} spots"
    - "here for {hobby_b} buddies and whatever else"
    - "talk fast i get bored jk"
  ellipsis_drifter:
    - "{hobby_a}... {hobby_b}... the sea..."
    - "{a_job} who'd rather be doing {hobby_a}..."
    - "somewhere in {neighbourhood}... probably with a book..."
    - "still figuring things out... {hobby_b} helps..."
    - "slow mornings... long walks... you know..."
    - "not great at bios... better at {hobby_a}..."
  exclamation_sunny:
    - "Big fan of {hobby_a}! And {hobby_b}! And snacks!"
    - "{job} who loves a plan! Let's make one!"
    - "Just moved to {neighbourhood}! Show me around!"
    - "Happiest doing {hobby_a} with good people!"
    - "Looking for someone to drag to {hobby_b}!"
    - "Life's short! Go {hobby_a}!"
  terse_busy:
    - "{job}. Busy. Worth it."
    - "{hobby_a} when I can."
    - "{neighbourhood}. Weekends free."
    - "Work, {hobby_a}, sleep."
    - "Not on here much."
    - "{hobby_b}. Coffee. Early nights."

# The comment a person leaves when they like the player first (Front Porch's
# "Likes you", spec §8.3), per texting style; the same names as a bio may use.
# Read by engine/social/matching.py (v0.22.0 T7).
like_comments:
  lowercase_fast:
    - "ok ur profile made me laugh"
    - "u seem fun. {hobby_a} sometime?"
    - "had to say hi"
  proper_paragraphs:
    - "Your profile felt like someone I'd actually enjoy talking to. Hello!"
    - "I spend my weekends on {hobby_a}, and I think you'd fit right in."
    - "I liked the way you write. Tell me more?"
  emoji_heavy:
    - "hiii 👋 you seem lovely ✨"
    - "{hobby_a} buddy?? 😄"
    - "this made my day 😂"
  dry_one_liners:
    - "Good profile. Annoyingly good."
    - "You seem tolerable. High praise."
    - "Hello. That's the whole opener."
  voice_of_a_meme:
    - "me liking ur profile: 10/10 no notes"
    - "not me sending a like at this hour"
    - "this is a sign"
  earnest_questions:
    - "What's the best thing you've done this month?"
    - "Do you like {hobby_a}? I couldn't tell!"
    - "How do you spend a slow Sunday?"
  rapid_bursts:
    - "hi"
    - "ok hello"
    - "you seem cool hi"
  ellipsis_drifter:
    - "hi... your profile stuck with me..."
    - "this felt worth a like..."
    - "hello from {neighbourhood}..."
  exclamation_sunny:
    - "Hi! You seem great!"
    - "Okay you sound fun! {hobby_a} sometime?"
    - "Had to say hello!"
  terse_busy:
    - "Hi. Liked your profile."
    - "Free at the weekend?"
    - "Hello."

prompts:                    # Front Porch's three (spec §6); an answer by hobby, else `a_any`
  front_porch:
    - q: "A perfect Sunday"
      a_by_hobby:
        climbing: ["Early session at the wall, then a fry-up I've earned."]
        hiking: ["Out on the coast path before anyone's up, pub lunch after."]
        cooking: ["A slow-cooked something and nowhere to be."]
        reading: ["A whole novel and a whole pot of tea."]
        open_water_swimming: ["A cold dip at Saltmarsh and a very hot shower."]
        gigs: ["Recovering from Saturday's gig with a bacon roll."]
      a_any: ["Late breakfast, a long walk, somebody good to talk to.", "Doing absolutely nothing, beautifully."]
    - q: "I'm weirdly attracted to"
      a_by_hobby:
        board_games: ["People who read the rules out loud properly."]
        cooking: ["Anyone who seasons as they go."]
        film: ["People who stay for the credits."]
        running: ["A good stretching routine, honestly."]
      a_any: ["Good handwriting.", "People who know the names of birds.", "Confidence in karaoke."]
    - q: "My most irrational fear"
      a_by_hobby:
        sailing: ["Running aground in front of the whole harbour."]
        surfing: ["Not the sharks. The seaweed."]
        plants: ["Coming home to a crispy monstera."]
      a_any: ["Pigeons with intent.", "Someone reading my texts over my shoulder.", "Phone calls from unknown numbers."]
    - q: "The way to win me over is"
      a_by_hobby:
        coffee: ["Knowing the good café before I do."]
        baking: ["Arrive with baked goods. Any baked goods."]
        dogs: ["Be nice to my dog. Or any dog."]
        pub_quizzes: ["Know the answer to the music round."]
      a_any: ["Ask a follow-up question.", "Make me laugh at something stupid.", "Plan the second date before the first ends."]
    - q: "Together, we could"
      a_by_hobby:
        travel: ["Finally book the trip I keep talking about."]
        diy: ["Build a bookshelf that doesn't lean."]
        gardening: ["Grow tomatoes on a balcony and be insufferable about it."]
        video_games: ["Beat the co-op level I'm stuck on."]
      a_any: ["Find the best chips in {neighbourhood}.", "Try every café on the harbour.", "Get lost on purpose."]
    - q: "My simple pleasures"
      a_by_hobby:
        vinyl: ["The crackle before the first track."]
        coffee: ["The first sip, standing at the window."]
        astronomy: ["A clear night up on Castle Hill."]
        fishing: ["Nothing biting and not minding."]
      a_any: ["Clean sheets.", "Rain on the window when I'm already in.", "A bus that comes when the app says it will."]
    - q: "I'll fall for you if"
      a_by_hobby:
        dancing: ["You'll dance badly with me in the kitchen."]
        poetry: ["You send me a line of something you love."]
        comedy: ["You laugh at my jokes. Or at me. Either."]
      a_any: ["You remember the small things.", "You text back like a normal person.", "You've got a good story about {hobby_a}."]
    - q: "Typical weeknight"
      a_by_hobby:
        gym: ["Gym, dinner, an episode, asleep by eleven."]
        tv: ["Two episodes that become five."]
        football: ["Five-a-side on Tuesdays, sacred."]
      a_any: ["Work as {a_job}, cook something, call it a night.", "Pretending I'll go to bed early."]
    - q: "Green flags I look for"
      a_any: ["Kind to waiters.", "Has a hobby they'd talk about for an hour.", "Says what they mean."]
    - q: "Best spot in Port Merrow"
      a_by_hobby:
        hiking: ["The top of Westcliff at sunset."]
        eating_out: ["The noodle bar behind the Quays market."]
        galleries: ["The little gallery on Castle Hill nobody goes into."]
      a_any: ["Anywhere in {neighbourhood} after the rain.", "The harbour wall at high tide."]

