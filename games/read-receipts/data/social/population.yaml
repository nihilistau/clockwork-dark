# READ RECEIPTS -- population.yaml (paths.social, spec §2.1, §4).
#
# Who lives in Port Merrow's two dating apps. Read by
# engine/social/population.py: a person is a pure function of (seed, index),
# every field drawn from the tables below on the person's own stream, never
# stored, never written by the model (spec §4.1, §4.3). creation.yaml's
# `of_table` names the tables here, so the player picks from the same lists
# the population is drawn from (spec §3.1).
#
# Shapes:
#   a table row         {id, label, weight?}; weight defaults to 1, and must
#                       be a positive number where given
#   names               {female: [...], male: [...]}; the name is drawn AFTER
#                       the filter, keyed by sex, on its own stream key
#   ages                per dating app {mean, sd}, clamped to the player's
#                       discovery range widened by `age_spill`, floor
#                       `age_bounds.min`
#   distance            11x11, symmetric, 0-4 (matching's distance term, T7)
#   schedules           per job shape, per weekday, [start_hour, end_hour,
#                       status] bands; any hour no band covers is asleep
#                       (behaviour.status_at, T5)
#   bios / prompts      templates; {hobby_a} {hobby_b} {job} {a_job} {A_job} {neighbourhood}
#                       are the only names a template may use
#   flags               the fixed facts a mechanic may gate on, each drawn
#                       once per person with its probability
#
# Intent and archetype weights are per app, in apps.yaml `culture:` (spec §6).
#
# Every number here is a balance constant (rule 10).
# Measured 2026-10-13 (v0.22.0 T26, fix round 1): `python scripts/simulate_social.py --game
# read-receipts --days 60 --first-seed N --seeds 1 --policy attentive --raw r-N.json`
# for N = 0..19, then `--fold r-*.json` (the attentive player, the default
# `neutral_model` voice; the turners' row at --days 75). The whole table, every
# voice and policy and the before, is in the story's CHANGELOG ([Unreleased],
# Changed). The rows this file's numbers move (measured, band):
#   no §20 row of its own; every row above is drawn over these tables as shipped
#
# Version: v0.2.0

filter:
  sex: opposite              # opposite | same | any (spec §4.2) -- the brief: opposite
  age_from_discovery: true

age_spill: 0.2               # discovery's range widened by 20% either side
age_bounds: {min: 18, max: 75}   # required; the apps' own minimum, as on every real dating app (spec §3.1)

