# READ RECEIPTS -- scenes.yaml (paths.social, v0.23.0 spec §10).
#
# Scenes: meet-ups played in person. Read by engine/social/scene.py.
#
# A scene opens when the player and the person are both at a plan's place
# (engine/social/plans.py `arrive`). It owns the narrated turn: the player
# picks a conversational MOVE (`scene {move, topic?}`), a CLOSER
# (`close {closer[:arg]}`) or, at the flat, a shared activity (`do`).
#
# Keys:
#   prior             v0.22's meet quality, moved (§10.2): drawn once when the
#                     scene opens, on SOCIAL_SCENE. base, plus terms:
#                     chemistry (x their chemistry, 0-1), warmth (x their
#                     warmth / 100) and mood (their mood now -> a term), plus a
#                     centred draw of `spread`. It is the bias every moment
#                     starts from, and x100 their starting energy (0-100).
#   moment            one move's score (§10.3): prior + the move's fit + the
#                     topic's fit + their mood (prior.terms.mood) + one centred
#                     SOCIAL_SCENE draw of `spread`. `bands` gives each band's
#                     least score (lands, fine, flat; below flat a misstep).
#                     topic_fit: `theirs` for asking about a topic of their
#                     current rung, `shared` for telling them about a hobby
#                     you share. energy_cost: their energy each band spends.
#   moves             the conversational moves. Each row is exactly label,
#                     minutes, fit and bands (spec §19.6): `fit` is
#                     {traits: {population trait id: term}, archetypes:
#                     {archetype: term}}, `bands` the exact warmth/trust each
#                     band moves. No move has a floor, a stage, or a refusal:
#                     asking about a topic above their rung is answered by them
#                     steering elsewhere (`too_deep_band`, and growth.yaml's
#                     `loss.too_deep`), a scored outcome. `phone` is never
#                     offered (addendum 4 W7): its row scores the phone
#                     picked up in company. `talk` is offered in its place,
#                     and is what a line typed in a scene becomes when it
#                     names no topic (engine/social/typed.py). Rows in the
#                     order engine/social/scene.py's MOVES gives.
#   closers           how the evening ends or moves on (§10.4): the closer ids
#                     the engine offers, in this order of preference.
#                     `propose` (v0.23.0 T18, §12.1) is offered while
#                     growth.yaml's `willing.propose` holds: they say yes, the
#                     stage becomes engaged, and the evening goes on. At home
#                     with the partner who lives with you (`at_home`) only
#                     call_it_a_night (staying in), another_round and propose
#                     are offered; at the wedding, none.
#   close             energy_out: their energy at or below it and they close;
#                     misstep_run: that many missteps in a row and they close.
#                     another_round_minutes / another_round_energy: what
#                     `another_round` costs and gives back (a share of 100).
#                     walk_extra_minutes: `walk_them_home` costs their home's
#                     travel minutes plus these.
#   end_bands         the moments' average score -> the scene's band (great,
#                     good, fine, awkward; below awkward bad).
#   too_deep_band     the band of a question above their rung.
#   shared_activities what the two of you can do together at the flat, by room
#                     (activities.yaml ids).
#   stay              staying over (§10.5; read from T16): their energy and
#                     schedule, and the answer by archetype only.
#   wedding           the wedding scene (§12.2, T18), at the registry office:
#                     `moments` (it ends after that many, a married couple at
#                     its end) and `moves` (the only moves on offer). Every
#                     moment's band is floored at `fine`: it cannot go badly.
#   chance            chance meetings with the cast (v0.23.0 addendum 4 W9),
#                     optional: at a VENUE only, a live contact may be there by
#                     their schedule. Per person and block of `block_hours`,
#                     one counterless draw (it moves no counter): under
#                     `prob[their status now]` (`out`, `free`; any other
#                     status never) they are out, at ONE of the venues that
#                     fit their hobbies. At most `max_here` at one venue, of
#                     the `max_candidates` most recently in contact. Going
#                     over opens a `chance` scene, its prior plus
#                     `prior_bias`; its end swaps numbers or moves to
#                     `meeting` only as far as growth.yaml `willing` allows.
#
# Words only: a move is conversation, an activity, a mood or something
# shared about yourself. What two adults do on an evening out is the
# narration's, in the storyteller prompt's and the model's register: none of
# it is engine data (AGENTS.md rule 12).
#
# First values (spec §10); unmeasured until the balance task (T29).

prior:                                     # v0.22's meets.quality, moved (§10.2)
  base: 0.5
  terms: {chemistry: 0.25, warmth: 0.15, mood: {fond: 0.1, playful: 0.08, tired: -0.08, annoyed: -0.15}}
  spread: 0.18
moment:
  spread: 0.22
  bands: {lands: 0.68, fine: 0.45, flat: 0.28}     # a moment's score at or above -> band; below flat -> misstep
  topic_fit: {theirs: 0.05, shared: 0.05}
  energy_cost: {lands: 6, fine: 8, flat: 10, misstep: 14}
moves:
  ask_about:  {label: "Ask about {topic}", minutes: 20, fit: {traits: {curious: 0.06}}, bands: {lands: {warmth: 3, trust: 2}, fine: {warmth: 1, trust: 1}, flat: {}, misstep: {warmth: -2}}}
  tell_about: {label: "Tell them about {topic}", minutes: 20, fit: {traits: {warm: 0.05}}, bands: {lands: {warmth: 2, trust: 3}, fine: {trust: 1}, flat: {}, misstep: {trust: -1}}}
  playful:    {label: "Be playful", minutes: 15, fit: {archetypes: {banterer: 0.1, romantic: 0.05}}, bands: {lands: {warmth: 4}, fine: {warmth: 1}, flat: {}, misstep: {warmth: -3}}}
  quiet:      {label: "Let a silence sit", minutes: 15, fit: {traits: {laid_back: 0.06}}, bands: {lands: {trust: 3}, fine: {trust: 1}, flat: {}, misstep: {warmth: -1}}}
  phone:      {label: "Check your phone", minutes: 5, fit: {}, bands: {lands: {}, fine: {}, flat: {}, misstep: {warmth: -3}}}
  talk:       {label: "Talk", minutes: 15, fit: {}, bands: {lands: {warmth: 2, trust: 1}, fine: {warmth: 1}, flat: {}, misstep: {warmth: -1}}}
closers: [another_round, go_somewhere_else, walk_them_home, back_to_yours, back_to_theirs, stay_the_night, call_it_a_night,
          propose]
close:
  energy_out: 0                            # their energy at 0 -> they close
  misstep_run: 2                           # two missteps in a row -> they close
  another_round_minutes: 30
  another_round_energy: 0.34               # a third of a full evening's energy back
  walk_extra_minutes: 10
end_bands: {great: 0.72, good: 0.56, fine: 0.42, awkward: 0.3}    # average moment score -> scene band
too_deep_band: flat
shared_activities: {apt_kitchen: [make_dinner], apt_dining: [eat], apt_lounge: [watch_something]}
stay:                                      # §10.5, used from T16
  energy_min: 35
  early_start_hours: 9
  accept: {default: 0.6, romantic: 0.75, slow_burner: 0.35}   # by archetype only: no `intent` term (F34)
wedding: {moments: 3, moves: [quiet, tell_about, playful, talk]}   # §12.2 (T18)
chance:                                    # chance meetings with the cast (v0.23.0 addendum 4 W9; first values, T29)
  prob: {out: 0.15, free: 0.04}            # by their schedule's status now: the share of blocks they are out at a venue
  block_hours: 3                           # one venue (or none) per person per block of the day
  max_here: 2                              # at most this many of them at one venue at once
  max_candidates: 200                      # the live contacts read, most recently in contact first
  prior_bias: -0.05                        # a chance scene's prior: nobody planned the evening
