  - {id: the_rialto, label: The Rialto, neighbourhood: old_town, kind: film,
     hobbies: [film, tv, theatre], duration_hours: 2.5}
  - {id: the_crate, label: The Crate, neighbourhood: eastfield, kind: climbing,
     hobbies: [climbing, bouldering, gym], duration_hours: 2}
  - {id: the_dice_box, label: The Dice Box, neighbourhood: the_lanes, kind: games,
