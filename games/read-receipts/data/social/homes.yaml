# READ RECEIPTS -- homes.yaml (paths.social, v0.23.0 spec §10.5).
#
# Where the cast lives. Each person is drawn ONE of these four templates, once, from a counterless
# key (engine/social/places.py, the `home` attribute); the ids are location ids
# (data/world/locations.yaml), reached by `go`. Names and descriptions only (rule 12).
#
# The design is docs/superpowers/specs/2026-10-14-v0.23.0-read-receipts-rework-design.md.
#
# templates        id -> label (the phrase a person's who-they-are block reads) and stay_reasons
#                  (facts of the house that can hold: §10.5, m5)
# weights          over neighbourhood, then age, then `default`: a neighbourhood's row if it has one,
#                  else `age_under_27` for a person under 27, else `default`. A template missing from
#                  the row has weight 0
# travel_minutes   minutes to get there (the four homes, and the registry office)
#
# Every number here is a balance constant (rule 10); first values, measured at the balance task.
#
# Version: v0.3.0

templates:
  home_harbour_studio: {label: "a studio flat on the harbour", stay_reasons: []}
  home_terrace_share: {label: "a shared terrace house", stay_reasons: ["their housemates have people over"]}
  home_westcliff_house: {label: "a house in Westcliff", stay_reasons: []}
  home_quays_loft: {label: "a loft in the Quays", stay_reasons: []}

weights:
  default: {home_harbour_studio: 3, home_terrace_share: 3, home_westcliff_house: 2, home_quays_loft: 2}
  age_under_27: {home_terrace_share: 6, home_harbour_studio: 3, home_quays_loft: 1}
  neighbourhood:
    westcliff: {home_westcliff_house: 6, home_harbour_studio: 1}
    the_quays: {home_quays_loft: 6, home_terrace_share: 2}

travel_minutes: {home_harbour_studio: 15, home_terrace_share: 20, home_westcliff_house: 25, home_quays_loft: 15,
                 registry_office: 20}
