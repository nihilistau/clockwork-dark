    routine:     {hobbies: [running, gardening, yoga], traits: [organised, morning_person, loyal], sliders: {adventurous: -1}}
    arty:        {hobbies: [painting, photography, galleries, theatre, museums, writing, poetry, film], traits: [dreamy, observant], sliders: {}}
