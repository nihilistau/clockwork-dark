# READ RECEIPTS -- media.yaml (paths.social, spec §2.1, §13).
#
# Photos, voice notes and videos are special events: rare, earned, sometimes
# unprompted, and when asked for, sometimes declined. The ENGINE decides
# every one of them (rule 1) from the budget, the stage, trust, warmth and
# mood; the model only words the message that carries it. Read by
# engine/social/media.py (v0.22.0 T19); checked whole when the story's data
# loads (media.check_data) and by validate_content.py.
#
# Every number here is a balance constant (rule 10).
# Measured 2026-10-13 (v0.22.0 T26, fix round 1): `python scripts/simulate_social.py --game
# read-receipts --days 60 --first-seed N --seeds 1 --policy attentive --raw r-N.json`
# for N = 0..19, then `--fold r-*.json` (the attentive player, the default
# `neutral_model` voice; the turners' row at --days 75). The whole table, every
# voice and policy and the before, is in the story's CHANGELOG ([Unreleased],
# Changed). The rows this file's numbers move (measured, band):
#   photos_per_close_week 0.701 (0.5-1), voice_per_relationship_week_after_numbers
#     0.713 (0.5-1.5), videos_per_close_month 1.12 (0.5-1.5); no stub voice
#     proposes, so these count the engine's own unasked media only
#
# budget          per person and kind: `start` (what a person begins with),
#                 `per_episode` (added each time a conversation with them
#                 closes, to at most `cap`; v0.23.0 spec §6.4) and
#                 `unlock_stage` (the stage from which the kind may be sent
#                 or asked for at all). One send spends 1.
# request         the player's `ask {what: photo|voice|video}`, decided at
#                 the person's next read: with budget and the stage unlocked,
#                 `accept` = base + trust_per_10 x trust/10 + warmth_per_10 x
#                 warmth/10, times the archetype's `media.accept_mult`, the
#                 mood's multiplier (`mood_mult`, held inside
#                 relationships.yaml `mood.media_mult`) and the ask's repeat
#                 multiplier (relationships.yaml `asks.repeat_mult`). A no is
#                 "later" `later_share` of the time (a request the engine
#                 keeps or breaks the next morning), else a decline.
# unsolicited     sent unasked: as each conversation closes, a person at a
#                 stage listed in `per_episode_at_stage` (or past it) draws
#                 once per kind (one sent at most) at that
#                 chance times the archetype's `media.offer_mult`; a model's
#                 `offer_*` proposal draws at `offered_mult` times it.
# subjects        what a photo or video of theirs shows: `when` (the
#                 schedule status, or statuses, they must be in: asleep |
#                 work | free | out), `requires_flag` (a population.yaml
#                 `flags` fact; never canon text), `label` (the words the
#                 voice prompt names it by) and `scene` (the image prompt's).
# player_subjects what the player may send that is not a camera-roll photo:
#                 `kinds` (photo, video), `label`, `scene`.
# portrait        the scene of a person's profile portrait (phone_media.portraits).
# style           the story's image style, appended to every image prompt.
# voice           `max_seconds`: a voice note's longest transcript (T21).
#
# Nothing here filters, rates or rewrites what an image shows (AGENTS.md
# rule 12): a prompt is the person's appearance, the scene, the caption as
# written, the time of day and the style, cut only to its length cap.
#
# Version: v0.3.0

budget:
  photo: {start: 0, per_episode: 0.15, cap: 2, unlock_stage: talking}
  voice: {start: 0, per_episode: 0.25, cap: 2, unlock_stage: talking}
  video: {start: 0, per_episode: 0.06, cap: 1, unlock_stage: numbers}

request:
  accept: {base: 0.25, trust_per_10: 0.08, warmth_per_10: 0.04}
  later_share: 0.3
  mood_mult: {neutral: 1.0, fond: 1.2, playful: 1.3, tired: 0.7, annoyed: 0.5, hurt: 0.3}

unsolicited:
  per_episode_at_stage: {talking: 0.06, numbers: 0.12, dating: 0.12}
  offered_mult: 2.0

subjects:
  - {id: selfie_now, when: free, label: a selfie, scene: "a casual selfie at home, arm's length"}
  - {id: what_im_doing, when: [free, out], label: what they are up to, scene: "a candid shot of what they are doing right now"}
  - {id: view_from_work, when: work, label: the view from work, scene: "the view from their desk at work"}
  - {id: pet, when: free, requires_flag: has_pet, label: their pet, scene: "their pet curled up nearby"}

player_subjects:
  - {id: my_coffee, kinds: [photo, video], label: my coffee, scene: "a flat white on a cafe table"}
  - {id: my_view, kinds: [photo, video], label: the view from my window, scene: "the city from a flat window"}
  - {id: my_dinner, kinds: [photo], label: what I'm cooking, scene: "a pan on the hob, dinner in progress"}
  - {id: my_walk, kinds: [photo, video], label: my walk, scene: "a path through the park, autumn leaves"}

portrait:
  scene: "a dating profile photo, head and shoulders, looking at the camera"

style: "candid smartphone photo, natural light, slightly imperfect framing"

voice:
  max_seconds: 15
