# READ RECEIPTS -- apps.yaml (paths.social, spec §2.1).
#
# The apps (kind, capabilities, limits, costs, culture) and the `matching:`
# block (spec §6, §8). Read by engine/social/population.py (the two dating
# apps' `pool:` and `culture:` rows, v0.22.0 T3), engine/social/apps.py (the
# apps, their decks and daily limits, v0.22.0 T7),
# engine/social/matching.py (compatibility, like-back, likes you, expiry,
# unmatching, v0.22.0 T7) and engine/social/messaging.py (threads, sending,
# receipts, numbers, v0.22.0 T8).
#
# An app is an ENGINE SURFACE (spec §6): the phone's catalogue offers its
# verbs from this table and the state, and refuses anything it does not
# allow.
#
# Shapes:
#   kind              dating | messenger | games | gallery | calendar |
#                     contacts | settings
#   pool              dating: {from, size} is a range of person indices, the
#                     two apps' disjoint; `overlap_with` + `overlap` add a
#                     band AFTER both pools whose people are on both apps
#                     (spec §4.1)
#   deck              dating: swipe (one card, like | pass | super) or browse
#                     (a full profile, like a photo or a prompt, with a
#                     comment where `comment_on_like`)
#   likes_per_day     dating: likes a day, reset at 04:00 (the `daily` event);
#                     `super_likes_per_day` super likes, which also spend a like
#   likes_you_per_day dating: people who like the player first, a day, times
#                     the profile's completeness (matching.completeness);
#                     shown in "Likes you" where `likes_you_visible`
#   match_expiry_days dating: a match nobody writes in expires after this
#   capabilities      what a thread on the app may carry: text | photo |
#                     voice | video, each with a sender and a renderer
#   first_message     dating: either (the person may write first: their
#                     opener, `opener_prob`, behaviours.yaml) or player
#   unlock            messenger and games: the stage (spec §10.3) that opens
#                     the app with a person; Texts and Natter open with
#                     `numbers`, as Texts and Natter threads (v0.22.0 T8)
#   receipts, typing  whether the app shows read receipts and typing dots;
#                     on a `receipts: true` app the person's read marks the
#                     player's messages, and the player's opening marks theirs
#                     as seen while the player's own receipts are on (T8)
#                     typing dots show while their reply is being written,
#                     only on an app whose `typing` is true (true when
#                     unset; Texts is false, as SMS shows none; T31)
#   cost_minutes      in-game minutes a verb costs: swipe and like (T7),
#                     edit (the profile, T7), text, photo, voice and video
#                     (sending, T8 and T20), move (a game move, T22)
#   culture           dating: the archetype and intent weights a person on
#                     the app is drawn by (every id one of behaviours.yaml's
#                     archetypes, or long_term | short_term | friendship |
#                     unsure; every weight above 0), and `selectivity_mult`,
#                     how much a person's selectivity counts against a like
#
# Likes you and the browse deck share one like-back draw per pair (spec §8.2):
# the people who like the player first are drawn ONLY from those whose draw
# is true, and each leaves the deck once they have liked. So, through a run,
# the browse deck's matches per like fall as Likes you takes the willing
# ones first. The simulator measures matches per like with both paths together
# (scripts/simulate_social.py, like_to_match.front_porch).
#
# Every number here is a balance constant (rule 10).
# Measured 2026-10-13 (v0.22.0 T26, fix round 1): `python scripts/simulate_social.py --game
# read-receipts --days 60 --first-seed N --seeds 1 --policy attentive --raw r-N.json`
# for N = 0..19, then `--fold r-*.json` (the attentive player, the default
# `neutral_model` voice; the turners' row at --days 75). The whole table, every
# voice and policy and the before, is in the story's CHANGELOG ([Unreleased],
# Changed). The rows this file's numbers move (measured, band):
#   like_to_match.matchstick 0.133 (12-25%), like_to_match.front_porch 0.323 (25-40%)
#   messages_per_day.attentive 29.5 (15-60); live_relationships_day30.attentive 35.0
#     (4-10): DEFERRED, CLAUDE.md's row (a quiet relationship is live for its 21 days)
#
# Version: v0.4.0

apps:
  matchstick:
    kind: dating
    label: Matchstick
    pool: {from: 0, size: 1800, overlap_with: front_porch, overlap: 60}
    deck: swipe
    likes_per_day: 60
    super_likes_per_day: 1
    likes_you_visible: false
    first_message: either
    match_expiry_days: 7
    capabilities: [text]
    receipts: false
    typing: true
    cost_minutes: {swipe: 0.2, text: 2}
    culture:
      archetype_weights:
        romantic: 2
        slow_burner: 1
        banterer: 4
        dry_texter: 3
        needy: 2
        ghoster: 4
        breadcrumber: 3
        drifter: 3
        turner: 2
        steady: 1
        busy: 2
        night_owl: 3
      intent_weights: {short_term: 4, unsure: 3, long_term: 2, friendship: 1}
      selectivity_mult: 1.3
  front_porch:
    kind: dating
    label: Front Porch
    pool: {from: 1800, size: 400}
    deck: browse
    likes_per_day: 8
    comment_on_like: true
    likes_you_visible: true
    likes_you_per_day: 1
    first_message: either
    match_expiry_days: 14
    capabilities: [text, voice]
    receipts: false
    typing: true
    cost_minutes: {like: 1, text: 2, voice: 3}
    culture:
      archetype_weights:
        romantic: 3
        slow_burner: 4
        banterer: 2
        dry_texter: 1
        needy: 2
        ghoster: 1
        breadcrumber: 1
        drifter: 2
        turner: 2
        steady: 4
        busy: 3
        night_owl: 1
      intent_weights: {long_term: 5, unsure: 3, short_term: 1, friendship: 1}
      selectivity_mult: 0.9
  texts:
    kind: messenger
    label: Texts
    unlock: numbers
    capabilities: [text, photo]
    receipts: false
    typing: false
    cost_minutes: {text: 2, photo: 1}
  natter:
    kind: messenger
    label: Natter
    unlock: numbers
    capabilities: [text, photo, voice, video]
    receipts: true
    typing: true
    cost_minutes: {text: 2, photo: 1, voice: 3, video: 2}
  games:    {kind: games, label: Games, unlock: talking, offers: [wordgame, this_or_that], cost_minutes: {move: 3}}
  photos:   {kind: gallery, label: Photos}
  calendar: {kind: calendar, label: Calendar}
  contacts: {kind: contacts, label: Contacts}
  settings: {kind: settings, label: Settings, cost_minutes: {edit: 2}}

# Matching (spec §8). compatibility(player, person) is deterministic, in
# [0, 1]: the weighted terms below plus the person's hidden chemistry
# (drawn at generation from `chemistry`). The like-back chance (spec §8.2):
#   like_back_base[app] x (compat_offset + compatibility)
#     x max(0, 1 - selectivity x culture.selectivity_mult)
#     x completeness (low + (high - low) x how full the player's profile is)
#     x super_like_mult on a super like
# clamped to [0, 1], drawn ONCE per pair (un-liking cannot re-roll it).
matching:
  weights: {looking_for: 0.30, hobbies: 0.20, personality: 0.20, preferences: 0.20, distance: 0.10}   # sum to 1.0
  # Keyed "<a>_<b>" in the order long, short, friendship, unsure (long_term
  # reads `long`, short_term `short`); a pair not listed scores 0.5.
  looking_for_table:
    long_long: 1.0
    long_short: 0.2
    long_friendship: 0.3
    long_unsure: 0.6
    short_short: 1.0
    short_friendship: 0.3
    short_unsure: 0.6
    friendship_friendship: 1.0
    friendship_unsure: 0.6
    unsure_unsure: 0.7
  dealbreaker_mult: 0.1          # the preferences term, per dealbreaker the player's attributes hit
  chemistry: [-0.15, 0.15]       # the hidden per-person value, drawn by population.py
  like_back_base: {matchstick: 0.4, front_porch: 0.6}
  compat_offset: 0.35
  completeness: [0.6, 1.1]       # an empty profile's multiplier, a full one's
  super_like_mult: 1.6
  see_like_hours: {median: 6, spread: 1.2, max: 72}   # lognormal: when a mutual like becomes a match
  likes_you_hours: [7, 23]       # clock hours a day's likes-you arrive between
  # discovery.distance (creation.yaml): the farthest a card may live, on
  # population.yaml's 0-4 distance table, from the player's neighbourhood.
  discovery_distance: {near: 1, city: 3, anywhere: 4}
