# READ RECEIPTS -- behaviours.yaml (paths.social, spec §2.1, §5).
#
# The archetypes: their conversations' draws, ghosting, initiations, arcs,
# media habits and game skill (spec §5; v0.23.0 spec §4). Read by engine/social/behaviour.py (`archetype(name)`,
# `arc_spec(name)`); every person has one archetype, drawn by its app's
# `culture.archetype_weights` (apps.yaml), so every archetype named there is
# declared here (validate_content.py checks it).
#
# Shapes (spec §5.1; every key is required):
#   reply_minutes                 {median, spread}: a lognormal delay in minutes,
#                                 median > 0 (behaviour.lognormal_minutes), for
#                                 an opener after a match and a game's answer;
#                                 a reply in a conversation is never delayed
#                                 (v0.23.0 §4.3, engine/social/convo.py)
#   reply_prob, opener_prob       0-1; reply_prob is the reply draw when a
#                                 conversation starts (v0.23.0 §4.6)
#   ghost_per_episode             0-1, a chance per conversation START (v0.23.0
#                                 §4.6): nobody ghosts mid-conversation
#   left_on_read_sensitivity      interest lost per hour left on read (spec §9.4)
#   warmth_mult                   the model's proposed warmth, multiplied (spec §10.2)
#   warmth_cap_band               a closeness band warmth never passes, or null
#   cool_off_step                 interest a `cool_off` proposal costs, 0-5 (spec §10.5)
#   flake_prob                    0-1, a meet-up flaked on the day (spec §14.2)
#   double_text                   {after_hours, prob, max_in_row} (spec §9.3)
#   initiations                   a list of {id, kind, window, prob, when?,
#                                 instruction?} (v0.23.0 §4.7): `window` one of
#                                 waking, commute, lunch, after_work, evening,
#                                 late, resolved against their own schedule;
#                                 `prob` five chances, one per disclosure depth
#                                 0-4, drawn each morning; `when` names
#                                 conditions (stage_min, hours_since_player,
#                                 days_since_last ...); `instruction` an id in
#                                 texter.md's `## Instructions` table
#                                 (window_message when unset)
#   media                         {offer_mult, accept_mult} (spec §13.1)
#   games                         {skill 0-1, invite_prob_per_day 0-1} (spec §21):
#                                 Tile Talk's pick by skill; the chance each
#                                 morning they ask the player for a game
#                                 (engine/social/games, since T23)
#   arc                           an `arcs:` id, or null
#   growth                        {pace, cap, cap_in_person, decay_mult} (v0.23.0 spec
#                                 §6.2; engine/social/growth.py): pace > 0 multiplies
#                                 every paced openness gain; cap (on the phone) and
#                                 cap_in_person are the deepest rung, 0-4, they reach;
#                                 decay_mult scales every openness loss
#   promise_prob                  0-1: their sign-off carries a promise (v0.23.0
#                                 §5.2; drawn from T4, read by nothing before)
#   offer_number_prob             0-1: they offer their number on reaching depth 1
#                                 (v0.23.0 §15; drawn from T5, read by nothing before)
#
# Arcs (spec §5.3, engine/social/relationships.py): exactly one of `at` (a
# point) or `from` (a start), each `{measure: [low, high]}`, and `beat`
# and/or `each_day`. A person's point is a whole number drawn once in that
# span (SOCIAL_BEHAVIOUR, a stable key). `at` counts `exchanges` (turns
# taken, either way): at the point an `arc_beat` fires its `beat` --
# `reveal` (a canon row id, spec §12.1), `history` (the line on their card),
# `instruction` (the situation the voice is given for the message that
# reveals it) and `then` (a `stage`, and warmth, trust, interest or mood
# moved exactly). `from` counts `days_since_matched`: from the point on,
# each morning applies `each_day` (warmth, trust, interest or mood).
#
# The reply and ghost terms every archetype shares (v0.22.0's `pacing:`
# block) are conversation.yaml's `reply:` block since v0.23.0 T3.
#
# Initiations' `when` conditions (spec §9.3, read by messaging): stage_min (a
# stage id, by spec §10.3's order), hours_since_player (hours since the
# player last wrote to them, or since the match), days_since_last (days since
# either side wrote), ghosted (true: only after they ghosted, false: the
# default, never after) and weekend (Saturday or Sunday).
#
# Every number here is a balance constant (rule 10). v0.23.0 T3's rows
# (`ghost_per_episode`, the initiations by window, `promise_prob`,
# `offer_number_prob`) are first values. v0.23.0 T9's phone-only harness
# (10 seeds x 6 sessions, attentive, neutral model) measured ghosting per
# conversation start at depth 0 5.6-6.4% (band 5-15%, banded) and 0.013-0.015 window
# initiations a day per person talking; none of them retuned.
# Measured 2026-10-13 (v0.22.0 T26, fix round 1): `python scripts/simulate_social.py --game
# read-receipts --days 60 --first-seed N --seeds 1 --policy attentive --raw r-N.json`
# for N = 0..19, then `--fold r-*.json` (the attentive player, the default
# `neutral_model` voice; the turners' row at --days 75). The whole table, every
# voice and policy and the before, is in the story's CHANGELOG ([Unreleased],
# Changed). The rows this file's numbers move (measured, band):
#   match_to_talking_3d 0.462 (40-60%), match_to_message_3d 0.677 (55-75%)
#   talking_to_ghosted_14d 0.282 (20-35%), turners_turned_60d 0.825 (60-90%)
#   messages_per_day.attentive 29.5 (15-60)
#
# Version: v0.5.0

