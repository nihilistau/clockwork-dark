    from: {days_since_matched: [14, 40]}
    each_day: {interest: -2}

# Canon rows (spec §12.1, v0.22.0 T12, engine/social/memory.py): what an
# arc's `reveal` adds to a person's canon -- one fact about them, in prose
# (at most 140 characters), written into their canon through social_memory
# when the beat fires. Every `reveal` above names a row here (checked at
# load). The voice reads canon; no mechanic does.
canon:
  wants_something_else: has realised that what they want is not what this is turning into
