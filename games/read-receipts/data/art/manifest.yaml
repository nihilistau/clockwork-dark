# READ RECEIPTS -- the art manifest (v0.23.0 spec §18.1).
#
# The 48 plates T27 rendered through the xAI image API (scripts/generate_art.py --game read-receipts
# --provider xai, then --promote), each reviewed by eye before promotion. `base` is the subjects.yaml base
# daypart's plate: a daypart a place declares no plate for falls back to it. Every row names a file that
# exists under `paths.art_root` (data/art/plates, served at /story-art/); validate_content reports a row
# naming a missing file as an error. No row declares `alts:`.
#
# Version: v0.2.0

