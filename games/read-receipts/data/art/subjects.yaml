# READ RECEIPTS -- art subjects (v0.23.0 spec §18.1): the 48-plate pack.
#
# One row per location (the 28 of data/world/locations.yaml): its `base:` daypart (the plate shown for any
# daypart it has no plate for) and its `times:` (the 48 plates of spec §18.1, base first), each a `setting` and a
# `light`. T27 renders them (scripts/generate_art.py --game read-receipts); until it does, every location falls
# through to the procedural silhouette. No row declares `alts:`, so the plate shown is always the base (m2).
#
# The subjects carry no `negative` key, no "no X" terms and no rating words; plates are unpeopled.
#
# Version: v0.2.0

style:
  prose: >-
    Warm contemporary illustration of a small harbour city of the present day, soft painterly finish,
    lived-in places, natural window light by day and lamplight at night, muted teal and terracotta with
    warm highlights, gentle film grain, quiet and intimate, unpeopled scenes that feel like someone
    just stepped out
  tags: >-
    warm contemporary illustration, small harbour city, soft painterly finish, lived-in places,
    natural window light, lamplight, muted teal and terracotta, gentle film grain, quiet, unpeopled

locations:

