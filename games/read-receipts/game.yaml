# READ RECEIPTS -- the manifest.
#
# A dating story played on a phone. Port Merrow, a harbour city of the
# present day; the player has just moved there, and the phone is half the
# stage: two dating apps, texts, an instant messenger, two games, photos and
# a calendar (the other half is the world, below). There is no plot and no ending: the people are populated from
# data under `paths.social` and the engine runs them (spec
# docs/superpowers/specs/2026-10-08-v0.22.0-dating-sim-design.md).
#
# DELIBERATELY NOT DECLARED:
#   (npc_schedules is DECLARED, for seven background people only -- baristas,
#                      bar staff, the concierge, two neighbours, v0.23.0 W8.
#                      The cast is NOT in it: engine/social runs the people
#                      from data/social/behaviours.yaml.)
#   procgen_templates  the population is generated by engine/social/population.py
#                      from data/social/population.yaml, not by the world's procgen
#   rules              nothing rolls a d20: no skills, archetypes or spoilers
#   quests             no plot, by the brief
#   endings, epilogues `endless: true` refuses both (spec §2.4)
#   agendas            the people's own behaviour is engine/social's, not an agenda
#   law                no watch, no crimes
#   (art paths are DECLARED since v0.23.0 T26: place plates only, spec §18.1. The people's
#                      photos are engine/social media (spec §13); there are no portraits plates.)
#
# THE WORLD (v0.23.0 spec §8.3): the narrated turn is open. The phone is one
# layer and the flat and the city the other: a world choice runs an ordinary
# narrated turn (the storyteller, the world verbs `do` and `go` from
# data/world/activities.yaml and the places, the evaluator), refused only
# while the phone is up ("Put the phone down first."). `paths.decks` is
# declared for the player's life-event moments (spec §11.2): six decks, one
# per player life event that has a moment (data/scenes/).
#
# Version: v0.2.0

id: read-receipts
title: "Read Receipts"
version: "0.2.0"
# The manifest-contract version (engine.games.ENGINE_VERSION "0.2.0"), not the release: ">=0.22.0" fails registry.validate.
engine_requires: ">=0.2.0"
blurb: >-
  A new city, a new phone, two dating apps. Everyone in them is somebody,
  and somebody is always typing.
endless: true            # this story has no ending (spec §2.4, AUTHORING §2.6)
ui:
  plugin: read-receipts
  panels: []             # no engine panel: the phone owns the screen (spec §18)
scene:
  name: clockwork
  module: engine.scenes.default_scene
  blueprint: "engine.scenes.default_api:story_blueprint"
settings:
  world:
    tick_hours: 0.0      # the wall-clock tick is OFF: the phone's time is spec §15's
    evil_base_rate_per_day: 0.0
  # The narrated world turn's directives (v0.23.0 spec §8.3, I1): the storyteller's
  # disposition and SocialWorld (where the player is, the buzz). config/default.yaml's
  # list is untouched, so no doom ledger's tone ever reaches this story.
  governance:
    directives:
      - StorytellerMind
      - SocialWorld
paths:
  locations: "games/read-receipts/data/world/locations.yaml"   # 28 locations: the flat, the building, the street, venues, homes (§8.1)
  prompts: "games/read-receipts/prompts"
  npc_schedules: "games/read-receipts/data/world/npc_schedules.yaml"   # seven background people, no home (W8)
  social: "games/read-receipts/data/social"
  decks: "games/read-receipts/data/scenes"                     # the life-event moments' decks (§11.2): six
  art_subjects: "games/read-receipts/data/art/subjects.yaml"   # the 28 places, 48 plates (§18.1); T27 renders them
  art_manifest: "games/read-receipts/data/art/manifest.yaml"
  art_root: "games/read-receipts/data/art/plates"              # empty until T27: the story plays on silhouettes
  sounds: "games/read-receipts/data/sounds"                      # the phone's palette (v0.24.0 spec §9.7): message pops, tones, ringtones, lock and unlock
entry:
  location_id: apt_lounge
  # No character classes: the player is a person with a phone, made by the
  # creation form (data/social/creation.yaml). registry.validate requires the
  # key declared, so "none" is said explicitly.
  archetypes: []
  opening:
    narration: >-
      The flat still smells of cardboard. Your phone lights up on the
      arm of the sofa: two new apps, installed, waiting for a profile.
    # Three world choices (v0.23.0 spec §8.3, Plan decision 27). "Pick up your phone" carries no
    # intent (the client's phone layer opens; no engine action); "Tidy up a bit" is the world verb
    # `do tidy_up`, legal at the entry (the lounge), so the first frame offers a mechanic the engine
    # honours (tests/test_turn_intent_per_game.py); "Look around the flat" is a narrated look.
    choices:
      - id: a
        text: "Pick up your phone"
      - id: b
        text: "Tidy up a bit"
        intent: { action: do, target: tidy_up }
      - id: c
        text: "Look around the flat"
