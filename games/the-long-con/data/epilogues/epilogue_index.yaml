# THE LONG CON -- what the city says about it afterwards.
#
# Read by engine/game/epilogue.py through `paths.epilogues`. Every `class:`
# below must be a class id in data/rules/endings.yaml, and every `id:` must
# have a card in the file named by `prose_source`.
#
# Version: v0.1.0 [2026-08-15]

version: 1
prose_source: epilogue_cards.yaml

time_line_template: >-
  Eleven minutes in the client chair, and {garden_days} {garden_days_word}
  to get to the bottom of it.

render_order: [title, card_m, card_g, echoes, time_line, gallery_unlock]

endings:

  - id: clean_hands
    class: clean_hands
    title: "Clean Hands"
    gallery_key: office_window_rain
    echo_speaker: [npc_bette]
    ng_plus_seed: owed_a_favour

  - id: the_frame_holds
    class: the_frame_holds
    title: "The Frame Holds"
    gallery_key: interview_room_lamp
    echo_speaker: [npc_delphine]
    ng_plus_seed: null

  - id: carrying_it
    class: carrying_it
    title: "Carrying It"
    gallery_key: locked_drawer
    # NO ECHO. Nobody had a last word about it, which is the ending.
    echo_speaker: []
    ng_plus_seed: null
