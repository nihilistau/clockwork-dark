# THE LONG CON -- natural 20 boons (d20). The engine picks one; the LLM only
# narrates it.
#
# Read by engine/game/checks.py through `paths.tables`. Structured effects,
# never prose hints: every entry resolves through engine/game/effects.py, so
# a boon can never become a stat change the model invented for itself.
#
# Schema:
#   id          stable; receipts and saves cite it, never rename
#   text        one line of consequence, past tense, no dice talk
#   applies_to  optional skill filter; omit for any skill
#   effects     effect dicts for engine/game/effects.py
#
# Version: v0.1.0

boons:
  - id: clean_success
    text: "It goes exactly as you meant it to, and something is left over."
    effects:
      - { type: stamina, delta: 5 }

  # Was `forager_luck`, granting field mushrooms on a natural 20 in survival --
  # the graph template's wood, in a city with nowhere to forage and nothing
  # that eats. Same shape, same skill, something this story has.
  - id: pressed_on_you
    applies_to: [persuasion]
    text: "It goes so well that they insist, and insisting is how this city says thank you."
    effects:
      - { type: item, item_id: carton_of_cigarettes, name: "Carton of Cigarettes", qty: 1, tags: [goods, favour] }
