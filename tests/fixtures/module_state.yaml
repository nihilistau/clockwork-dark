  # The bus and the supervisor (v0.20.0 T10, spec §14.2-§14.3).
  engine.hosting.bus.OPS: {verdict: constant, note: "the closed op table, built at import, only read"}
  engine.hosting.bus._ACTOR: {verdict: constant, note: "a frozen Arg row of OPS"}
  engine.hosting.bus._SLUG: {verdict: constant, note: "a frozen Arg row of OPS"}
  engine.hosting.bus._ACTOR_NAME: {verdict: constant, note: "v0.20.0 T15: a frozen Arg row of OPS (the story ops' acting admin)"}
  engine.hosting.bus._ADDRESS: {verdict: constant, note: "v0.20.0 T15: a frozen Arg row of OPS"}
  engine.hosting.bus._REF: {verdict: constant, note: "v0.20.0 T15: a frozen Arg row of OPS (the started audit row's ref)"}
  engine.hosting.bus._SESSION_ID: {verdict: constant, note: "v0.20.0 T15: a frozen Arg row of OPS"}
  engine.hosting.bus._ACCOUNT: {verdict: constant, note: "v0.20.0 T15: a frozen Arg row of OPS"}
  engine.hosting.bus._PAGE: {verdict: constant, note: "v0.20.0 T15: the sessions ops' argument schema (limit, offset), a dict of frozen Arg rows built at import and only read"}
  engine.hosting.bus._STORY_OP: {verdict: constant, note: "v0.20.0 T15: the story ops' argument schema, a dict of frozen Arg rows built at import and only read"}
  engine.hosting.supervisor.server.Supervisor.__init__#ThreadPoolExecutor3: {verdict: shared_by_design, note: "v0.20.0 T15, the supervisor process only: the fan-out pool (4) answering the panel's deferred sessions.list/end/end_owner off the selector thread; each request asks every serving worker at once (BusServer.request_all, one FANOUT_SECONDS deadline for all; T15 fix round 1) holding no lock (the serving list read under Supervisor._lock, released before any request); shut down by Supervisor.close"}
  engine.hosting.bus.BusServer.start#Thread: {verdict: shared_by_design, note: "the supervisor's ONE selector thread: reads every child's connection, answers hello and the quick ops itself and never blocks (non-blocking sockets); its state is under BusServer._lock, a leaf; joined by close()"}
  engine.hosting.bus.BusClient.connect#Thread: {verdict: shared_by_design, note: "a child's one bus reader: replies resolve their waiters, requests go to the pool; its end (the link closed) is the lifeline, one ERROR and an exit. It also runs a request's on_late with a reply its caller gave up on (v0.20.0 T11): RemoteLanes._late sends lane.release without waiting and counts it in RemoteLanes.abandoned_grants, an int written only on this thread"}
  engine.hosting.supervisor.queue.LaneQueue.start#Thread: {verdict: shared_by_design, note: "the supervisor process only (v0.20.0 T11): the queue's ONE deadline thread -- answers waiters busy at their deadline and reclaims a ticket held past max_hold_seconds (T11 fix round 1), then calls on_reclaim, which takes Supervisor._lock and hands the acknowledgement request to the health pool, with the queue's lock released; waits on the queue's condition, a leaf, woken by every change; joined by LaneQueue.close"}
  engine.hosting.bus.BusClient.connect#ThreadPoolExecutor: {verdict: shared_by_design, note: "a child's four-thread pool for the supervisor's requests (health, drain, shutdown); a handler reads the session store under its own leaf lock"}
  engine.hosting.supervisor.logs.LogHub.capture#Thread: {verdict: shared_by_design, note: "the supervisor process only: one per child start, reads that child's merged output into its own RotatingLog (a leaf) and the echo (echo_lock, a leaf); ends at the child's EOF and is joined after its stop"}
  engine.hosting.supervisor.ops.Operations.__init__#Thread: {verdict: shared_by_design, note: "the supervisor's ONE operations thread: runs start, stop and restart one at a time; the table under Operations._lock, a leaf"}
  engine.hosting.supervisor.server.Supervisor.__init__#ThreadPoolExecutor: {verdict: shared_by_design, note: "the supervisor's health pool (8): one check per child at a time (Child.checking), results applied under Supervisor._lock"}
  engine.hosting._bus_client: {verdict: shared_by_design, note: "the bus client the boot runner made from the environment at its first step (take_bus_environment, T10 fix round 1); set once on the main thread before anything serves, taken (set back to None) by connect_bus inside install"}
  engine.hosting.bus.BusClient.connect#ThreadPoolExecutor2: {verdict: shared_by_design, note: "a child's one-thread pool for the supervisor's health requests alone (T10 fix round 1), so a request pool busy with drains cannot fail a bus health check"}
  engine.hosting.supervisor.logs.LogHub.__init__#Thread: {verdict: shared_by_design, note: "the supervisor process only: the one echo thread, draining a bounded queue to stdout; a full queue drops (and counts) lines instead of blocking any caller (T10 fix round 1)"}
  engine.hosting.supervisor.server.Supervisor.__init__#ThreadPoolExecutor2: {verdict: shared_by_design, note: "the supervisor's reaper pool (4): stops what is left of a crashed child and applies the restart policy under Supervisor._lock, so the main thread never waits on a dying process (T10 fix round 1)"}
  engine.hosting.supervisor.process.DEFAULT_WSGI: {verdict: constant, note: "v0.20.0 T13: the WSGI module each role serves under gunicorn, only read"}
  engine.hosting.supervisor.server.Supervisor.shutdown#ThreadPoolExecutor: {verdict: per_context, note: "one shutdown's pool, one thread per running child, bounded by shutdown_seconds and shut down before shutdown returns"}
