  engine.hosting.metrics_schema.KINDS: {verdict: constant, note: "the closed metrics schema, pinned by tests/test_metrics_schema.py; only read"}
  engine.hosting.metrics_schema._TS: {verdict: constant, note: "a frozen Field row of KINDS"}
  engine.hosting.metrics_schema._MS: {verdict: constant, note: "a frozen Field row of KINDS"}
  engine.hosting.metrics_schema._STORY: {verdict: constant, note: "a frozen Field row of KINDS"}
  engine.hosting.metrics_schema._ACCOUNT_OR_NONE: {verdict: constant, note: "a frozen Field row of KINDS"}
  engine.hosting.supervisor.queue._OUTCOME_OF: {verdict: constant, note: "a refusal's lane metric outcome, only read"}
  engine.hosting.supervisor.metrics.REFUSALS: {verdict: constant, note: "T17 fix round 1: the refusals counted per minute, kind -> outcomes; only read"}
  engine.hosting.metrics_emit._queue: {verdict: shared_by_design, note: "a supervised child's ONE bounded metric queue (a queue.Queue, thread-safe; its internal lock is the library's, never held across anything of ours): made by enable() on the main thread at boot.prepare_child, before any request; None in every other process (emit is then a no-op); emit put_nowaits and drops when full, never blocking a turn"}
  engine.hosting.metrics_emit._sender: {verdict: shared_by_design, note: "the child's one metric sender thread, set by attach() once, on the boot thread, after the bus connects; None until then"}
  engine.hosting.metrics_emit.attach#Thread: {verdict: shared_by_design, note: "a supervised child's ONE metric sender: takes events off the bounded queue and sends each as a `metric` notification (BusClient.notify, its leaf lock for one sendall); a failed send is counted in dropped; daemon, ends on a None or with the process"}
  engine.hosting.metrics_emit.dropped: {verdict: log_once, note: "a diagnostic count of metrics dropped (a full queue, a failed send), incremented without a lock: a race loses one count"}
  engine.hosting.metrics_emit._handler: {verdict: shared_by_design, note: "the ERROR handler's install flag (the handler attach() put on the root logger, once, on the boot thread); logging's own handler lock serialises its emit"}
  engine.hosting.supervisor.metrics.MetricsStore.open#Thread: {verdict: shared_by_design, note: "the supervisor process only: the metrics store's ONE writer thread, draining a bounded queue.Queue into SQLite in batches and pruning hourly; the connection under MetricsStore._db_lock and the counters under _counts_lock, both leaves; record() never waits on either across I/O (validate, then put_nowait); joined by MetricsStore.close"}
  engine.scenes.default_scene.turn_metric: {verdict: shared_by_design, note: "v0.20.0 T17: the hosted turn-metric HOOK, None by default (local mode never sets it, and this module never imports engine.hosting); engine.hosting.install sets it once, under the supervisor, before anything is served; run_guarded reads it once per turn into a local"}
