  engine.hosting.frontdoor.ws_relay.BAD_UPGRADE: {verdict: constant, note: "a response body, never mutated (json.dumps reads it)"}
  engine.hosting.frontdoor.ws_relay.WORKER_REFUSED: {verdict: constant, note: "a response body, never mutated (json.dumps reads it)"}
