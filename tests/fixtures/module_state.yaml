# The engine's process-wide state, every site classified (v0.20.0, spec §5.2).
#
# tests/test_module_state_inventory.py re-runs the scan in
# tests/module_state_scan.py over engine/ and asserts its site ids EQUAL the
# keys below, so a new module global, @lru_cache function or
# threading.Thread( site fails the suite until someone classifies it here --
# which is the moment to ask whether it races when many sessions share one
# process on threads. The scan is the source; spec §5.2's table is its summary.
#
# Site ids: `module.NAME` (a module-level name, a class instance included),
# `module.Class.ATTR` (a container in a class body), `module.func()` (an
# lru_cache function), `module.qualname#Thread` (a Thread( call site; also
# #Timer, #ThreadPoolExecutor, #ProcessPoolExecutor) and
# `module.Class#ThreadSubclass`.
#
# Every lock object here is also in engine/locks.py's LOCK ORDER and
# registered with renew_after_fork (tests/test_thread_safety.py checks both).
#
# Verdicts:
#   per_context        per thread (threading.local) or per context (ContextVar),
#                      set and cleared inside one call
#   locked             built or changed only under a lock (a lock object itself
#                      is `locked` too); a lazy getter is double-checked, so a
#                      built one costs a read and no lock
#   warmed             built once by `loader` (an engine.games.caches.WARMERS
#                      entry, or a list of them) before hosted mode serves,
#                      then only read;
#                      `reset` names its RELOADERS entry when it is not a
#                      NULLED_ATTRIBUTES / LRU_CACHES row, or `never`
#   log_once           a warn-once memory or diagnostic count: a race costs a
#                      duplicate log line or one lost increment
#   registration       filled while modules import (serialised per module),
#                      read after
#   constant           never written after the module runs
#   shared_by_design   one per process is the point
#   not_served_hosted  reached only by what hosted mode refuses or never mounts
#
# `loader` may also name what builds a `locked` object that the registry
# resets (get_rules_engine): every WARMERS entry is some row's loader.

