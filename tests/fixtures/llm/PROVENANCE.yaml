# Where each model-server fixture under tests/fixtures/llm/<provider>/ came from.
#
# origin: recorded -- a live server produced these bytes (server_version is the
#                     version it reported).
# origin: authored -- written by hand from the server's documentation (`source`,
#                     the page the shape was taken from); server_version is the
#                     version that documentation describes. Nothing was run.
#
# A fixture is `recorded` ONLY if a live server produced it. vLLM's are all
# `authored` in v0.19.0 (live in v0.20.0, on Linux). llama-server's were
# recorded live in v0.19.0 T8 by scripts/record_llm_fixtures.py, which writes
# these rows: the server's own version, the model that answered (`model`), the
# date, and a `note` when the recipe needed a server flag or a kind of model.
# A recorded chat fixture holds the request that produced it under `request`;
# /props' model_path is cut to the file name. Ollama's were recorded live in
# T8 too (Ollama 0.34.4), all but those a live Ollama could not give: the
# authored three-model server the discovery tests use, a server that ignores
# `format`, a proxy's 401 and a leading inline <think>; each says why in its
# `note`.
# tests/test_llm_fixture_provenance.py fails for a fixture file with no row
# here, and for a row whose file is gone.
#
# Not listed: tests/fixtures/llm/golden_lmstudio/, the LM Studio golden. It
# pins v0.18.0's own requests and parses (tests/llm_golden.py says how it was
# made) and is never re-recorded.

