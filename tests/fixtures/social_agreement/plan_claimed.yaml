# Agreement check "plan claimed" (spec §13.4, v0.23.0 T12): a plan to meet stated that the engine has not made, or
# one it has made denied. A plan has no slot or day, so a claim needs an OPEN plan (`status: open`) and
# nothing more; the claims are relationships.yaml `meet_claims.any`, the denials `meet_denials`. A hit with
# a third-person subject before it is skipped, as `commitment_claimed` skips it.
# `bad` must fail the check; `good` must pass EVERY check.
base: &base
  stage: numbers
  now: 18.0
  person: {name: Maya, age: 31, job: nurse, neighbourhood: old_town}
  player: {name: Sam, age: 29, neighbourhood: harbourside, attributes: {job: accountant}}
  contacts: [Jordan, Priya]
  decision: {situation: reply}

bad:
  # nothing planned
  - {<<: *base, reply: {bubbles: [{text: "see you tonight!"}]}}
  - {<<: *base, reply: {bubbles: [{text: "ok it's a date then"}]}}
  - {<<: *base, now: null, reply: {bubbles: [{text: "looking forward to our date x"}]}}
  - {<<: *base, reply: {bubbles: [{text: "see you tomorrow then"}]}}
  # a plan that is over is no plan
  - {<<: *base, plans: [{id: pl1, status: cancelled, when: tonight}], reply: {bubbles: [{text: "see you later tonight"}]}}
  - {<<: *base, plans: [{id: pl1, status: lapsed, when: soon}], reply: {bubbles: [{text: "our plans are still on"}]}}
  # denied while one is open
  - {<<: *base, plans: [{id: pl1, status: open, when: soon}], reply: {bubbles: [{text: "haha we never made plans"}]}}
  - {<<: *base, stage: meeting, plans: [{id: pl1, status: open, when: now}],
     reply: {bubbles: [{text: "sorry what"}, {text: "we don't have plans though"}]}}

good:
  # open, so the claim holds
  - {<<: *base, plans: [{id: pl1, status: open, when: tonight}], reply: {bubbles: [{text: "see you tonight!"}]}}
  - {<<: *base, plans: [{id: pl1, status: open, when: soon}], reply: {bubbles: [{text: "see you tomorrow x"}]}}
  - {<<: *base, stage: meeting, plans: [{id: pl1, status: open, when: now}],
     reply: {bubbles: [{text: "on my way, see you this afternoon"}]}}
  - {<<: *base, plans: [{id: pl1, status: open, when: soon}], reply: {bubbles: [{text: "it's a date"}]}}
  # "see you in a bit" is a sign-off ("talk soon"), not a plan: not a claim (T24 review M3)
  - {<<: *base, reply: {bubbles: [{text: "gotta run, see you in a bit"}]}}
  # see you tonight with a plan for tonight (moved here from stage_claimed's fixtures, T11's carry)
  - {<<: *base, stage: talking, plans: [{id: pl1, status: open, when: tonight}],
     reply: {bubbles: [{text: "see you tonight at the quiz then!"}]}}
  # asked, not stated; negated
  - {<<: *base, reply: {bubbles: [{text: "is it a date?"}]}}
  - {<<: *base, reply: {bubbles: [{text: "can't see you tonight sadly, work"}]}}
  # a third person's words are not theirs
  - {<<: *base, reply: {bubbles: [{text: "she always says see you there to everyone"}]}}
  # no plans, and saying so
  - {<<: *base, reply: {bubbles: [{text: "we don't have plans yet but we should"}]}}
  # near misses: a wish, not a plan
  - {<<: *base, reply: {bubbles: [{text: "we should get a drink sometime"}]}}
  - {<<: *base, reply: {bubbles: [{text: "see you in April then"}]}}
  # a recap tells of a meet-up that happened: judged by its band, not here
  - {<<: *base, decision: {situation: recap, kind: recap},
     reply: {bubbles: [{text: "You met Maya at The Copper Kettle. It was a date, and a good one."}]}}
