<!-- @dsCard group="Clockwork World" viewport="1280x820" name="The Clockwork Dark — World & Interface" subtitle="Interactive bible: places, souls, the robed wizard, items, HUD & the live scene" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Clockwork Dark — World &amp; Interface</title>
  <link rel="stylesheet" href="../../styles.css" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #060908; }
    #root { height: 100vh; }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: rgba(0,0,0,.3); }
    *::-webkit-scrollbar-thumb { background: rgba(190,134,63,.45); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
    *::-webkit-scrollbar-thumb:hover { background: rgba(214,178,108,.65); background-clip: padding-box; }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes cwFlicker { 0%,100%{opacity:1} 45%{opacity:.86} 70%{opacity:.95} }
      @keyframes cwTurn { to { transform: rotate(360deg) } }
      @keyframes cwToast { from { opacity:0; transform: translateY(8px) scale(.96) } to { opacity:1; transform:none } }
      .cw-flicker { animation: cwFlicker 5.5s var(--ease-quiet) infinite; }
      .cw-turn { animation: cwTurn 60s linear infinite; }
      .cw-toast { animation: cwToast var(--dur-base) var(--ease-settle); }
    }
    .cw-log::-webkit-scrollbar-thumb { background: rgba(190,134,63,.5); }
  </style>
</head>
<body data-phase="stirring">
  <div id="root"></div>
  <script src="data.js"></script>
  <script type="text/babel" src="PaintFrame.jsx"></script>
  <script type="text/babel" src="WorldKit.jsx"></script>
  <script type="text/babel" src="Atlas.jsx"></script>
  <script type="text/babel" src="Souls.jsx"></script>
  <script type="text/babel" src="Things.jsx"></script>
  <script type="text/babel" src="Interface.jsx"></script>
  <script type="text/babel" src="Screens.jsx"></script>
  <script type="text/babel" src="../clockwork-scene/GameScene.jsx"></script>
  <script type="text/babel" src="App.jsx"></script>
  <script type="text/babel">
    function PlaySection() {
      const Game = window.GameScene;
      return (
        <div style={{ height: "100vh", display: "flex", flexDirection: "column", minHeight: 0 }}>
          <div style={{ padding: "10px 16px", borderBottom: "1px solid rgba(214,178,108,.14)",
            background: "linear-gradient(180deg,#0a0d0e,#070908)", display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontFamily: "var(--font-ui)", fontSize: "var(--text-xs)", fontWeight: 700,
              textTransform: "uppercase", letterSpacing: "var(--tracking-label)", color: "var(--accent-brass)" }}>The live scene</span>
            <span style={{ fontFamily: "var(--font-narration)", fontStyle: "italic", fontSize: "var(--text-sm)", color: "var(--text-muted)" }}>
              fake turn loop · choose, roll, walk the road · switch the evil phase in the footer</span>
          </div>
          <div style={{ flex: 1, minHeight: 0 }}><Game /></div>
        </div>
      );
    }
    window.PlaySection = PlaySection;
    const App = window.CWApp;
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
