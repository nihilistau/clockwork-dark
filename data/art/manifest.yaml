# ------------------------------------------------------------
ui:
  menu: menu-screen.jpg
  dice_roll: dice/roll-dice-image.jpg
  notice_board: signposts/notice-board-contract-tunnels.jpg
  scarecrow_sign: signposts/scare-crow-warning-sign-post.jpg
  resting: scenes/resting-camp.jpg
  hurt: scenes/player-hurt-resting.jpg
