# Vendor stock. Prices in copper.
#
# Read by engine/skills/builtin/mechanics.py::trade. Every TOP-LEVEL key is an
# NPC id -- the loader treats this file as a flat vendor table, so nothing else
# may live at the top level (no `version:`, no shared blocks). That is why the
# schema notes are in this comment.
#
#   sells:  what the player may buy. `price` is what they pay.
#   buys:   what the player may sell. `price` is what they receive.
#
# Every id on both sides must exist in data/items/*.yaml. That was not true
# before P9 -- the registry did not exist -- and it is now enforced by
# tests/test_content_integrity.py, so a typo here fails the suite instead of
# producing a shop entry that cannot be bought.
#
# WHY A VENDOR BUYS LOW: the spread is the whole of the trading game. Maris
# pays 1 for a mushroom she puts in bread she sells at 2; Odran pays 4 for a
# hide worth 24 in Millhaven because he is the one making the trip. Nobody is
# cheating anybody. The faction price multiplier in data/world/factions.yaml
# is applied on top, so being trusted narrows the spread rather than
# rewriting it.
#
# GAP NOTE: there are five NPCs in data/world/npc_schedules.yaml and only
# three of them sell anything. Millhaven market and Hallam's forge have stock
# lists worth writing and no NPC to hang them on; adding one needs an entry in
# npc_schedules.yaml, which P9 does not own.
#
# Version: v0.2.0 [2026-08-07]

# ------------------------------------------------------------
# Maris Hearth -- the bakery. Sells food, buys ingredients.
# ------------------------------------------------------------
npc_maris:
  sells:
    loaf: { price: 2, name: "Loaf of bread" }
    road_bread: { price: 4, name: "Road bread" }
    festival_cake: { price: 8, name: "Festival cake" }
    oat_porridge: { price: 1, name: "Bowl of oat porridge" }
    small_beer: { price: 3, name: "Skin of small beer" }
    hard_cheese: { price: 14, name: "Wheel of hard cheese" }
    winter_ration: { price: 22, name: "Winter ration" }
  buys:
    wild_mushroom: { price: 1, name: "Wild mushroom" }
    dried_mushrooms: { price: 4, name: "String of dried mushrooms" }
    barley_flour: { price: 9, name: "Sack of barley flour" }
    festival_honey: { price: 10, name: "Crock of late honey" }
    honeycomb: { price: 5, name: "Cut honeycomb" }
    charcoal_sack: { price: 6, name: "Sack of charcoal" }
    seed_grain: { price: 24, name: "Sack of seed grain" }

