# Charms, wards and the things people carry instead of answers.
#
# DESIGN.md: magic is costly, rare and mostly a bad idea. Nothing in this file
# is a spell. A ward pin is folk practice -- it works, or it reassures, and the
# village has never needed to know which. Only `sympathy_charm` claims to do
# anything, and it claims it quietly.
#
# THE CHARM SLOT IS SINGLE, and that is the mechanic, not a limitation. A ward
# pin worn through the collar and a hare's foot against the chest are the same
# gesture made twice; wearing both would be wearing neither. So one charm, and
# the choice of which is the whole of what a charm is for.
#
# Field reference: see data/items/food.yaml; the equip/use/collection blocks
# are documented in data/items/gear.yaml.
#
# Version: v0.2.0 [2026-08-08]

version: 1

items:

  - id: sympathy_charm
    name: "Sympathy charm"
    description: >-
      Two things bound so that what happens to one is felt by the other: a
      thread of your hair, a thread of somebody's coat, wax over both. It
      takes from the wearer. Ilya says so at point of sale, and quietly.
    tags: [charm]
    weight: 0.1
    value: 25
    art: sympathy_charm
    equip:
      slot: charm
      bonuses:
        - { skills: [sympathy], delta: 2 }
        - { skills: [nerve], delta: -1 }
      text: >-
        Wound twice round the wrist and knotted. It takes from the wearer. Ilya
        said so at point of sale, and quietly, and she was not being modest.
    stack: false

  - id: rune_talisman
    name: "Rune talisman"
    description: >-
      A river pebble cut with four marks nobody in Edgewood can read. The
      tinkers can, and price it accordingly.
    tags: [charm, trade]
    weight: 0.1
    value: 18
    art: rune_talisman
    equip:
      slot: charm
      bonuses:
        - { skills: [lore], delta: 1 }
      text: >-
        On a thong at the throat, marks outward. The tinkers read them at a
        glance and price you differently afterwards.
    collection: brass_evidence
    stack: false

  - id: brass_ward_pin
    name: "Brass ward pin"
    description: >-
      Sold nine to a card because nine is the count that holds. Worn through
      the collar, point down, where the wearer cannot see it.
    tags: [charm, trade]
    weight: 0.05
    value: 6
    art: brass_ward_pin
    equip:
      slot: charm
      bonuses:
        - { skills: [nerve], delta: 1 }
      text: >-
        Through the collar, point down, where you cannot see it. You stop
        checking over your shoulder without deciding to.
    collection: nine_pins
    stack: true

  - id: ninth_pin
    name: "The ninth pin"
    description: >-
      The last pin off a card of nine. Ilya will not sell it separately and
      will not explain why, and the price of a tenth is not a number.
    tags: [charm, quest]
    weight: 0.05
    value: 40
    art: ninth_pin
    collection: nine_pins
    stack: false

  - id: saint_candle
    name: "Saint's candle"
    description: >-
      A stub from the shrine, lit for a saint with no name and no face. The
      old women light two now where they used to light one.
    tags: [charm, light]
    weight: 0.2
    value: 2
    art: saint_candle
    use:
      verb: "light"
      hours: 0.5
      consumes: 1
      effects:
        - type: check_penalty
          id: lit_for_a_saint
          text: "lit for a saint with no name"
          delta: 1
          skills: [sympathy, nerve]
          days: 1
      text: >-
        You light it for a saint with no name and no face, which the old women
        say is the only kind worth the wax.
    collection: folk_remedies
    stack: true

  - id: hare_foot
    name: "Hare's foot"
    description: >-
      Dried, tied with red thread, carried against the chest. Half the
      children in Well Row have one and none of them will say who gave it.
    tags: [charm]
    weight: 0.05
    value: 1
    equip:
      slot: charm
      bonuses:
        - { skills: [survival], delta: 1 }
      text: >-
        Against the chest on its red thread. Half the children in Well Row have
        one and not one of them will say who gave it to them.
    collection: folk_remedies
    stack: true

  - id: bent_nail
    name: "Bent iron nail"
    description: >-
      Driven into a doorframe and turned over, which is what you do when the
      house has begun ticking and you have no better idea.
    tags: [charm, material]
    weight: 0.05
    value: 1
    collection: folk_remedies
    stack: true

  - id: wax_seal_saint
    name: "Wax saint"
    description: >-
      A thumb-pressed figure with the face left smooth on purpose. Melts in a
      pocket, which is said to be the point.
    tags: [charm]
    weight: 0.1
    value: 3
    use:
      verb: "warm"
      hours: 0.25
      consumes: 1
      effects:
        - type: check_penalty
          id: wax_saint_carried
          text: "the saint gone soft in your pocket"
          delta: 1
          skills: [sympathy]
          days: 1
      text: >-
        You close your hand round it until it gives. It goes shapeless, which
        is said to be the point, and something in you goes with it.
    collection: folk_remedies
    stack: true

  - id: golden_ring
    name: "Gold ring"
    description: >-
      Plain, worn thin, and found baked into a loaf that nobody put it into.
      Heavier than gold that size should be.
    tags: [charm, trade, quest]
    weight: 0.05
    value: 120
    art: golden_ring
    collection: turned_up_things
    stack: false
