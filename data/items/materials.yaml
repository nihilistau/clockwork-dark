# Raw materials -- what the recipes in data/recipes/ consume.
#
# Everything here is either forageable at a location tagged `forage`
# (herb_glen, deeper_forest) or bought. Nothing here is magic; herbs are
# medicine, resin is glue, and clay is clay.
#
# TWO OF THESE WERE THE WORST ITEMS IN THE GAME. `bandage` is a poultice that
# closed no wound and `potion` is a fever draught that did nothing to a fever;
# both existed only to be sold, which for a medicine is not a balance problem,
# it is a broken promise. They now carry `use:` blocks that route through
# engine/game/effects.py -- `heal_wound` and `clear_condition` were added for
# exactly these two.
#
# Field reference: see data/items/food.yaml; the equip/use/collection blocks
# are documented in data/items/gear.yaml.
#
# Version: v0.2.0 [2026-08-08]

version: 1

items:

  - id: herbs
    name: "Bundle of herbs"
    description: >-
      Mixed green cuttings tied at the stem. Useful, unspecific, and the thing
      every herbalist actually carries.
    tags: [material]
    weight: 0.2
    value: 4
    art: herbs
    use:
      verb: "chew"
      hours: 0.25
      consumes: 1
      effects:
        - type: stamina
          delta: 8
      text: >-
        Bitter green stems worked between the teeth on the walk. Not medicine.
        Enough of one to keep your legs under you to the next village.
    stack: true

  - id: feverfew
    name: "Feverfew"
    description: >-
      Small white daisies with a bitter leaf. Chewed for headache and for
      whatever the headache is a sign of.
    tags: [material]
    weight: 0.1
    value: 3
    art: feverfew
    use:
      verb: "chew"
      hours: 0.25
      consumes: 1
      effects:
        # No `clear_condition` here, deliberately. Feverfew is a leaf you chew
        # on the walk; the draught of bittergreen in this same file is the
        # thing that clears a condition, and it costs twenty-two copper and a
        # hard craft check for that reason.
        - type: check_penalty
          id: headache_eased
          text: "the headache eased"
          delta: 1
          skills: [lore, craft]
          days: 1
      text: >-
        Bitter enough to make your eyes water and the headache goes with it,
        along with whatever the headache was a sign of.
    stack: true

  - id: yarrow_bundle
    name: "Yarrow"
    description: >-
      Feathered leaves, cut in flower. Packed into a wound it slows the
      bleeding; that is not folklore, it simply works.
    tags: [material]
    weight: 0.1
    value: 4
    art: yarrow_bundle
    use:
      verb: "pack the wound"
      hours: 0.25
      consumes: 1
      effects:
        - type: hp
          delta: 2
      text: >-
        Crushed and pressed in with the heel of the hand. It slows the
        bleeding. That is not folklore; it simply works.
    stack: true

  - id: bittercress
    name: "Bittercress"
    description: >-
      Comes up in the glen thicker than it should, all year, in a bowl that
      somebody weeded once and nobody weeds now.
    tags: [material]
    weight: 0.1
    value: 3
    art: bittercress
    stack: true

  - id: birch_resin
    name: "Birch resin"
    description: >-
      Amber sap scraped from a scored trunk. Glue when it is warm, varnish
      when it is thin, and firelighter when it is neither.
    tags: [material]
    weight: 0.2
    value: 5
    stack: true

  - id: river_clay
    name: "River clay"
    description: >-
      Grey and heavy off the bank below the burn. Seals an oven mouth, patches
      a wall, and takes a fingerprint for as long as anybody wants it to.
    tags: [material]
    weight: 2.0
    value: 1
    stack: true

  - id: charcoal_sack
    name: "Sack of charcoal"
    description: >-
      Light for its size and black to the touch. The burn produces it, the
      forge eats it, and neither has ever agreed on a price.
    tags: [material, trade]
    weight: 4.0
    value: 9
    stack: true

  - id: iron_stock
    name: "Bar of iron stock"
    description: >-
      Rough forge stock, a forearm long. What a knife, a hinge or a bent nail
      is before somebody decides which.
    tags: [material, trade]
    weight: 2.5
    value: 20
    stack: true

  - id: barley_flour
    name: "Sack of barley flour"
    description: >-
      Coarse, grey, and counted against what is left in the sack every
      afternoon. Maris does the arithmetic aloud and gets it wrong twice.
    tags: [material, trade]
    weight: 5.0
    value: 12
    stack: true

  - id: linen_cloth
    name: "Bolt of linen"
    description: >-
      Undyed, hand's width, wound on a stick. Bandages, sails, shrouds and
      shirts all start here.
    tags: [material, trade]
    weight: 1.0
    value: 15
    stack: true

  - id: beeswax
    name: "Block of beeswax"
    description: >-
      Strained, cast and stamped. Candles, seals, waterproofing, and the wax
      a sympathy charm is closed with.
    tags: [material, trade]
    weight: 0.5
    value: 8
    stack: true

  - id: bandage
    name: "Poultice bandage"
    description: >-
      Boiled linen with a yarrow paste worked into it, rolled and tied. Made
      before it is needed, because it is never made after.
    tags: [material]
    weight: 0.2
    value: 6
    art: bandage
    use:
      verb: "bind"
      hours: 0.5
      consumes: 1
      effects:
        - type: heal_wound
          count: 1
        - type: hp
          delta: 2
      text: >-
        Boiled linen and yarrow paste, packed in and tied off. It closes. It
        will not be pretty and it will not be open in the morning.
    stack: true

  - id: potion
    name: "Draught of bittergreen"
    description: >-
      A stoppered vial of something green and unpleasant that brings a fever
      down. It does not heal anything; it buys the body a night.
    tags: [material]
    weight: 0.3
    value: 22
    art: potion
    use:
      verb: "drink"
      hours: 0.25
      consumes: 1
      effects:
        - type: hp
          delta: 4
        - type: clear_condition
          kind: check_penalty
        - type: stamina
          delta: 10
      text: >-
        Green, and as unpleasant as advertised. It does not heal anything. It
        takes the fever off you and buys the body a night, which on this road
        is most of what anybody is asking for.
    stack: true

  # ------------------------------------------------------------
  # Forageable materials (P12). See data/tables/forage.yaml.
  # ------------------------------------------------------------

  - id: firewood_bundle
    name: "Bundle of firewood"
    description: >-
      Deadfall snapped to arm's length and tied with a twist of bark. Heavy,
      cheap, and the difference between a cold night and a warm one.
    tags: [material, trade]
    weight: 5.0
    value: 2
    stack: true

  - id: birch_bark
    name: "Roll of birch bark"
    description: >-
      Peeled in a single sheet from a fallen trunk. Takes ink, takes a flame,
      and the shrine writes names on it when it will not write them in stone.
    tags: [material]
    weight: 0.2
    value: 2
    collection: folk_remedies
    stack: true
