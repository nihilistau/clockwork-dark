scene:
  clockwork:
    port: 5573
    host: "0.0.0.0"

lmstudio:
  base_url: "http://localhost:1234/v1"
  # Reads lmstudio.txt (gitignored), falling back to the LMSTUDIO_API_KEY
  # environment variable. Leave the file absent and the variable unset only if
  # LM Studio's "Require API key" toggle is off -- otherwise every request 401s
  # and the Storyteller silently falls back to a canned line.
  api_key: "${file:lmstudio.txt}"
  # Prefer LM Studio's native POST /api/v1/chat over the OpenAI-compatible
  # /v1/chat/completions. This is not a style preference: the native endpoint is
  # the ONLY one that can turn reasoning off. Measured on this machine with
  # nvidia/nemotron-3-nano-4b, asking for a three-word greeting --
  #   /v1/chat/completions baseline .................. 55 reasoning tokens
  #   /v1/chat/completions reasoning: "off" .......... 88 reasoning tokens
  #   /v1/chat/completions enable_thinking: false .... 143 reasoning tokens
  #   /v1/chat/completions reasoning_effort: "low" ... 113 reasoning tokens
  #   /api/v1/chat         reasoning: "off" ............. 0 reasoning tokens
  # Every OpenAI-compat knob is ignored (reasoning_effort is lmstudio-bug-tracker
  # #988). Requests needing tools or response_format still go OpenAI-compat,
  # because /api/v1/chat rejects both -- see engine/lmstudio/backend.py.
  prefer_native: true

  # Fallback window used only when model discovery fails. The real number comes
  # from the bound model's loaded_context_length via the registry.
  context_tokens: 8192
  # Must cover the largest profile max_tokens, because max_tokens caps
  # reasoning + content COMBINED. The old 900 was set when narration asked for
  # 1500; a prompt budgeted against it overflowed the window and LM Studio
  # truncates the prompt from the front, silently dropping the system persona.
  reserve_output: 3200

  # Idle seconds before LM Studio may evict a model. With 47 models installed
  # and JIT loading on, an un-evicted model holds VRAM the next profile needs.
  # Sent on the OpenAI-compatible path only; /api/v1/chat rejects the key.
  ttl_seconds: 900

  # auto | json_schema | json_object | off. `auto` probes the server once and
  # caches the answer; small quantized models often ignore tools entirely, so
  # the prose fallback stays in place until a probe proves otherwise.
  # NOTE: a json_schema grammar constrains the CONTENT channel only. Reasoning
  # runs ungrammared and uncapped, so structured output gives ZERO protection
  # against a reasoning model eating the whole token budget. Only
  # `reasoning: off` on the native transport does.
  structured_output: auto

  # Concurrent requests per lane. LM Studio serves these in parallel. Narration
  # gets its own lane so the summarizer and the Assistant can no longer stall
  # the text the player is watching appear -- the old single global semaphore
  # made every utility call a narration stall and vice versa.
  lanes:
    narration: 1
    utility: 2

  # Logical profiles. `model: ""` means discover one at runtime by capability
  # from GET /api/v0/models -- the previous ids (local-model,
  # local-model-small, local-model-draft) existed on no server anywhere.
  profiles:
    # Narration. Reasoning stays ON: on a slow local turn the model's thinking
    # is the most interesting thing on screen, and the UI shows it as a
    # separate live channel. 3000 tokens because the cap covers reasoning AND
    # content, and 400 was entirely eaten by reasoning in the reported bug.
    big:
      model: ""
      temperature: 0.85
      max_tokens: 3000
      reasoning: "on"
      lane: "narration"
      require_tools: true
      prefer_non_reasoning: false
      min_context: 8192
    # Utility: summarizer, mechanics, Assistant, quest evaluation. Reasoning
    # OFF, so the token cap buys answer rather than deliberation.
    small:
      model: ""
      temperature: 0.6
      max_tokens: 900
      reasoning: "off"
      lane: "utility"
      require_tools: false
      prefer_non_reasoning: true
      min_context: 4096
    draft:
      model: ""
      temperature: 0.3
      max_tokens: 256
      reasoning: "off"
      lane: "utility"
      require_tools: false
      prefer_non_reasoning: true
      min_context: 4096

  # Legacy alias map, still honoured as an explicit-id hint per profile. Left
  # empty: the ids that used to live here did not exist.
  models:
    big: ""
    small: ""
    draft: ""

media:
  # Generate images DURING PLAY. Off by default on measured evidence: a Grok
  # Imagine still takes 2-3 minutes, which cannot sit inside a real-time turn.
  # ComfyUI is seconds and is the backend worth turning this on for.
  #
  # With this off, images come from the shipped art pack (see
  # data/art/manifest.yaml) and the disk cache -- which is instant, and is what
  # a shipped example game should do. Use scripts/generate_art.py to fill gaps
  # ahead of time rather than paying for them mid-turn.
  live_generation: false

  # Which backend live generation and the pre-generation script use.
  # grokbuild | comfyui | procedural
  image_provider: grokbuild
  # Generated stills carry a small provider watermark bottom-right. Cropping
  # trims ~4.5% off the bottom; needs Pillow.
  crop_watermark: false
  grok_timeout_seconds: 600
  cutscene_skip_after_seconds: 5
  cutscene_budget: phase_shift_only

comfyui:
  base_url: "http://localhost:8188"
  enabled: false
  timeout_seconds: 120

tts:
  # OFF by default, and that is a measurement, not a preference: this machine
  # synthesizes at ~21x slower than realtime (73.9s of compute for 3.44s of
  # audio, 42 chars, euler_steps 3). A full narration costs minutes. Turn this
  # on only if you want spoken narration badly enough to wait for it; short
  # Assistant lines are the only thing worth speaking live.
  enabled: false
  # Speak the Assistant's 1-3 sentence lines even when narration is off.
  assistant_enabled: false
  base_url: "http://127.0.0.1:8123"
  fallback: "text"
  # Voxtral is serial by construction and contends with LM Studio for the GPU.
  # A single sentence at euler_steps 3 is a few seconds; the ceiling is generous
  # because the queue is the accept loop.
  timeout_seconds: 120
  voice: "neutral_male"
  # HARD server limit: tts-server.exe rejects anything longer with HTTP 400.
  # Long input on this build does not degrade, it blows up -- a 20s paragraph
  # was measured at 47 minutes and 11.9/12 GB VRAM. Narration is split on
  # sentence boundaries and queued.
  max_chars: 400
  euler_steps: 3

stt:
  # Voxtral ASR is a CLI, not a server -- there is no HTTP route for it, so the
  # adapter shells out to the binary. base_url is kept for an OpenAI-compatible
  # Whisper server if one is ever preferred.
  base_url: "http://localhost:5051"
  mode: "voxtral_cli"

# ---------------------------------------------------------------------------
# Local service stack. `python launcher.py --stack` starts everything listed
# here with enabled: true, waits for health, then launches the game.
# Paths are machine-specific; override them in config/local.yaml rather than
# editing this file.
# ---------------------------------------------------------------------------
stack:
  wait_timeout_seconds: 900
  services:
    lmstudio:
      enabled: true
      # Managed externally -- LM Studio is a desktop app with its own server
      # toggle. The stack only health-checks it and tells you if it is down.
      manage: false
      health_url: "http://localhost:1234/v1/models"

    voxtral_tts:
      enabled: true
      manage: true
      # Your checkout of voxtral-mini-realtime-rs. Set in config/local.yaml.
      root: ""
      command: "target/release/tts-server.exe"
      args:
        - "--gguf"
        - "models/voxtral-tts-q4.gguf"
        - "--port"
        - "8123"
        - "--euler-steps"
        - "3"
      health_url: "http://127.0.0.1:8123/health"
      # Loads a 2.8 GB model and runs a warm-up sentence before it answers.
      startup_timeout_seconds: 600

    voxtral_asr:
      enabled: true
      manage: false  # CLI, invoked per request
      # Your checkout of voxtral-mini-realtime-rs. Set in config/local.yaml.
      root: ""
      command: "target/release/voxtral.exe"
      model: "models/voxtral-q4.gguf"

    comfyui:
      enabled: false
      manage: true
      root: ""
      command: "python"
      args: ["main.py", "--port", "8188"]
      health_url: "http://127.0.0.1:8188/system_stats"
      startup_timeout_seconds: 300

    grok:
      enabled: true
      manage: false  # invoked per image request
      # Absolute path, or just "grok" if it is on PATH.
      command: "grok"

world:
  tick_interval_seconds: 60

  # R-03. The background world tick was a flat 6 in-game hours granted once per
  # turn, and it was 60% of every hour the clock advanced -- no player action
  # came within a factor of two of it. Measured over 200 turns x 4 policies,
  # seed 42:
  #
  #   tick_hours   baker  cautious  pauper  reckless   mean   deaths
  #   6.0 (was)     8.87     10.31    9.38     11.54  10.02      129
  #   2.0 (now)     4.16      3.21    3.77      6.46   4.40       35
  #   1.0           3.23      2.01    3.12      4.91   3.32       22
  #
  # The mean falls 56% for a 67% cut, because the tick was also feeding the
  # thing that killed people: hunger runs at 2.0/hour, so 6h of tick was 12
  # hunger per turn before the player did anything, and every respawn bought
  # another 10 hours. Collapsing that cascade is most of the gain.
  #
  # Not lower than 2.0: at 1.0 a day is ~24 turns and the world stops feeling
  # like it moves between visits, which is the premise.
  tick_hours: 2.0

  # Ceiling on one tick, however long the player was away. The tick is now
  # proportional to real time elapsed rather than a step function -- a 61
  # second turn and a ten minute turn used to cost the same 6 hours. Without a
  # cap, leaving the tab open over lunch would advance the calendar by days.
  tick_max_hours: 6.0
  # 0.01 was never tuned against a working clock -- the clock did not work
  # until this overhaul, so the rate had never actually run. Measured with
  # scripts/simulate.py over 200 turns x 3 policies: at 0.01 the world reaches
  # CONSUMING around day 80, which is roughly 165 turns -- inside a single
  # sitting. At 0.006 it lands near day 130, and a forty-day baker sits at
  # 0.23 evil: solidly STIRRING, which is the texture DESIGN.md's phase table
  # actually promises. Below 0.005 the world is still DORMANT at day 40 and
  # the premise evaporates.
  evil_base_rate_per_day: 0.006

awareness:
  reveal_threshold: 20
  reflection_form_min: 40
  spoiler_gate_threshold: 15

assistant:
  max_tokens: 200
  reflection_awareness_min: 40

# ---------------------------------------------------------------------------
# Content limits. The product layer -- above every agent and every character.
# See docs/SAFETY.md and engine/safety/.
#
# EVERYTHING HERE IS OFF AS SHIPPED, and "off" is a data state rather than a
# switch: a session with no limits and a suggestive ceiling is INERT, and an
# inert policy short-circuits to allow at every surface, contributes no prompt
# text and draws no RNG. Both shipped stories are inert, which is why they play
# exactly as they did before this section existed.
#
# There is deliberately NO `safety.enabled` flag. An off switch on a safety
# layer is a config typo away from turning hard limits off, and the layer costs
# nothing when there is nothing to enforce.
# ---------------------------------------------------------------------------
safety:
  intensity:
    # The highest tier a story may be played at: suggestive | explicit | extreme.
    # This is the ENGINE's answer for a story that declares nothing. A story
    # raises its own with a `safety:` block in its game.yaml -- story content is
    # reviewed like code, unlike an agent, whose requests to raise the ceiling
    # go through the ratchet in engine/safety/policy.py and are refused.
    ceiling: suggestive
    # Where a new session's dial starts. Never above the ceiling; a higher
    # value here is clamped, not honoured.
    default: suggestive
    # The PLAYER's standing dial, written by the Settings screen into
    # config/local.yaml. "story" means "follow the active story's own default".
    # Any tier name overrides the story default, clamped to the story ceiling:
    # lowering is always honoured, raising past the ceiling never is.
    player: "story"

  # Player-facing Fade control. Content above the session's tier collapses to
  # summary whether or not this is on -- this is about offering the button, not
  # about the automatic behaviour.
  fade:
    available: true

  aftercare:
    default: false

  # Session-wide limits, in the engine's own voice. Almost always empty: limits
  # are a PLAYER setting, and the two shipped stories set none. A deployment
  # that must never generate something regardless of who is playing puts it in
  # hard_nos here.
  #
  #   boundaries:
  #     hard_nos:
  #       - topic: some_topic          # the id that appears in logs
  #         nouns: [word, phrase]      # surface forms, matched on word boundaries
  #     soft_nos:
  #       - topic: collars
  #         nouns: [collar]
  #         substitute: throat-garland # cosmetic rename; same mechanics
  #     green_lights: [topic]          # lifts a soft no. Never lifts a hard one.
  boundaries:
    hard_nos: []
    soft_nos: []
    green_lights: []

  # Surface forms that say "this text is at least this intense", so a caller
  # that declares no tier -- or an agent that understates one -- is still
  # measured against something.
  #
  # SHIPPED EMPTY ON PURPOSE. Filling these in means writing down the words that
  # mark explicit content, and those words belong to whoever owns the story, not
  # to the engine. The key is declared rather than omitted so the seam is
  # visible and turning it on is a config edit, not a code change. An empty map
  # is not a hole: the ceiling still enforces the tier a CALLER declares, and
  # hard limits are enforced regardless.
  tier_markers:
    explicit: []
    extreme: []

# ---------------------------------------------------------------------------
# Which story this engine is running.
#
# A game is a directory under games/<slug>/ with a game.yaml manifest whose
# `paths:` block is deep-merged over the `paths:` section below at activation
# (engine/games/registry.py). Selection precedence, first hit wins:
#
#     launcher.py --game <slug>
#     CLOCKWORK_GAME environment variable
#     game.default, here
#
# The `paths:` block below ships EMPTY of story content, so every path a story
# reads comes from its own manifest. A process that has activated nothing is
# still running a story -- whichever this precedence picks -- so an empty
# `paths.*` value resolves through that story's manifest instead
# (engine/config.py::story_paths). `clockwork-dark` therefore resolves the
# flagship content it has always resolved, with nothing about it left in here.
# `python launcher.py --list-games` prints what is installed.
# ---------------------------------------------------------------------------
game:
  default: "clockwork-dark"
  # Activate the default game at launch rather than running on the raw config.
  # Off changes nothing today (the default manifest is a no-op merge) and is
  # here so a broken manifest can never stop the flagship game from booting.
  activate_on_launch: true

# ---------------------------------------------------------------------------
# Paths.
#
# ONLY THE ENGINE'S OWN OUTPUT DIRECTORY HAS A VALUE HERE. Every content key is
# declared and EMPTY, and that is the repair of a defect this file shipped with:
# it used to name The Clockwork Dark's own files -- `data/quests`,
# `data/economy.yaml`, `data/world/locations.yaml`,
# `content/scenes/clockwork/static/art` -- as the ENGINE's defaults. A story
# that omitted a key therefore did not read nothing. It read the flagship's,
# silently, and the only symptom was content that made no sense where it
# surfaced. Measured on 2026-08-09, The Wicked Garden inherited nine of them --
# assistant_hints, challenges, comfyui_templates, doom_effects, economy,
# encounters, procgen_templates, quests, recipes -- so a fae court was quoting
# Edgewood's prices and offering Edgewood's quests.
#
# A path naming one story's files is THAT STORY'S MANIFEST'S JOB. Every story
# declares what it reads in games/<slug>/game.yaml, which the registry merges
# over this block at activation (engine/games/registry.py). Nothing is
# inherited; a key one story omits is not another story's file.
#
# WHY THE KEYS STAY DECLARED RATHER THAN DELETED. Two reasons, both about the
# seam being visible. A key listed here is a content system the engine knows
# how to read, so this block is the inventory of what a story MAY ship -- and
# scripts/doctor.py reports against it. And a declared-empty key is what tells
# engine/config.py to answer "" rather than whatever string literal the calling
# loader happens to carry, which is where the flagship's answers would otherwise
# survive in Python. See ConfigManager._story_path.
#
# AN EMPTY VALUE MEANS THIS STORY SHIPS NONE OF THIS: an empty table, an empty
# list, no lore index, no warning. That is not new behaviour -- `clocks`,
# `threads` and `endings` have always resolved to nothing for the flagship --
# it is now the behaviour of every key here.
# ---------------------------------------------------------------------------
paths:
  # THE ONE ENGINE-OWNED PATH. Names no story's content: the active slug is
  # appended at runtime, so a run is written to data/saves/<slug>/. See
  # engine/persistence/saves.py.
  saves: "data/saves"

  # -- the world ------------------------------------------------------------
  locations: ""
  factions: ""
  world_schedules: ""
  npc_schedules: ""
  world_rumors: ""
  # Seeded village and margin. The template file used to be a string literal in
  # engine/game/procgen.py as well, so a story with no templates of its own
  # generated Edgewood.
  procgen_templates: ""

  # -- things, work and trade ----------------------------------------------
  items: ""
  recipes: ""
  economy: ""
  # Random draw tables: boons, complications, forage yields, labour, trade.
  # This was hardcoded in engine/game/checks.py until v0.2.0, so a second game
  # drew the first game's boons.
  tables: ""

  # -- what happens to the player -------------------------------------------
  quests: ""
  encounters: ""
  rules: ""
  # Stored challenge specs and the set-pieces that gate them.
  challenges: ""
  # Declarative world mutations fired when a doom beat is crossed.
  # See engine/world/world_effects.py.
  doom_effects: ""

  # -- what the player is told ----------------------------------------------
  lore: ""
  # Output, but story-scoped: the index scripts/seed_lore.py builds lives inside
  # the story's own lore directory, so it cannot be defaulted either.
  lore_db: ""
  assistant_hints: ""
  # The words the model actually reads: `storyteller.md` and an optional
  # `examples.json`. Empty means the STORY-NEUTRAL fallback persona in
  # engine/agents/prompts.py -- deliberately plain, never another story's
  # voice, and it logs a warning naming the story that left this blank. The
  # flagship's own words live in games/clockwork-dark/prompts/ like any other
  # story's.
  prompts: ""

  # -- pictures --------------------------------------------------------------
  art_subjects: ""
  art_manifest: ""
  # The directory every path in `art_manifest` is relative to.
  #
  # This was hardcoded in engine/media/providers/shipped.py until v0.2.1 at the
  # FLAGSHIP's static tree, and then hardcoded here as the default until this
  # change. A story could write a manifest but had nowhere to put the files it
  # named, so every lookup missed and the procedural silhouette answered.
  #
  # A story points this at its own tree AND sets `root:` in its manifest to
  # "/story-art", which is the route in engine/api/art.py that serves this
  # directory. Files under a story's own directory are NOT reachable through
  # Flask's /static handler -- that is bound to the scene package, not the game.
  art_root: ""
  comfyui_templates: ""

  # -- structural systems ----------------------------------------------------
  # Declared so they are repointable per story and visible to doctor.py -- a
  # content path the engine reads but no config names is the shape of bug this
  # project has already paid for twice (data/tables, procgen templates).
  clocks: ""
  threads: ""
  endings: ""
  decks: ""
  challenge_bounds: ""
  # The last words a run gets, read by engine/game/epilogue.py. Listed here
  # even though it is empty for every story but one: this block is the ENGINE'S
  # VOCABULARY of path keys, and a key a story declares that is not listed is a
  # line nothing validates and doctor.py cannot see. It was missing, and
  # tests/test_games.py caught it.
  epilogues: ""

comms:
  interceptors:
    - LoreInjectInterceptor
    - AwarenessGateInterceptor

# Governance interceptor chains (engine/agents/governance.py).
#
# `directives` shapes the GM prompt as ONE budgeted block -- it is deliberately
# NOT folded into comms.interceptors, because that chain runs per system message
# and after the token budget has been fitted (issue R-01).
governance:
  directives:
    # First in the chain: standing constraints come before tone. Emits nothing
    # at all when the session's safety policy is inert -- zero prompt tokens,
    # which matters because the budget overflow (R-01) was caused by exactly
    # this kind of addition.
    - SafetyDirective
    - EvilPhaseTone
    - DoomSignsInterceptor
    - StorytellerMind
  # Runs over reconciled proposals BEFORE the transaction commits, with the
  # authority to alter them. Everything else in this file audits after the
  # fact; this is the only chain that can decide a change does not happen.
  commit:
    - SafetyCeiling
  post:
    - RulesGovernor
  media:
    - MediaGovernor