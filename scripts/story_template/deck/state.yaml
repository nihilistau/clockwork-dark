# {{title}} -- state declaration. Two meters and one clock.
#
# THE HALF-AND-HALF RULE OF THIS SHAPE: a value is declared TWICE, and the
# split is deliberate. This file says what it IS -- bounds, default,
# visibility, backing. data/rules/clocks.yaml says what the clock DOES.
# Delete either half and the clock stops working; delete THIS half and it
# stops silently, because value_of reads 0.0 and `at: max` never resolves.
#
#   backing: bag      lives in the generic meters/clocks containers on the
#                     spine -- the backing for state the engine has never
#                     heard of.
#   visibility        public -> raw number to the browser (bench-friendly)
#                     veiled -> a band word and glyphs, no number (story-
#                     friendly: numbers read as scores, scores get optimised)
#                     hidden -> never leaves the server.
#
# NO `owners:` here: this template declares no agents.yaml, so the engine
# writes these (deck beats, clock rules, thread effects -- all `by: engine`,
# always permitted). If you add a roster, grant writes THERE; active.py
# folds roster grants into this schema at load.
#
# Version: v0.1.0

version: 1
slug: {{slug}}

meters:
  # How the house regards you. What most deck beats move.
  favor:
    backing: bag
    min: 0
    max: 100
    default: 50
    # Veiled, as a shipped story would have it: the player reads "warmly
    # regarded", never "62". Switch to `public` while you build, so you can
    # watch writes land.
    visibility: veiled
    label: Favor

  # How much of yourself you keep. The counter-meter: the interesting beats
  # move both, in opposite directions.
  composure:
    backing: bag
    min: 0
    max: 100
    default: 70
    visibility: veiled
    label: Composure

clocks:
  # Four segments: the smallest clock with a middle. What the host has begun
  # to wonder about you -- see data/rules/clocks.yaml for what each segment
  # does and the scene the full clock forces.
  suspicion:
    backing: bag
    min: 0
    max: 4
    default: 0
    visibility: veiled
    label: "Suspicion"

# Which declared values a save row shows. The meters, not the clock: a
# column that reads 0 on most rows helps nobody choose a save.
summary:
  - favor
  - composure
