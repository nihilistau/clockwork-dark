# {{title}} -- who is where, hour by hour.
#
# Read by engine/world/npc_sim.py via `paths.npc_schedules`. THIS FILE EXISTS
# BECAUSE THE ECONOMY DOES: every top-level key in data/economy.yaml must be
# an npc id declared here -- a vendor with stock but no schedule is a shop the
# player can never stand in front of, and the content validator
# (engine/games/validation.py) treats that as an error, not a style choice.
#
# WHAT THE SIMULATOR READS per character:
#   home                fallback location when no routine slot matches the hour
#   routine[].hours     0-23 world-clock hours, taken modulo 24
#   routine[].location  MUST be an id in data/world/locations.yaml
#   routine[].activity  lands VERBATIM in the narrator's prompt -- write what a
#                       person in the doorway could see, not a job title
#   name, role          used when nothing procedural supplies them
#
# EVERY CHARACTER COVERS ALL 24 HOURS. A gap falls back to `home` with a
# default activity, which reads as someone standing still doing nothing
# describable -- fine as a safety net, wrong as a routine.
#
# Version: v0.1.0

version: 1

npcs:
  npc_miller:
    name: "The Miller"
    role: vendor
    home: the_mill
    routine:
      - { hours: [6, 7, 8, 9, 10, 11], location: the_mill, activity: "hauling sacks to the stones, dusted white to the elbow" }
      - { hours: [12, 13, 14, 15, 16, 17], location: village_green, activity: "selling bread off a board trestle, arguing prices cheerfully" }
      - { hours: [18, 19, 20, 21], location: the_mill, activity: "sweeping the millfloor by lamplight" }
      - { hours: [22, 23, 0, 1, 2, 3, 4, 5], location: the_mill, activity: "asleep above the stones", available: false }
