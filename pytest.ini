[pytest]
testpaths = tests
pythonpath = .
markers =
    live: this test is ALLOWED to open a real connection to the model server.
        Everything else is blocked by the autouse guard in tests/conftest.py --
        see its docstring for why (69% of the suite's wall clock was one file
        calling LM Studio while believing it was mocked).
    real_discovery: this test is ABOUT model discovery, so the conftest pin that
        answers it with an empty model list must not replace the code under
        test. The socket guard still applies -- the test's own mocks have to be
        complete.
