<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Your account</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #080b0b; color: #e4dcca; font-family: Georgia, "Times New Roman", serif; }
    main { width: min(24rem, 90vw); padding: 2rem; border: 1px solid #3a3326; background: #0f1312; }
    h1 { margin: 0 0 .4rem; font-size: 1.4rem; font-weight: normal; letter-spacing: .04em; }
    h2 { margin: 1.4rem 0 0; font-size: 1.05rem; font-weight: normal; color: #b9ad94; }
    label { display: block; margin: .9rem 0 .3rem; font-size: .9rem; color: #b9ad94; }
    input { width: 100%; box-sizing: border-box; padding: .55rem .6rem; font: inherit;
            background: #080b0b; color: #e4dcca; border: 1px solid #3a3326; }
    button { margin-top: 1.2rem; width: 100%; padding: .6rem; font: inherit; cursor: pointer;
             background: #2a2418; color: #e4dcca; border: 1px solid #c9a86a; }
    a { color: #c9a86a; }
    .message { margin: 1rem 0 0; padding: .6rem .7rem; border-left: 3px solid #c9a86a; background: #16140f; }
    .row { display: flex; gap: 1rem; align-items: center; justify-content: space-between; margin-top: 1.6rem; }
    .row form button { width: auto; margin: 0; padding: .45rem 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>{{ account.name }}</h1>
    {% if message %}<p class="message">{{ message }}</p>{% endif %}
    <h2>Change your password</h2>
    <form method="post" action="/account">
      <input type="hidden" name="csrf" value="{{ csrf }}" />
      <label for="current">{% if must_change %}One-time password{% else %}Current password{% endif %}</label>
      <input id="current" name="current" type="password" autocomplete="current-password" required />
      <label for="new">New password (at least 10 characters)</label>
      <input id="new" name="new" type="password" autocomplete="new-password" minlength="10" required />
      <label for="confirm">New password, again</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" required />
      <button type="submit">Change password</button>
    </form>
    <div class="row">
      {% if must_change %}<span></span>{% else %}<a href="/">Back to the game</a>{% endif %}
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}" />
        <button type="submit">Log out</button>
      </form>
    </div>
  </main>
</body>
</html>
