<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="referrer" content="no-referrer" />
  <title>{% block title %}Admin{% endblock %} - The Clockwork Dark</title>
  <link rel="stylesheet" href="/admin/static/admin.css" />
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <span class="brand">Admin</span>
    {% if admin %}
    <nav>
      <a href="/admin"{% if page == "overview" %} aria-current="page"{% endif %}>Overview</a>
      <a href="/admin/users"{% if page == "users" %} aria-current="page"{% endif %}>Users</a>
      <a href="/admin/sessions"{% if page == "sessions" %} aria-current="page"{% endif %}>Sessions</a>
      <a href="/admin/saves"{% if page == "saves" %} aria-current="page"{% endif %}>Saves</a>
      <a href="/admin/stories"{% if page == "stories" %} aria-current="page"{% endif %}>Stories</a>
      <a href="/admin/model"{% if page == "model" %} aria-current="page"{% endif %}>Model server</a>
      <a href="/admin/queue"{% if page == "queue" %} aria-current="page"{% endif %}>Queue</a>
      <a href="/admin/metrics"{% if page == "metrics" %} aria-current="page"{% endif %}>Metrics</a>
      <a href="/admin/errors"{% if page == "errors" %} aria-current="page"{% endif %}>Errors</a>
      <a href="/admin/audit"{% if page == "audit" %} aria-current="page"{% endif %}>Audit</a>
      <a href="/">Back to the game</a>
    </nav>
    <span class="who">{{ admin.name }}</span>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}" />
      <button type="submit" class="link">Log out</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% if message %}<p class="message" role="status">{{ message }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
